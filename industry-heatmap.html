<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>启动前夕行业热力曲线</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <link href="./assets/styles/observatory-governance.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: var(--oc-font-stack);
      background: linear-gradient(180deg, #060d1a 0%, #0b1326 22%, #0f172a 100%);
      color: #dbe5f4;
      padding-top: 82px;
    }
    .shell-wrap { max-width: 1480px; margin: 0 auto; padding: 18px 18px 32px; }
    .hero {
      position: relative; overflow: hidden; color: #fff;
      background: linear-gradient(135deg, rgba(15,23,42,.96) 0%, rgba(17,36,64,.94) 45%, rgba(20,55,105,.9) 100%);
      border: 1px solid rgba(148,163,184,.14); border-radius: 26px; box-shadow: 0 20px 50px rgba(2,6,23,.28);
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px; opacity: .14; pointer-events: none;
    }
    .hero-inner { padding: 24px 24px 26px; position: relative; z-index: 1; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    .hero-main, .hero-side, .section-card, .metric-card, .summary-card, .table-shell, .control-card, .signal-card {
      background: linear-gradient(180deg, rgba(15,23,42,.88), rgba(15,23,42,.72));
      border: 1px solid rgba(148,163,184,.14); border-radius: 22px; box-shadow: 0 16px 34px rgba(2,6,23,.18);
    }
    .hero-main, .hero-side { padding: 22px; }
    .brand-kicker, .status-chip, .pill {
      display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; font-size: 12px; font-weight: 800;
    }
    .brand-kicker { padding: 6px 12px; letter-spacing: .12em; text-transform: uppercase; color: #dbeafe; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); }
    .status-inline { display: flex; flex-wrap: wrap; gap: 8px; }
    .status-chip { padding: 6px 12px; color: #eff6ff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
    .hero-title { margin: 0; font-size: 36px; line-height: 1.12; font-weight: 900; color: #f8fbff; }
    .hero-sub { margin: 10px 0 0; color: #dbeafe; font-size: 15px; line-height: 1.75; max-width: 760px; }
    .hero-answer { margin-top: 16px; padding: 14px 16px; border-radius: 18px; background: rgba(15,23,42,.22); border: 1px solid rgba(255,255,255,.1); }
    .hero-answer-label { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #bfdbfe; text-transform: uppercase; }
    .hero-answer-text { margin-top: 8px; font-size: 15px; line-height: 1.8; color: #f8fafc; }
    .theme-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .theme-note { padding: 12px 14px; border-radius: 16px; background: rgba(15,23,42,.72); border: 1px solid rgba(148,163,184,.14); }
    .theme-note-label { color: #8ea3bf; font-size: 12px; }
    .theme-note-value { margin-top: 6px; color: #f8fbff; font-size: 15px; font-weight: 800; line-height: 1.5; }
    .sticky-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      background: rgba(2,6,23,.92); border-bottom: 1px solid rgba(148,163,184,.14); box-shadow: 0 14px 36px rgba(2,6,23,.28);
    }
    .sticky-nav-inner { max-width: 1480px; margin: 0 auto; padding: 14px 18px; min-height: 82px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 10px; }
    .nav-link { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; text-decoration:none; color:#94a3b8; font-size:13px; font-weight:700; border:1px solid transparent; transition:all .18s ease; }
    .nav-link:hover { color:#e5efff; background:rgba(37,99,235,.12); border-color:rgba(96,165,250,.18); }
    .nav-link.active { color:#fff; background:linear-gradient(135deg,#2563eb 0%,#3b82f6 100%); border-color:rgba(96,165,250,.28); box-shadow:0 12px 28px rgba(37,99,235,.28); }
    .nav-caption { font-size:12px; font-weight:800; color:#8ea3bf; }
    .stitch-top-actions { display:flex; align-items:center; gap:12px; margin-left:auto; }
    .stitch-search { position:relative; display:none; }
    .stitch-search input { width:270px; padding:10px 14px; border-radius:14px; border:1px solid rgba(148,163,184,.14); background:rgba(15,23,42,.78); color:#dbe5f4; font-size:12px; outline:none; }
    .stitch-icon-btn { width:auto; min-width:0; height:36px; padding:0 14px; border-radius:12px; border:1px solid rgba(148,163,184,.12); background:rgba(15,23,42,.72); color:#a9bdd6; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; white-space:nowrap; }
    .stitch-avatar { width:36px; height:36px; border-radius:999px; border:1px solid rgba(148,163,184,.16); box-shadow:0 8px 20px rgba(2,6,23,.22); display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#2563eb,#38bdf8); color:#fff; font-size:12px; font-weight:900; }
    .stitch-side-rail { position:fixed; left:0; top:0; bottom:0; width:258px; z-index:32; padding:92px 18px 22px; background:rgba(2,6,23,.96); border-right:1px solid rgba(148,163,184,.12); box-shadow:0 20px 60px rgba(2,6,23,.35); display:none; }
    .stitch-side-brand { display:flex; align-items:center; gap:12px; margin-bottom:22px; padding:0 10px 14px; border-bottom:1px solid rgba(148,163,184,.1); }
    .stitch-side-dot { width:10px; height:10px; border-radius:999px; background:#38bdf8; box-shadow:0 0 12px rgba(56,189,248,.55); }
    .stitch-side-title { font-size:15px; font-weight:900; color:#f8fbff; }
    .stitch-side-sub { font-size:11px; color:#7f93af; text-transform:uppercase; letter-spacing:.12em; margin-top:2px; }
    .stitch-side-nav { display:grid; gap:8px; }
    .stitch-side-link { display:flex; align-items:center; gap:0; padding:12px 14px; border-radius:16px; color:#90a4c2; text-decoration:none; font-size:13px; font-weight:800; border:1px solid transparent; transition:all .18s ease; }
    .stitch-side-link:hover { color:#fff; background:rgba(37,99,235,.12); border-color:rgba(96,165,250,.16); transform:translateX(2px); }
    .stitch-side-link.active { color:#fff; background:linear-gradient(135deg, rgba(37,99,235,.22), rgba(14,165,233,.1)); border-color:rgba(96,165,250,.24); }
    .stitch-side-foot { position:absolute; left:18px; right:18px; bottom:22px; }
    .stitch-side-status { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background:rgba(16,185,129,.1); color:#86efac; font-size:11px; font-weight:800; }
    .section-head { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px; padding:22px 22px 0; }
    .section-kicker { font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:#8ea3bf; }
    .section-title { margin:6px 0 0; font-size:24px; font-weight:900; color:#f8fbff; }
    .section-sub { margin:8px 0 0; color:#8ea3bf; font-size:13px; line-height:1.7; }
    .metrics-grid { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:14px; padding:18px 22px 0; }
    .metric-card { padding:16px; }
    .metric-label { color:#8ea3bf; font-size:12px; }
    .metric-value { margin-top:8px; font-size:26px; font-weight:900; color:#f8fbff; line-height:1; }
    .metric-note { margin-top:8px; font-size:12px; color:#8ea3bf; }
    .controls-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; padding:18px 22px 22px; }
    .control-input { background:rgba(15,23,42,.72); color:#dbe5f4; border:1px solid rgba(148,163,184,.16); border-radius:14px; padding:12px 14px; font-size:13px; outline:none; }
    .control-input:focus { border-color:#60a5fa; box-shadow:0 0 0 3px rgba(37,99,235,.10); }
    .signal-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; padding:18px 22px 22px; }
    .signal-card { padding:14px; cursor:pointer; transition: all .18s ease; }
    .signal-card:hover { transform: translateY(-2px); border-color: rgba(96,165,250,.22); }
    .signal-name { font-size:14px; font-weight:800; color:#f8fbff; }
    .signal-sub { margin-top:8px; font-size:12px; line-height:1.65; color:#8ea3bf; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; }
    .badge.hot { background:rgba(248,113,113,.18); color:#fecaca; }
    .badge.cool { background:rgba(16,185,129,.18); color:#86efac; }
    .badge.turn { background:rgba(251,191,36,.18); color:#fde68a; }
    .badge.gray { background:rgba(148,163,184,.18); color:#cbd5e1; }
    .chart-shell { padding:18px 22px 22px; }
    .chart-wrap { position:relative; overflow-x:auto; overflow-y:visible; border-radius:18px; border:1px solid rgba(148,163,184,.14); padding:14px; background:rgba(15,23,42,.58); }
    .heat-cell { min-width:72px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
    .heat-cell:hover { transform:translateY(-1px); box-shadow:0 4px 14px rgba(15,23,42,.10); }
    .grid-wrap { overflow:auto; }
    .sticky-col { position: sticky; left: 0; background: #0f172a; z-index: 2; }
    .legend-line { height:3px; border-radius:999px; }
    .tooltip {
      pointer-events:none; position:fixed; z-index:9999; background:#1e293b; color:#fff; font-size:12px; border-radius:10px; padding:10px 12px;
      box-shadow:0 18px 42px rgba(2,6,23,.35); max-width:280px;
    }
    .table-shell { overflow:auto; margin:18px 22px 22px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px 14px; border-bottom:1px solid rgba(148,163,184,.12); text-align:left; vertical-align:top; }
    th { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#8ea3bf; }
    td { font-size:13px; color:#dbe5f4; }
    .obs-footer { margin-top:72px; border-top:1px solid rgba(148,163,184,.12); background:rgba(2,6,23,.74); }
    .obs-footer-inner { max-width:1480px; margin:0 auto; padding:28px 18px 38px; display:grid; grid-template-columns:1.2fr .8fr; gap:20px; align-items:start; }
    .obs-footer-brand { font-size:18px; font-weight:900; color:#f8fbff; }
    .obs-footer-copy, .obs-footer-note { color:#8ea3bf; font-size:12px; line-height:1.8; }
    .obs-footer-status { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:rgba(16,185,129,.12); color:#86efac; font-size:11px; font-weight:800; }
    @media (min-width: 1280px) {
      .stitch-side-rail { display:block; }
      .sticky-nav { left:258px; }
      .sticky-nav-inner, .shell-wrap, .obs-footer-inner { max-width:none; padding-left:288px; padding-right:28px; }
      .stitch-search { display:block; }
    }
    @media (max-width: 1200px) {
      .hero-grid, .signal-grid { grid-template-columns:1fr 1fr; }
      .metrics-grid, .controls-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    }
    @media (max-width: 860px) {
      .hero-grid, .signal-grid, .metrics-grid, .controls-grid { grid-template-columns:1fr 1fr; }
      .stitch-top-actions { width:100%; justify-content:space-between; }
      .stitch-search { display:block; flex:1; }
      .stitch-search input { width:100%; }
      .obs-footer-inner { grid-template-columns:1fr; }
    }
    @media (max-width: 640px) {
      body { padding-top:76px; }
      .hero-title { font-size:28px; }
      .hero-grid, .signal-grid, .controls-grid { grid-template-columns:1fr; }
      .metrics-grid { grid-template-columns:1fr 1fr; }
      .shell-wrap, .sticky-nav-inner, .obs-footer-inner { padding-left:14px; padding-right:14px; }
      .section-head, .metrics-grid, .controls-grid, .signal-grid, .chart-shell { padding-left:16px; padding-right:16px; }
      .table-shell { margin-left:16px; margin-right:16px; }
    }
  </style>
</head>
<body>
<div id="app">
  <aside class="stitch-side-rail">
    <div class="stitch-side-brand">
      <div class="stitch-side-dot"></div>
      <div>
        <div class="stitch-side-title">A股观测台</div>
        <div class="stitch-side-sub">量化决策工作台</div>
      </div>
    </div>
    <nav class="stitch-side-nav">
      <a class="stitch-side-link" href="./index.html"><span>总控台</span></a>
      <a class="stitch-side-link" href="./market-overview.html"><span>市场驾驶舱</span></a>
      <a class="stitch-side-link" href="./strategy-vs-market.html"><span>策略中心</span></a>
      <a class="stitch-side-link" href="./decision-candidates.html"><span>候选执行</span></a>
      <a class="stitch-side-link" href="./research-lab.html"><span>复盘研究</span></a>
      <a class="stitch-side-link" href="./recommendation-review.html"><span>复盘明细</span></a>
      <a class="stitch-side-link" href="./industry-compare.html"><span>统一决策</span></a>
      <a class="stitch-side-link active" href="./industry-heatmap.html"><span>策略热力</span></a>
      <a class="stitch-side-link" href="./market-industry-heatmap.html"><span>市场热力</span></a>
    </nav>
    <div class="stitch-side-foot"><div class="stitch-side-status"><span>系统在线</span></div></div>
  </aside>

  <div class="sticky-nav">
    <div class="sticky-nav-inner">
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div class="nav-caption">路径：总控台 → 专题页 → 启动前夕行业热力</div>
        <div class="nav-links">
          <a href="./index.html" class="nav-link">总控台</a>
          <a href="./industry-compare.html" class="nav-link">统一决策</a>
          <a href="./industry-heatmap.html" class="nav-link active">策略行业热力</a>
          <a href="./market-industry-heatmap.html" class="nav-link">全市场行业热力</a>
        </div>
      </div>
      <div class="stitch-top-actions">
        <div class="stitch-search"><input placeholder="搜索行业或日期" /></div>
        <button class="stitch-icon-btn">刷新数据</button>
        <button class="stitch-icon-btn">热力筛选</button>
        <div class="stitch-avatar">鱼</div>
      </div>
    </div>
  </div>

  <main class="shell-wrap">
    <div v-if="loading" class="section-card" style="padding:36px;text-align:center;color:#8ea3bf;">加载行业热力数据中...</div>
    <div v-else-if="error" class="section-card" style="padding:36px;text-align:center;color:#fecaca;">{{ error }}</div>
    <template v-else>
      <section class="hero">
        <div class="hero-inner">
          <div class="brand-kicker">启动前夕行业热力</div>
          <div class="status-inline" style="margin-top:14px;">
            <span class="status-chip">最新推荐日 {{ data.latest_recommend_date || '-' }}</span>
            <span class="status-chip">日期覆盖 {{ data.date_range?.date_count || 0 }} 天</span>
            <span class="status-chip">行业数 {{ sectorOptions.length }}</span>
          </div>
          <div class="hero-grid" style="margin-top:16px;">
            <div class="hero-main">
              <h1 class="hero-title">启动前夕行业热力曲线</h1>
              <p class="hero-sub">按行业聚合启动前夕推荐复盘库，用热力矩阵和趋势折线看行业轮动、升温与降温。</p>
              <div class="hero-answer">
                <div class="hero-answer-label">专题结论</div>
                <div class="hero-answer-text">{{ headline }}</div>
              </div>
            </div>
            <div class="hero-side">
              <div class="theme-grid">
                <div class="theme-note"><div class="theme-note-label">默认行业</div><div class="theme-note-value">{{ latestTopRows[0]?.sector_name || '暂无' }}</div></div>
                <div class="theme-note"><div class="theme-note-label">TopN</div><div class="theme-note-value">{{ topN }}</div></div>
                <div class="theme-note"><div class="theme-note-label">当前指标</div><div class="theme-note-value">{{ metricLabel }}</div></div>
                <div class="theme-note"><div class="theme-note-label">选中行业</div><div class="theme-note-value">{{ selectedSector || '未选择' }}</div></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head"><div><div class="section-kicker">控制台</div><div class="section-title">指标 / 范围 / 行业数</div></div></div>
        <div class="controls-grid">
          <select v-model="metric" class="control-input">
            <option value="heat_ema_5">热度EMA(5)</option>
            <option value="heat_base">基础热度</option>
            <option value="avg_next_day_return_pct">次日平均收益</option>
            <option value="avg_cumulative_return_pct">累计平均收益</option>
            <option value="avg_ai_score">平均AI评分</option>
            <option value="recommendation_count">推荐数量</option>
          </select>
          <select v-model="trendMetric" class="control-input">
            <option value="heat_ema_5">趋势图：热度EMA(5)</option>
            <option value="heat_base">趋势图：基础热度</option>
            <option value="avg_next_day_return_pct">趋势图：次日平均收益</option>
            <option value="avg_cumulative_return_pct">趋势图：累计平均收益</option>
          </select>
          <select v-model.number="topN" class="control-input">
            <option :value="10">Top 10 行业</option>
            <option :value="15">Top 15 行业</option>
            <option :value="20">Top 20 行业</option>
            <option :value="30">Top 30 行业</option>
          </select>
          <select v-model="fromDate" class="control-input">
            <option value="">起始日期</option>
            <option v-for="d in dateOptions" :key="d" :value="d">{{ d }}</option>
          </select>
          <button class="stitch-icon-btn" style="width:100%; justify-content:center; height:46px;" @click="resetFilters">重置</button>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div><div class="section-kicker">热力折线</div><div class="section-title">行业趋势图</div><div class="section-sub">默认显示最新推荐日 Top {{ topN }} 行业。</div></div>
          <div class="nav-caption">指标：{{ trendMetricLabel }}</div>
        </div>
        <div class="chart-shell">
          <div class="chart-wrap">
            <svg :width="chartWidth" :height="chartHeight" class="block">
              <g>
                <line v-for="y in [20,90,160,230,300]" :key="'gy-'+y" :x1="50" :x2="chartWidth-20" :y1="y" :y2="y" stroke="#334155" stroke-width="1" />
                <line x1="50" :x2="50" y1="20" :y2="chartHeight-30" stroke="#64748b" stroke-width="1.5" />
                <line x1="50" :x2="chartWidth-20" :y1="chartHeight-30" :y2="chartHeight-30" stroke="#64748b" stroke-width="1.5" />
                <text v-for="tick in chartTicks" :key="'tick-'+tick.value" x="44" :y="tick.y+4" text-anchor="end" font-size="11" fill="#94a3b8">{{ tick.label }}</text>
                <g v-for="(d, idx) in visibleDates" :key="'x-'+d"><text :x="xForIndex(idx)" :y="chartHeight-10" text-anchor="middle" font-size="11" fill="#94a3b8">{{ d.slice(4) }}</text></g>
                <g v-for="series in trendSeries" :key="series.sector">
                  <polyline :points="series.points" fill="none" :stroke="series.color" :stroke-width="hoveredSector === series.sector ? 5 : 3" :opacity="hoveredSector && hoveredSector !== series.sector ? 0.18 : 1" stroke-linejoin="round" stroke-linecap="round"></polyline>
                  <polyline :points="series.points" fill="none" stroke="transparent" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" @mousemove="showLineTooltip(series, $event)" @mouseleave="hideLineTooltip()"></polyline>
                </g>
              </g>
            </svg>
            <div v-if="lineTooltip.visible" class="tooltip" :style="lineTooltip.style">
              <div class="font-semibold">{{ lineTooltip.sector }}</div>
              <div>当前指标：{{ trendMetricLabel }}</div>
              <div>最新值：{{ fmtValue(lineTooltip.latestValue) }}</div>
              <div v-if="lineTooltip.latestRow">3日斜率：{{ fmtValue(lineTooltip.latestRow.heat_slope_3d) }} ｜ 5日斜率：{{ fmtValue(lineTooltip.latestRow.heat_slope_5d) }}</div>
              <div v-if="lineTooltip.latestRow">趋势信号：{{ lineTooltip.latestRow.trend_signal }}</div>
            </div>
          </div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head"><div><div class="section-kicker">信号卡</div><div class="section-title">最新推荐日行业信号</div></div></div>
        <div class="signal-grid">
          <div v-for="row in latestSignalRows.slice(0, topN)" :key="row.sector_name" class="signal-card" @click="selectCell(row.sector_name, data.latest_recommend_date)">
            <div class="mini-top"><div class="signal-name">{{ row.sector_name }}</div><span class="badge" :class="signalBadgeClass(row.trend_signal)">{{ row.trend_signal }}</span></div>
            <div class="signal-sub">3日斜率 {{ fmtValue(row.heat_slope_3d) }} ｜ 5日斜率 {{ fmtValue(row.heat_slope_5d) }}</div>
            <div class="signal-sub">推荐 {{ row.recommendation_count }} ｜ AI均分 {{ fmtValue(row.avg_ai_score) }}</div>
          </div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head"><div><div class="section-kicker">矩阵</div><div class="section-title">行业热力矩阵</div><div class="section-sub">点击单元格查看该行业该日的股票明细。</div></div></div>
        <div class="table-shell">
          <div class="grid-wrap">
            <table>
              <thead>
                <tr>
                  <th class="sticky-col">行业</th>
                  <th v-for="d in visibleDates" :key="d">{{ d }}</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="sector in visibleSectors" :key="sector">
                  <td class="sticky-col" style="font-weight:800;">{{ sector }}</td>
                  <td v-for="d in visibleDates" :key="sector + '-' + d">
                    <div class="heat-cell" :style="heatStyle(cellValue(sector, d))" @click="selectCell(sector, d)" @mouseenter="showTooltip(sector, d, $event)" @mouseleave="hideTooltip()">{{ fmtValue(cellValue(sector, d)) }}</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-if="tooltip.visible" class="tooltip" :style="tooltip.style">
            <div class="font-semibold">{{ tooltip.data.sector_name }} / {{ tooltip.data.recommend_date }}</div>
            <div>推荐数：{{ tooltip.data.recommendation_count }}</div>
            <div>AI均分：{{ fmtValue(tooltip.data.avg_ai_score) }}</div>
            <div>次日均收：{{ fmtPct(tooltip.data.avg_next_day_return_pct) }}</div>
            <div>累计均收：{{ fmtPct(tooltip.data.avg_cumulative_return_pct) }}</div>
            <div>趋势：{{ tooltip.data.trend_signal }}</div>
          </div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head"><div><div class="section-kicker">下钻</div><div class="section-title">行业对应推荐明细</div><div class="section-sub">按所选行业/日期展开股票列表。</div></div></div>
        <div class="table-shell" v-if="selectedSector">
          <table>
            <thead>
              <tr>
                <th>推荐日期</th>
                <th>股票</th>
                <th>AI观点</th>
                <th>AI评分</th>
                <th>次日涨幅</th>
                <th>累计涨幅</th>
                <th>推荐次数</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="row in selectedDetailRows" :key="row.recommend_date + row.stock_code">
                <td>{{ row.recommend_date }}</td>
                <td><div style="font-weight:800;">{{ row.stock_name }}</div><div style="font-size:11px;color:#8ea3bf;">{{ row.stock_code }}</div></td>
                <td>{{ row.ai_view || '-' }}</td>
                <td>{{ fmtValue(row.ai_score) }}</td>
                <td>{{ fmtPct(row.next_day_return_pct) }}</td>
                <td>{{ fmtPct(row.cumulative_return_pct) }}</td>
                <td>{{ row.cumulative_recommend_count || 0 }}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div v-else style="padding:0 22px 22px;color:#8ea3bf;font-size:13px;">还没有选择行业。点击上方信号卡或热力矩阵即可查看明细。</div>
      </section>
    </template>
  </main>

  <footer class="obs-footer">
    <div class="obs-footer-inner">
      <div><div class="obs-footer-brand">A股观测台</div><div class="obs-footer-copy">量化判断界面，不构成投资建议。</div></div>
      <div><div class="obs-footer-status">系统在线</div><div class="obs-footer-note" style="margin-top:10px;">策略热力页：看启动前夕行业轮动与股票下钻。</div></div>
    </div>
  </footer>
</div>
<script>
Vue.createApp({
  data() {
    return {
      loading: true,
      error: '',
      data: {},
      rows: [],
      detailRowsAll: [],
      metric: 'heat_ema_5',
      trendMetric: 'heat_ema_5',
      topN: 15,
      fromDate: '',
      selectedSector: '',
      selectedDate: '',
      tooltip: { visible: false, data: {}, style: {} },
      lineTooltip: { visible: false, sector: '', latestValue: null, latestRow: null, style: {} },
      hoveredSector: '',
      linePalette: ['#2563eb', '#dc2626', '#059669', '#7c3aed', '#ea580c', '#0f766e', '#be123c', '#4338ca', '#16a34a', '#ca8a04']
    };
  },
  computed: {
    metricLabel() {
      const map = {
        heat_ema_5: '热度EMA(5)',
        heat_base: '基础热度',
        avg_next_day_return_pct: '次日平均收益',
        avg_cumulative_return_pct: '累计平均收益',
        avg_ai_score: '平均AI评分',
        recommendation_count: '推荐数量'
      };
      return map[this.metric] || this.metric;
    },
    headline() {
      const top = this.latestTopRows[0];
      if (!top) return '暂无行业热力结果。';
      return `当前热度领先的是 ${top.sector_name}，趋势 ${top.trend_signal}，推荐 ${top.recommendation_count} 次，适合继续下钻到个股明细。`;
    },
    dateOptions() {
      return [...new Set(this.rows.map(x => x.recommend_date))].sort();
    },
    filteredRows() {
      let rows = [...this.rows];
      if (this.fromDate) rows = rows.filter(r => String(r.recommend_date) >= this.fromDate);
      return rows;
    },
    sectorOptions() {
      const latest = this.data.latest_recommend_date;
      const latestRows = this.filteredRows.filter(r => r.recommend_date === latest);
      return [...latestRows].sort((a, b) => (b.heat_ema_5 || -999) - (a.heat_ema_5 || -999)).map(r => r.sector_name);
    },
    visibleSectors() {
      return this.sectorOptions.slice(0, this.topN);
    },
    visibleDates() {
      return this.dateOptions.filter(d => !this.fromDate || String(d) >= this.fromDate);
    },
    latestTopRows() {
      return this.filteredRows
        .filter(r => r.recommend_date === this.data.latest_recommend_date && this.visibleSectors.includes(r.sector_name))
        .sort((a, b) => (b[this.metric] || 0) - (a[this.metric] || 0));
    },
    latestSignalRows() {
      return this.filteredRows
        .filter(r => r.recommend_date === this.data.latest_recommend_date && this.visibleSectors.includes(r.sector_name))
        .sort((a, b) => (b.heat_slope_3d || -999) - (a.heat_slope_3d || -999));
    },
    detailRows() {
      return this.filteredRows
        .filter(r => this.visibleSectors.includes(r.sector_name))
        .sort((a, b) => String(b.recommend_date).localeCompare(String(a.recommend_date)) || (b.heat_ema_5 || 0) - (a.heat_ema_5 || 0));
    },
    selectedDetailRows() {
      if (!this.selectedSector) return [];
      let rows = this.detailRowsAll.filter(r => r.sector_name === this.selectedSector);
      if (this.selectedDate) rows = rows.filter(r => r.recommend_date === this.selectedDate);
      return rows.sort((a, b) => String(b.recommend_date).localeCompare(String(a.recommend_date)) || (a.rank_no || 999) - (b.rank_no || 999));
    },
    chartWidth() { return Math.max(820, this.visibleDates.length * 70 + 80); },
    chartHeight() { return 340; },
    trendMetricLabel() {
      const map = {
        heat_ema_5: '热度EMA(5)',
        heat_base: '基础热度',
        avg_next_day_return_pct: '次日平均收益',
        avg_cumulative_return_pct: '累计平均收益'
      };
      return map[this.trendMetric] || this.trendMetric;
    },
    trendValues() {
      const vals = [];
      for (const sector of this.visibleSectors) {
        for (const d of this.visibleDates) {
          const row = this.filteredRows.find(r => r.sector_name === sector && r.recommend_date === d);
          const val = row ? Number(row[this.trendMetric]) : NaN;
          if (!Number.isNaN(val)) vals.push(val);
        }
      }
      return vals;
    },
    chartRange() {
      const vals = this.trendValues;
      const min = vals.length ? Math.min(...vals) : 0;
      const max = vals.length ? Math.max(...vals) : 1;
      const pad = (max - min || 1) * 0.12;
      return { min: min - pad, max: max + pad };
    },
    chartTicks() {
      const { min, max } = this.chartRange;
      const ticks = [];
      for (let i = 0; i < 5; i++) {
        const value = max - ((max - min) * i / 4);
        ticks.push({ value, y: this.yForValue(value), label: this.fmtValue(value) });
      }
      return ticks;
    },
    trendSeries() {
      return this.visibleSectors.map((sector, idx) => {
        const color = this.linePalette[idx % this.linePalette.length];
        const pts = [];
        let latestValue = null;
        let latestRow = null;
        this.visibleDates.forEach((d, i) => {
          const row = this.filteredRows.find(r => r.sector_name === sector && r.recommend_date === d);
          const val = row ? Number(row[this.trendMetric]) : NaN;
          if (!Number.isNaN(val)) {
            pts.push(`${this.xForIndex(i)},${this.yForValue(val)}`);
            latestValue = val;
            latestRow = row;
          }
        });
        return { sector, color, points: pts.join(' '), latestValue, latestRow };
      }).filter(s => s.points);
    }
  },
  methods: {
    resetFilters() {
      this.metric = 'heat_ema_5';
      this.trendMetric = 'heat_ema_5';
      this.topN = 15;
      this.fromDate = '';
      this.selectedSector = '';
      this.selectedDate = '';
    },
    xForIndex(idx) {
      if (this.visibleDates.length <= 1) return 50;
      const usable = this.chartWidth - 70;
      return 50 + (usable * idx / (this.visibleDates.length - 1));
    },
    yForValue(value) {
      const { min, max } = this.chartRange;
      const usable = this.chartHeight - 50;
      const ratio = (value - min) / ((max - min) || 1);
      return 20 + usable - ratio * usable;
    },
    selectCell(sector, date) {
      this.selectedSector = sector;
      this.selectedDate = date;
    },
    showTooltip(sector, date, event) {
      const row = this.filteredRows.find(r => r.sector_name === sector && r.recommend_date === date);
      if (!row) return;
      this.tooltip = {
        visible: true,
        data: row,
        style: { left: `${event.clientX + 12}px`, top: `${event.clientY + window.scrollY + 12}px` }
      };
    },
    hideTooltip() { this.tooltip.visible = false; },
    showLineTooltip(series, event) {
      this.hoveredSector = series.sector;
      this.lineTooltip = {
        visible: true,
        sector: series.sector,
        latestValue: series.latestValue,
        latestRow: series.latestRow,
        style: { left: `${event.clientX + 12}px`, top: `${event.clientY + 12}px` }
      };
    },
    hideLineTooltip() {
      this.lineTooltip.visible = false;
      this.hoveredSector = '';
    },
    cellValue(sector, date) {
      const row = this.filteredRows.find(r => r.sector_name === sector && r.recommend_date === date);
      return row ? row[this.metric] : null;
    },
    fmtValue(v) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return Number.isNaN(n) ? '-' : n.toFixed(2);
    },
    fmtPct(v) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return Number.isNaN(n) ? '-' : `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
    },
    heatStyle(value) {
      if (value === null || value === undefined || value === '') return { background:'rgba(148,163,184,0.12)', color:'#64748b' };
      const n = Number(value);
      if (Number.isNaN(n)) return { background:'rgba(148,163,184,0.12)', color:'#64748b' };
      const baseMetric = this.metric.includes('return') ? Math.abs(n) / 8 : Math.abs(n);
      const intensity = Math.max(0.12, Math.min(baseMetric, 1));
      return n >= 0
        ? { background:`rgba(220,38,38,${0.12 + intensity * 0.35})`, color: intensity > 0.45 ? '#fff' : '#fecaca' }
        : { background:`rgba(5,150,105,${0.12 + intensity * 0.35})`, color: intensity > 0.45 ? '#fff' : '#86efac' };
    },
    signalBadgeClass(signal) {
      if (signal === '升温') return 'hot';
      if (signal === '降温') return 'cool';
      if (signal === '拐点') return 'turn';
      return 'gray';
    }
  },
  async mounted() {
    try {
      const params = new URLSearchParams(window.location.search);
      const [heatResp, detailResp] = await Promise.all([
        fetch('data/recommendation_analytics/industry_heatmap.json?' + Date.now(), { cache:'no-store' }),
        fetch('data/recommendation_analytics/prebreakout_recommendations.json?' + Date.now(), { cache:'no-store' })
      ]);
      if (!heatResp.ok) throw new Error('industry_heatmap.json not found');
      if (!detailResp.ok) throw new Error('prebreakout_recommendations.json not found');
      this.data = await heatResp.json();
      this.rows = this.data.rows || [];
      const detail = await detailResp.json();
      this.detailRowsAll = detail.rows || [];
      const sector = params.get('sector');
      const date = params.get('date');
      if (sector) this.selectedSector = sector;
      if (date) this.selectedDate = date;
    } catch (err) {
      this.error = err?.message || 'unknown error';
      console.error(err);
    } finally {
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
