name: pages-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      is_holiday: ${{ steps.market-holiday-check.outputs.is_holiday }}
    steps:
      - uses: actions/checkout@v4
      - name: Pre-flight: check A-share market holiday
        id: market-holiday-check
        run: python3 scripts/check_market_holiday.py
      - uses: actions/setup-python@v5
        if: steps.market-holiday-check.outputs.is_holiday != 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.market-holiday-check.outputs.is_holiday != 'true'
        with:
          node-version: "22"
      - name: Test public boundary and summaries
        if: steps.market-holiday-check.outputs.is_holiday != 'true'
        run: python -m unittest discover tests -p "test_*.py" -v
      - name: Test Pages rendering
        if: steps.market-holiday-check.outputs.is_holiday != 'true'
        run: |
          node tests/render.test.mjs
          node tests/dual-track-render.test.mjs
      - name: Build sanitized Pages artifact
        if: steps.market-holiday-check.outputs.is_holiday != 'true'
        run: python scripts/build_pages_artifact.py --output _site
      - name: Configure GitHub Pages
        if: steps.market-holiday-check.outputs.is_holiday != 'true'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: steps.market-holiday-check.outputs.is_holiday != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_holiday != 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
