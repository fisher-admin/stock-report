system:
  name: greenfield-multifactor-line-a
  version: parallel-v1
  timezone: Asia/Shanghai

paths:
  workspace: /Users/fisher/.openclaw/workspace
  stock_data_root: /Users/fisher/.openclaw/workspace/stock_data
  factor_factory_root: /Users/fisher/.openclaw/workspace/factor_factory
  output_root: /Users/fisher/.openclaw/workspace/factor_factory/outputs/greenfield_multifactor/parallel_lines/line_a_liquid_sector_balance
  panel_path: /Users/fisher/.openclaw/workspace/factor_factory/data/factors/greenfield_multifactor_panel.parquet
  industry_map_path: /Users/fisher/.openclaw/workspace/stock_data/03-working/alpha_mining/tushare_pro_demo/raw/industry_20260313.parquet
  pit_financial_dir: /Users/fisher/.openclaw/workspace/stock_data/03-working/pit_financial_cache
  current_market_fingerprint_path: /Users/fisher/.openclaw/workspace/factor_factory/outputs/evolution/current_market_fingerprint.json
  regime_analog_windows_path: /Users/fisher/.openclaw/workspace/factor_factory/outputs/evolution/regime_analog_windows.json
  market_state_path: /Users/fisher/.openclaw/workspace/stock_data/03-working/health/canonical/market_state_latest.json
  market_snapshot_path: /Users/fisher/.openclaw/workspace/stock_data/03-working/health/market_snapshot_latest.json
  market_morning_brief_path: /Users/fisher/.openclaw/workspace/stock-report/data/recommendation_analytics/market_morning_brief_latest.json

history:
  start_date: 2021-01-29
  end_date: null
  latest_label_buffer_days: 1

portfolio:
  top_n: 20
  round_trip_cost: 0.002
  min_listing_days: 120

walkforward:
  train_days: 252
  validation_days: 63
  test_days: 63
  step_days: 63
  min_train_days: 160

analog_validation:
  max_windows: 10
  lookback_days: 252
  min_lookback_days: 160

scenario_meta:
  line_id: line_a_liquid_sector_balance
  scenario_name: liquid_sector_balance
  thesis: 在保持双腿稳定的前提下，提高 liquid_leadership 与 sector_rotation 占比，并用方向搜索挖掘被反向使用的潜力因子。

scoring_controls:
  direction_mode: best_of_long_short
  objective: dual_leg_stable
  c2c_weight: 0.65
  o2c_weight: 0.35
  cross_leg_penalty: 0.40
  negative_ic_penalty: 2.20
  negative_sharpe_penalty: 0.75

selection_controls:
  max_factors_per_family: 2
  min_selected_factors: 4
  min_selected_families: 3
  max_single_factor_weight: 0.34
  correlation_threshold: 0.90

family_budgets:
  shrink_uptrend:
    trend_quality: 0.12
    liquid_leadership: 0.30
    liquidity_followthrough: 0.14
    sector_rotation: 0.28
    downside_control: 0.14
    chip_resilience: 0.02
  volume_uptrend:
    trend_quality: 0.24
    liquid_leadership: 0.16
    liquidity_followthrough: 0.22
    sector_rotation: 0.20
    downside_control: 0.10
    chip_resilience: 0.08
  shrink_downtrend:
    trend_quality: 0.10
    liquid_leadership: 0.18
    liquidity_followthrough: 0.08
    sector_rotation: 0.14
    downside_control: 0.36
    chip_resilience: 0.14
  volume_downtrend:
    trend_quality: 0.08
    liquid_leadership: 0.16
    liquidity_followthrough: 0.10
    sector_rotation: 0.12
    downside_control: 0.36
    chip_resilience: 0.18
  high_vol_chop:
    trend_quality: 0.08
    liquid_leadership: 0.16
    liquidity_followthrough: 0.10
    sector_rotation: 0.12
    downside_control: 0.38
    chip_resilience: 0.16

factor_registry:
  backtestable_factors:
    - factor_id: g_trend_quality_20
      family: trend_quality
    - factor_id: g_momentum_stability_10_20
      family: trend_quality
    - factor_id: g_liquid_leadership
      family: liquid_leadership
    - factor_id: g_liquidity_followthrough
      family: liquidity_followthrough
    - factor_id: g_turnover_efficiency
      family: liquidity_followthrough
    - factor_id: g_sector_heat_alignment
      family: sector_rotation
    - factor_id: g_industry_relative_strength
      family: sector_rotation
    - factor_id: g_drawdown_resilience
      family: downside_control
    - factor_id: g_low_vol_leader
      family: downside_control
    - factor_id: g_chip_pullback_support
      family: chip_resilience
    - factor_id: g_gap_risk_filter
      family: chip_resilience
  current_only_factors:
    - factor_id: g_quality_current
      family: quality_fundamental
    - factor_id: g_balance_sheet_current
      family: quality_fundamental
