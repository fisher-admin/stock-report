history:
  start_date: 2021-01-29
  end_date: null
  latest_label_buffer_days: 1

portfolio:
  top_n: 20
  round_trip_cost: 0.002
  min_listing_days: 120
  max_names_per_industry: 2

walkforward:
  train_days: 252
  validation_days: 63
  test_days: 63
  step_days: 63
  min_train_days: 160

analog_validation:
  max_windows: 10
  lookback_days: 252
  min_lookback_days: 160

scenario_meta:
  line_id: line_d_neutral_heat_followthrough
  scenario_name: neutral_heat_followthrough
  thesis: 在 20260424 中性、主线待确认且行业热度分散的 A 股环境下，停止 line_b 的 blacklist 修补循环，转向 sector heat + liquidity followthrough 的 guarded followthrough shadow branch，并用 gap-risk 约束抑制隔夜噪音。

scoring_controls:
  direction_mode: best_of_long_short
  objective: dual_leg_stable
  c2c_weight: 0.45
  o2c_weight: 0.55
  cross_leg_penalty: 0.38
  negative_ic_penalty: 2.05
  negative_sharpe_penalty: 0.68

selection_controls:
  max_factors_per_family: 2
  min_selected_factors: 5
  min_selected_families: 4
  max_single_factor_weight: 0.28
  correlation_threshold: 0.88

