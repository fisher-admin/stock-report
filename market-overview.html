<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>市场驾驶舱</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg, #f4f7fb 0%, #edf2f7 100%); }
    .card { background: rgba(255,255,255,.94); backdrop-filter: blur(8px); }
    .metric { background:#f8fafc; border:1px solid #e5e7eb; border-radius:14px; padding:14px; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .ok { background:#dcfce7; color:#166534; }
    .warn { background:#fef3c7; color:#92400e; }
    .bad { background:#fee2e2; color:#991b1b; }
    .neutral { background:#e0f2fe; color:#075985; }
    .industry-card { border:1px solid #e5e7eb; border-radius:16px; background:linear-gradient(180deg,#fff 0%,#f8fafc 100%); padding:16px; }
  </style>
</head>
<body class="text-gray-800">
<div id="app">
  <header class="text-white px-6 py-8" style="background: linear-gradient(135deg, #16243a 0%, #264d73 48%, #3b82f6 100%);">
    <div class="max-w-7xl mx-auto flex flex-wrap items-start justify-between gap-4">
      <div>
        <div class="text-xs uppercase tracking-widest text-blue-100 mb-2">Market Layer</div>
        <h1 class="text-3xl font-bold">市场驾驶舱</h1>
        <p class="mt-2 text-sm text-blue-100">先判断能不能做，再判断该往哪条主线和哪种风格去做。</p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <a href="./index.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">返回总控台</a>
        <a href="./strategy-vs-market.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">去策略中心</a>
        <a href="./decision-candidates.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">去候选股中心</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div v-if="loading" class="card rounded-2xl shadow p-10 text-center text-gray-400">加载市场驾驶舱中...</div>
    <div v-else-if="error" class="card rounded-2xl shadow p-10 text-center text-red-600">{{ error }}</div>
    <template v-else>
      <section class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
        <div class="metric"><div class="text-xs text-gray-500">交易日</div><div class="text-xl font-bold mt-1">{{ market.latest_trade_date || '-' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">晨判状态</div><div class="text-xl font-bold mt-1">{{ morning.regime || '-' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">风险分数</div><div class="text-xl font-bold mt-1">{{ num(morning.risk_score) }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">行业覆盖</div><div class="text-xl font-bold mt-1">{{ market.market_summary?.sector_count || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">强势行业</div><div class="text-xl font-bold mt-1">{{ market.market_summary?.strong_signal_sector_count || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">午盘来源</div><div class="text-xl font-bold mt-1">{{ middaySourceLabel }}</div></div>
      </section>

      <section class="card rounded-2xl shadow p-5 mb-6">
        <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
          <div>
            <h2 class="text-lg font-bold">晨判层</h2>
            <p class="text-sm text-gray-500 mt-1">回答今天是偏防守、偏观察还是可继续跟踪主线。</p>
          </div>
          <div class="text-xs text-gray-500">{{ morning.data_time_label || ('晨判生成于 ' + (morning.generated_at || '-')) }}</div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
          <div class="metric"><div class="text-xs text-gray-500">隔夜风险等级</div><div class="text-xl font-bold mt-1">{{ morning.regime || '-' }}</div></div>
          <div class="metric"><div class="text-xs text-gray-500">风险分数</div><div class="text-xl font-bold mt-1">{{ num(morning.risk_score) }}</div></div>
          <div class="metric"><div class="text-xs text-gray-500">A50隔夜</div><div class="text-xl font-bold mt-1">{{ pct(morning.a50_change_pct) }}</div></div>
          <div class="metric"><div class="text-xs text-gray-500">金龙指数</div><div class="text-xl font-bold mt-1">{{ pct(morning.golden_dragon_change_pct) }}</div></div>
          <div class="metric"><div class="text-xs text-gray-500">离岸人民币</div><div class="text-xl font-bold mt-1">{{ pct(morning.cnh_change_pct) }}</div></div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mt-4">
          <div class="rounded-xl bg-purple-50 border border-purple-100 p-4">
            <div class="text-sm font-bold text-purple-700 mb-2">AI晨判总结</div>
            <div class="text-sm text-purple-800 leading-relaxed">{{ morning.ai_summary || '暂无' }}</div>
          </div>
          <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-4">
            <div class="text-sm font-bold text-emerald-700 mb-2">AI操作建议</div>
            <div class="text-sm text-emerald-800 leading-relaxed">{{ morning.ai_action_advice || '暂无' }}</div>
          </div>
        </div>
        <div v-if="(morning.opening_playbook || []).length" class="mt-4 rounded-xl bg-blue-50 border border-blue-100 p-4">
          <div class="text-sm font-bold text-blue-700 mb-2">开盘剧本</div>
          <ul class="text-sm text-blue-800 list-disc pl-5 space-y-1">
            <li v-for="item in (morning.opening_playbook || []).slice(0,5)" :key="item">{{ item }}</li>
          </ul>
        </div>
      </section>

      <section class="card rounded-2xl shadow p-5 mb-6">
        <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
          <div>
            <h2 class="text-lg font-bold">午盘层</h2>
            <p class="text-sm text-gray-500 mt-1">回答市场是否延续晨判、盘中是否出现明确主线、午后该怎么做。</p>
          </div>
          <div class="text-xs text-gray-500">{{ midday.as_of_time || '暂无午盘快照' }}</div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <div class="metric"><div class="text-xs text-gray-500">午盘状态</div><div class="text-xl font-bold mt-1">{{ midday.market_view_midday?.regime || '-' }}</div></div>
          <div class="metric"><div class="text-xs text-gray-500">午盘风险分</div><div class="text-xl font-bold mt-1">{{ num(midday.market_view_midday?.risk_score) }}</div></div>
          <div class="metric"><div class="text-xs text-gray-500">热点板块</div><div class="text-xl font-bold mt-1">{{ (midday.hot_sectors_topN || []).length }}</div></div>
          <div class="metric"><div class="text-xs text-gray-500">观察候选</div><div class="text-xl font-bold mt-1">{{ (midday.prebreakout_watchlist_topN || []).length }}</div></div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mt-4">
          <div class="rounded-xl bg-purple-50 border border-purple-100 p-4">
            <div class="text-sm font-bold text-purple-700 mb-2">午盘研判</div>
            <div class="text-sm text-purple-800 leading-relaxed">{{ midday.market_view_midday?.summary || '暂无午盘总结' }}</div>
          </div>
          <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-4">
            <div class="text-sm font-bold text-emerald-700 mb-2">午盘操作建议</div>
            <div class="text-sm text-emerald-800 leading-relaxed">{{ midday.midday_action_advice || '暂无午盘建议' }}</div>
          </div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 mt-4">
          <div class="industry-card">
            <div class="text-sm font-bold text-blue-700 mb-2">午盘热点板块</div>
            <div class="space-y-2 text-sm">
              <div v-for="row in (midday.hot_sectors_topN || []).slice(0,5)" :key="row.industry_name" class="flex items-center justify-between gap-3">
                <span>{{ row.industry_name }}</span>
                <span class="text-xs text-gray-500">{{ pct(row.avg_pct_chg) }}</span>
              </div>
            </div>
          </div>
          <div class="industry-card">
            <div class="text-sm font-bold text-gray-700 mb-2">午盘推荐股</div>
            <div class="space-y-2 text-sm">
              <div v-for="row in (midday.recommended_stocks_topN || []).slice(0,5)" :key="row.ts_code || row.stock_code" class="flex items-center justify-between gap-3">
                <span>{{ row.stock_name }}</span>
                <span class="text-xs text-gray-500">{{ row.ai_view || row.action || '观察' }}</span>
              </div>
            </div>
          </div>
          <div class="industry-card">
            <div class="text-sm font-bold text-amber-700 mb-2">启动前夕观察池</div>
            <div class="space-y-2 text-sm">
              <div v-for="row in (midday.prebreakout_watchlist_topN || []).slice(0,5)" :key="row.ts_code || row.stock_code" class="flex items-center justify-between gap-3">
                <span>{{ row.stock_name }}</span>
                <span class="text-xs text-gray-500">{{ row.ai_view || '待判定' }}</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-6">
        <section class="card rounded-2xl shadow p-5 xl:col-span-2">
          <h2 class="text-lg font-bold mb-3">市场状态总览</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="metric"><div class="text-xs text-gray-500">行业总数</div><div class="text-xl font-bold mt-1">{{ market.market_summary?.sector_count || 0 }}</div></div>
            <div class="metric"><div class="text-xs text-gray-500">上涨行业</div><div class="text-xl font-bold mt-1">{{ market.market_summary?.positive_sector_count || 0 }}</div></div>
            <div class="metric"><div class="text-xs text-gray-500">上涨行业占比</div><div class="text-xl font-bold mt-1">{{ pctRatio(market.market_summary?.positive_sector_ratio) }}</div></div>
            <div class="metric"><div class="text-xs text-gray-500">平均行业涨跌</div><div class="text-xl font-bold mt-1">{{ pct(market.market_summary?.average_sector_change_pct) }}</div></div>
          </div>
          <div class="mt-4 rounded-xl bg-gray-50 border border-gray-100 p-4">
            <div class="text-sm font-bold text-gray-700 mb-2">一句话口径</div>
            <div class="text-sm text-gray-700 leading-relaxed">{{ marketNarrative }}</div>
          </div>
        </section>

        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">重点观察行业</h2>
          <div class="space-y-3">
            <div v-for="row in (market.top_market_sectors || []).slice(0,6)" :key="row.industry" class="industry-card">
              <div class="flex items-center justify-between gap-3">
                <div class="font-semibold">{{ row.industry }}</div>
                <div class="text-xs text-gray-500">排名 {{ num(row.market_rank) }}</div>
              </div>
              <div class="text-xs text-gray-500 mt-1">{{ row.trend_signal || '-' }} ｜ 均涨 {{ pct(row.avg_pct_chg) }}</div>
            </div>
          </div>
        </section>
      </section>

      <section class="card rounded-2xl shadow p-5">
        <div class="flex items-center justify-between gap-3 mb-4">
          <div>
            <h2 class="text-lg font-bold">市场 × 策略 行业动作表</h2>
            <p class="text-sm text-gray-500 mt-1">这里决定“该补抓 / 继续观察 / 先回避”。</p>
          </div>
          <a href="./strategy-vs-market.html" class="text-sm px-3 py-2 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100">去策略中心细看</a>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
          <div v-for="row in (market.industry_actions || []).slice(0,9)" :key="row.industry" class="industry-card">
            <div class="flex items-center justify-between gap-3">
              <div class="font-semibold">{{ row.industry }}</div>
              <span class="pill" :class="row.action === '增配' ? 'ok' : row.action === '观察' ? 'warn' : 'bad'">{{ row.action }}</span>
            </div>
            <div class="text-xs text-gray-500 mt-1">市场 {{ num(row.market_rank) }} ｜ 策略 {{ num(row.strategy_rank) }}</div>
            <div class="text-sm text-gray-700 leading-relaxed mt-2">{{ row.action_summary || row.reason }}</div>
          </div>
        </div>
      </section>
    </template>
  </main>
</div>

<script>
Vue.createApp({
  data(){ return { loading:true, error:'', market:{} }; },
  computed:{
    morning(){ return this.market.morning || {}; },
    midday(){ return this.market.midday || {}; },
    middaySourceLabel(){
      const value = this.market.midday_source;
      return value === 'published' ? '公开页' : value === 'working_fallback' ? '工作区回退' : '缺失';
    },
    marketNarrative(){
      const summary = this.market.market_summary || {};
      const top = (this.market.top_market_sectors || []).slice(0,3).map(r => r.industry).filter(Boolean).join('、') || '暂无主线';
      return `当前市场共覆盖 ${summary.sector_count || 0} 个行业，上涨行业 ${summary.positive_sector_count || 0} 个，强信号行业 ${summary.strong_signal_sector_count || 0} 个。当前更值得优先盯住 ${top}。`;
    }
  },
  methods:{
    num(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':n.toFixed(0); },
    pct(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${n>=0?'+':''}${n.toFixed(2)}%`; },
    pctRatio(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${(n*100).toFixed(1)}%`; }
  },
  async mounted(){
    try{
      const resp = await fetch('data/latest/market_state.json?' + Date.now(), {cache:'no-store'});
      if(!resp.ok) throw new Error('data/latest/market_state.json not found');
      this.market = await resp.json();
    }catch(err){
      this.error = err?.message || String(err);
    }finally{
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
