<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>策略 vs 市场统一决策页</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <style>body{background:linear-gradient(180deg,#f4f7fb 0%,#edf2f7 100%)} .card{background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}</style>
</head>
<body class="text-gray-800">
<div id="app">
  <header class="text-white px-6 py-8" style="background: linear-gradient(135deg, #1f2937 0%, #334155 48%, #2563eb 100%);">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <div class="text-xs uppercase tracking-widest text-blue-100 mb-2">Unified Decision</div>
          <h1 class="text-3xl font-bold">策略 vs 市场统一决策页</h1>
          <p class="mt-2 text-sm text-blue-100">直接消费统一决策 JSON，把市场晨判、行业热力、策略热力与动作建议放到同一页里。</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <a href="./index.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">返回首页</a>
          <a href="./market-overview.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">市场驾驶舱</a>
          <a href="./industry-heatmap.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">策略行业热力</a>
          <a href="./market-industry-heatmap.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">全市场行业热力</a>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div v-if="loading" class="card rounded-2xl shadow p-10 text-center text-gray-400">加载统一决策数据中...</div>
    <div v-else-if="error" class="card rounded-2xl shadow p-10 text-center text-red-600">{{ error }}</div>
    <template v-else>
      <section class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
        <div class="card rounded-2xl shadow p-4"><div class="text-xs text-gray-500">晨判等级</div><div class="text-2xl font-bold mt-1">{{ payload.morning_brief.regime || '-' }}</div></div>
        <div class="card rounded-2xl shadow p-4"><div class="text-xs text-gray-500">风险分数</div><div class="text-2xl font-bold mt-1">{{ fmt(payload.morning_brief.risk_score) }}</div></div>
        <div class="card rounded-2xl shadow p-4"><div class="text-xs text-gray-500">A50隔夜</div><div class="text-2xl font-bold mt-1">{{ pct(payload.morning_brief.a50_change_pct) }}</div></div>
        <div class="card rounded-2xl shadow p-4"><div class="text-xs text-gray-500">金龙指数</div><div class="text-2xl font-bold mt-1">{{ pct(payload.morning_brief.golden_dragon_change_pct) }}</div></div>
        <div class="card rounded-2xl shadow p-4"><div class="text-xs text-gray-500">离岸人民币</div><div class="text-2xl font-bold mt-1">{{ pct(payload.morning_brief.cnh_change_pct) }}</div></div>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-6">
        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">增配行业</h2>
          <div class="space-y-3">
            <div v-for="row in addRows" :key="row.industry" class="border border-green-100 rounded-xl p-3 bg-green-50">
              <div class="flex items-center justify-between gap-2"><div class="font-semibold">{{ row.industry }}</div><div class="text-xs text-gray-500">市场{{ fmt(row.market_rank) }}</div></div>
              <div class="mt-1 text-xs text-gray-600">{{ row.reason }}</div>
              <div class="mt-2 text-xs text-gray-500">热门股：{{ hot(row.hot_stocks) }}</div>
            </div>
          </div>
        </section>
        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">观察行业</h2>
          <div class="space-y-3">
            <div v-for="row in watchRows" :key="row.industry" class="border border-yellow-100 rounded-xl p-3 bg-yellow-50">
              <div class="flex items-center justify-between gap-2"><div class="font-semibold">{{ row.industry }}</div><div class="text-xs text-gray-500">策{{ fmt(row.strategy_rank) }} / 市{{ fmt(row.market_rank) }}</div></div>
              <div class="mt-1 text-xs text-gray-600">{{ row.reason }}</div>
              <div class="mt-2 text-xs text-gray-500">热门股：{{ hot(row.hot_stocks) }}</div>
            </div>
          </div>
        </section>
        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">回避行业</h2>
          <div class="space-y-3">
            <div v-for="row in avoidRows" :key="row.industry" class="border border-red-100 rounded-xl p-3 bg-red-50">
              <div class="flex items-center justify-between gap-2"><div class="font-semibold">{{ row.industry }}</div><div class="text-xs text-gray-500">策{{ fmt(row.strategy_rank) }}</div></div>
              <div class="mt-1 text-xs text-gray-600">{{ row.reason }}</div>
            </div>
          </div>
        </section>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">晨判关键驱动</h2>
          <ul class="text-sm text-gray-600 space-y-2 list-disc pl-5">
            <li v-for="item in payload.morning_brief.key_drivers || []" :key="item">{{ item }}</li>
          </ul>
        </section>
        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">开盘应对建议</h2>
          <ul class="text-sm text-gray-600 space-y-2 list-disc pl-5">
            <li v-for="item in payload.morning_brief.opening_playbook || []" :key="item">{{ item }}</li>
          </ul>
        </section>
      </section>

      <section class="card rounded-2xl shadow p-5">
        <h2 class="text-lg font-bold mb-3">行业动作总表</h2>
        <div class="overflow-auto rounded-xl border border-gray-200 max-h-[620px]">
          <table class="min-w-full text-sm">
            <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide">
              <tr>
                <th class="px-3 py-3 text-left">行业</th>
                <th class="px-3 py-3 text-left">动作</th>
                <th class="px-3 py-3 text-right">市场热度</th>
                <th class="px-3 py-3 text-right">策略热度</th>
                <th class="px-3 py-3 text-right">市场排名</th>
                <th class="px-3 py-3 text-right">策略排名</th>
                <th class="px-3 py-3 text-left">热门股</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="row in payload.industry_actions || []" :key="row.industry" class="border-t border-gray-100">
                <td class="px-3 py-2 font-semibold">{{ row.industry }}</td>
                <td class="px-3 py-2">{{ row.action }}</td>
                <td class="px-3 py-2 text-right">{{ fmt(row.market_heat) }}</td>
                <td class="px-3 py-2 text-right">{{ fmt(row.strategy_heat) }}</td>
                <td class="px-3 py-2 text-right">{{ fmt(row.market_rank) }}</td>
                <td class="px-3 py-2 text-right">{{ fmt(row.strategy_rank) }}</td>
                <td class="px-3 py-2 text-xs text-gray-600">{{ hot(row.hot_stocks) }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </template>
  </main>
</div>
<script>
Vue.createApp({
  data(){return{loading:true,error:'',payload:{morning_brief:{},industry_actions:[]}}},
  computed:{
    addRows(){return (this.payload.industry_actions||[]).filter(x=>x.action==='增配')},
    watchRows(){return (this.payload.industry_actions||[]).filter(x=>x.action==='观察')},
    avoidRows(){return (this.payload.industry_actions||[]).filter(x=>x.action==='回避')},
  },
  methods:{
    fmt(v){if(v===null||v===undefined||v==='')return '-';const n=Number(v);return Number.isNaN(n)?'-':n.toFixed(2)},
    pct(v){if(v===null||v===undefined||v==='')return '-';const n=Number(v);return Number.isNaN(n)?'-':`${n>=0?'+':''}${n.toFixed(2)}%`},
    hot(items){return (items||[]).map(x=>x.ts_code).join('、') || '待补'}
  },
  async mounted(){
    try{
      const resp=await fetch('data/recommendation_analytics/unified_decision_payload.json?'+Date.now())
      if(!resp.ok) throw new Error('unified_decision_payload.json not found')
      this.payload=await resp.json()
    }catch(err){this.error=err?.message||'unknown error';console.error(err)}
    finally{this.loading=false}
  }
}).mount('#app')
</script>
</body>
</html>
