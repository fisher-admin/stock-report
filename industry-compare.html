<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>策略 vs 市场统一决策页</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <link href="./assets/styles/observatory-governance.css" rel="stylesheet">
  <style>
    :root {
      --ic-font-stack: var(--oc-font-stack);
    }
    body {
      margin: 0;
      font-family: var(--ic-font-stack);
      background: linear-gradient(180deg, #060d1a 0%, #0b1326 22%, #0f172a 100%);
      color: #dbe5f4;
      padding-top: 82px;
    }
    .shell-wrap { max-width: 1480px; margin: 0 auto; padding: 18px 18px 32px; }
    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, rgba(15,23,42,.96) 0%, rgba(17,36,64,.94) 45%, rgba(20,55,105,.9) 100%);
      border: 1px solid rgba(148,163,184,.14);
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(2,6,23,.28);
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: .14;
      pointer-events: none;
    }
    .hero-inner { padding: 24px 24px 26px; position: relative; z-index: 1; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    .hero-main, .hero-side, .section-card, .mini-card, .summary-card, .action-card, .metric-card, .table-shell {
      background: linear-gradient(180deg, rgba(15,23,42,.88), rgba(15,23,42,.72));
      border: 1px solid rgba(148,163,184,.14);
      border-radius: 22px;
      box-shadow: 0 16px 34px rgba(2,6,23,.18);
    }
    .hero-main, .hero-side { padding: 22px; }
    .brand-kicker, .status-chip, .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .brand-kicker {
      padding: 6px 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #dbeafe;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
    }
    .status-inline { display: flex; flex-wrap: wrap; gap: 8px; }
    .status-chip {
      padding: 6px 12px;
      color: #eff6ff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
    }
    .hero-title { margin: 0; font-size: 36px; line-height: 1.12; font-weight: 900; color: #f8fbff; }
    .hero-sub { margin: 10px 0 0; color: #dbeafe; font-size: 15px; line-height: 1.75; max-width: 760px; }
    .hero-answer { margin-top: 16px; padding: 14px 16px; border-radius: 18px; background: rgba(15,23,42,.22); border: 1px solid rgba(255,255,255,.1); }
    .hero-answer-label { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #bfdbfe; text-transform: uppercase; }
    .hero-answer-text { margin-top: 8px; font-size: 15px; line-height: 1.8; color: #f8fafc; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .theme-note { padding: 12px 14px; border-radius: 16px; background: rgba(15,23,42,.72); border: 1px solid rgba(148,163,184,.14); }
    .theme-note-label { color: #8ea3bf; font-size: 12px; }
    .theme-note-value { margin-top: 6px; color: #f8fbff; font-size: 15px; font-weight: 800; line-height: 1.5; }
    .sticky-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      background: rgba(2,6,23,.92);
      border-bottom: 1px solid rgba(148,163,184,.14);
      box-shadow: 0 14px 36px rgba(2,6,23,.28);
    }
    .sticky-nav-inner { max-width: 1480px; margin: 0 auto; padding: 14px 18px; min-height: 82px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 10px; }
    .nav-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 14px; text-decoration: none;
      color: #94a3b8; font-size: 13px; font-weight: 700;
      border: 1px solid transparent; transition: all .18s ease;
    }
    .nav-link:hover { color: #e5efff; background: rgba(37,99,235,.12); border-color: rgba(96,165,250,.18); }
    .nav-link.active { color: #fff; background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); border-color: rgba(96,165,250,.28); box-shadow: 0 12px 28px rgba(37,99,235,.28); }
    .nav-caption { font-size: 12px; font-weight: 800; color: #8ea3bf; }
    .stitch-top-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .stitch-search { position: relative; display: none; }
    .stitch-search input {
      width: 270px; padding: 10px 14px; border-radius: 14px;
      border: 1px solid rgba(148,163,184,.14); background: rgba(15,23,42,.78); color: #dbe5f4;
      font-size: 12px; outline: none;
    }
    .stitch-icon-btn {
      width: auto; min-width: 0; height: 36px; padding: 0 14px; border-radius: 12px;
      border: 1px solid rgba(148,163,184,.12); background: rgba(15,23,42,.72); color: #a9bdd6;
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; white-space: nowrap;
    }
    .stitch-avatar {
      width: 36px; height: 36px; border-radius: 999px; overflow: hidden;
      border: 1px solid rgba(148,163,184,.16); box-shadow: 0 8px 20px rgba(2,6,23,.22);
      display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#2563eb,#38bdf8); color: #fff; font-size: 12px; font-weight: 900;
    }
    .stitch-side-rail {
      position: fixed; left: 0; top: 0; bottom: 0; width: 258px; z-index: 32;
      padding: 92px 18px 22px; background: rgba(2,6,23,.96); border-right: 1px solid rgba(148,163,184,.12);
      box-shadow: 0 20px 60px rgba(2,6,23,.35); display: none;
    }
    .stitch-side-brand { display:flex; align-items:center; gap:12px; margin-bottom:22px; padding:0 10px 14px; border-bottom:1px solid rgba(148,163,184,.1); }
    .stitch-side-dot { width:10px; height:10px; border-radius:999px; background:#38bdf8; box-shadow:0 0 12px rgba(56,189,248,.55); }
    .stitch-side-title { font-size:15px; font-weight:900; color:#f8fbff; }
    .stitch-side-sub { font-size:11px; color:#7f93af; text-transform:uppercase; letter-spacing:.12em; margin-top:2px; }
    .stitch-side-nav { display:grid; gap:8px; }
    .stitch-side-link {
      display:flex; align-items:center; gap:0; padding:12px 14px; border-radius:16px; color:#90a4c2; text-decoration:none;
      font-size:13px; font-weight:800; border:1px solid transparent; transition: all .18s ease;
    }
    .stitch-side-link:hover { color:#fff; background:rgba(37,99,235,.12); border-color:rgba(96,165,250,.16); transform:translateX(2px); }
    .stitch-side-link.active { color:#fff; background:linear-gradient(135deg, rgba(37,99,235,.22), rgba(14,165,233,.1)); border-color:rgba(96,165,250,.24); }
    .stitch-side-foot { position:absolute; left:18px; right:18px; bottom:22px; }
    .stitch-side-status { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background:rgba(16,185,129,.1); color:#86efac; font-size:11px; font-weight:800; }
    .section-card { padding-bottom: 22px; }
    .section-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 22px 0; }
    .section-kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: #8ea3bf; }
    .section-title { margin: 6px 0 0; font-size: 24px; font-weight: 900; color: #f8fbff; }
    .section-sub { margin: 8px 0 0; color: #8ea3bf; font-size: 13px; line-height: 1.7; }
    .metrics-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 14px; padding: 18px 22px 0; }
    .metric-card { padding: 16px; }
    .metric-label { color: #8ea3bf; font-size: 12px; }
    .metric-value { margin-top: 8px; font-size: 28px; font-weight: 900; color: #f8fbff; line-height: 1; }
    .metric-note { margin-top: 8px; font-size: 12px; color: #8ea3bf; }
    .summary-grid { display: grid; gap: 14px; padding: 18px 22px 0; }
    .summary-grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .summary-grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .summary-card { padding: 16px; }
    .summary-card.blue { background: linear-gradient(180deg, rgba(30,58,138,.34), rgba(15,23,42,.82)); border-color: rgba(96,165,250,.28); }
    .summary-card.green { background: linear-gradient(180deg, rgba(6,95,70,.28), rgba(15,23,42,.82)); border-color: rgba(52,211,153,.20); }
    .summary-card.purple { background: linear-gradient(180deg, rgba(91,33,182,.26), rgba(15,23,42,.82)); border-color: rgba(167,139,250,.24); }
    .summary-card.amber { background: linear-gradient(180deg, rgba(146,64,14,.24), rgba(15,23,42,.82)); border-color: rgba(251,191,36,.22); }
    .summary-title { font-size: 13px; font-weight: 800; color: #8ea3bf; }
    .summary-text { margin-top: 10px; font-size: 15px; line-height: 1.8; color: #dbe5f4; }
    .action-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; padding: 18px 22px 0; }
    .action-card { padding: 16px; }
    .action-card.add { border-color: rgba(52,211,153,.22); }
    .action-card.watch { border-color: rgba(251,191,36,.22); }
    .action-card.avoid { border-color: rgba(248,113,113,.22); }
    .action-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .action-title { font-size: 18px; font-weight: 900; color: #f8fbff; }
    .list-stack { display: grid; gap: 12px; margin-top: 14px; }
    .mini-card { padding: 12px 14px; }
    .mini-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .mini-title { font-size: 14px; font-weight: 800; color: #f8fbff; }
    .mini-sub { margin-top: 6px; font-size: 12px; line-height: 1.65; color: #8ea3bf; }
    .pill { padding: 5px 10px; }
    .pill.green { background: rgba(16,185,129,.18); color: #86efac; }
    .pill.amber { background: rgba(251,191,36,.18); color: #fde68a; }
    .pill.red { background: rgba(248,113,113,.18); color: #fecaca; }
    .pill.blue { background: rgba(56,189,248,.18); color: #bae6fd; }
    .table-shell { margin: 18px 22px 0; overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; border-bottom: 1px solid rgba(148,163,184,.12); text-align: left; vertical-align: top; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8ea3bf; }
    td { font-size: 13px; color: #dbe5f4; }
    .obs-footer { margin-top: 72px; border-top: 1px solid rgba(148,163,184,.12); background: rgba(2,6,23,.74); }
    .obs-footer-inner { max-width: 1480px; margin: 0 auto; padding: 28px 18px 38px; display:grid; grid-template-columns: 1.2fr .8fr; gap: 20px; align-items:start; }
    .obs-footer-brand { font-size: 18px; font-weight: 900; color: #f8fbff; }
    .obs-footer-copy, .obs-footer-note { color: #8ea3bf; font-size: 12px; line-height: 1.8; }
    .obs-footer-status { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background: rgba(16,185,129,.12); color:#86efac; font-size:11px; font-weight:800; }
    @media (min-width: 1280px) {
      .stitch-side-rail { display: block; }
      .sticky-nav { left: 258px; }
      .sticky-nav-inner, .shell-wrap, .obs-footer-inner { max-width: none; padding-left: 288px; padding-right: 28px; }
      .stitch-search { display: block; }
    }
    @media (max-width: 1200px) {
      .hero-grid, .summary-grid.cols-3, .action-grid { grid-template-columns: 1fr 1fr; }
      .metrics-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    @media (max-width: 860px) {
      .hero-grid, .summary-grid.cols-3, .summary-grid.cols-2, .action-grid { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .stitch-top-actions { width: 100%; justify-content: space-between; }
      .stitch-search { display: block; flex: 1; }
      .stitch-search input { width: 100%; }
      .obs-footer-inner { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      body { padding-top: 76px; }
      .hero-title { font-size: 28px; }
      .metrics-grid { grid-template-columns: 1fr 1fr; }
      .shell-wrap, .sticky-nav-inner, .obs-footer-inner { padding-left: 14px; padding-right: 14px; }
      .section-head, .metrics-grid, .summary-grid, .action-grid { padding-left: 16px; padding-right: 16px; }
      .table-shell { margin-left: 16px; margin-right: 16px; }
    }
  </style>
</head>
<body>
<div id="app">
  <aside class="stitch-side-rail">
    <div class="stitch-side-brand">
      <div class="stitch-side-dot"></div>
      <div>
        <div class="stitch-side-title">A股观测台</div>
        <div class="stitch-side-sub">量化决策工作台</div>
      </div>
    </div>
    <nav class="stitch-side-nav">
      <a class="stitch-side-link" href="./index.html"><span>总控台</span></a>
      <a class="stitch-side-link" href="./market-overview.html"><span>市场驾驶舱</span></a>
      <a class="stitch-side-link" href="./strategy-vs-market.html"><span>策略中心</span></a>
      <a class="stitch-side-link" href="./decision-candidates.html"><span>候选执行</span></a>
      <a class="stitch-side-link" href="./research-lab.html"><span>复盘研究</span></a>
      <a class="stitch-side-link" href="./recommendation-review.html"><span>复盘明细</span></a>
      <a class="stitch-side-link active" href="./industry-compare.html"><span>统一决策</span></a>
      <a class="stitch-side-link" href="./industry-heatmap.html"><span>策略热力</span></a>
      <a class="stitch-side-link" href="./market-industry-heatmap.html"><span>市场热力</span></a>
    </nav>
    <div class="stitch-side-foot"><div class="stitch-side-status"><span>系统在线</span></div></div>
  </aside>

  <div class="sticky-nav">
    <div class="sticky-nav-inner">
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div class="nav-caption">路径：总控台 → 市场层 → 策略层 → 个股层 → 复盘研究层 → 专题页</div>
        <div class="nav-links">
          <a href="./index.html" class="nav-link">总控台</a>
          <a href="./market-overview.html" class="nav-link">市场层</a>
          <a href="./strategy-vs-market.html" class="nav-link">策略层</a>
          <a href="./decision-candidates.html" class="nav-link">个股层</a>
          <a href="./research-lab.html" class="nav-link">复盘研究层</a>
          <a href="./industry-compare.html" class="nav-link active">统一决策页</a>
        </div>
      </div>
      <div class="stitch-top-actions">
        <div class="stitch-search"><input placeholder="搜索行业、动作或股票" /></div>
        <button class="stitch-icon-btn">刷新数据</button>
        <button class="stitch-icon-btn">专题筛选</button>
        <div class="stitch-avatar">鱼</div>
      </div>
    </div>
  </div>

  <main class="shell-wrap">
    <div v-if="loading" class="section-card" style="padding:36px;text-align:center;color:#8ea3bf;">加载统一决策数据中...</div>
    <div v-else-if="error" class="section-card" style="padding:36px;text-align:center;color:#fecaca;">{{ error }}</div>
    <template v-else>
      <section class="hero">
        <div class="hero-inner">
          <div class="brand-kicker">统一行业对照</div>
          <div class="status-inline" style="margin-top:14px;">
            <span class="status-chip">交易日 {{ brief.trade_date || '-' }}</span>
            <span class="status-chip">晨判 {{ brief.regime || '-' }}</span>
            <span class="status-chip">行业动作 {{ actions.length }}</span>
          </div>
          <div class="hero-grid" style="margin-top:16px;">
            <div class="hero-main">
              <h1 class="hero-title">策略 vs 市场统一决策</h1>
              <p class="hero-sub">把晨判、行业动作、市场主线和策略候选放在一张页面里，看哪里一致，哪里错位。</p>
              <div class="hero-answer">
                <div class="hero-answer-label">专题结论</div>
                <div class="hero-answer-text">{{ compareConclusion }}</div>
              </div>
            </div>
            <div class="hero-side">
              <div class="theme-grid">
                <div class="theme-note"><div class="theme-note-label">增配</div><div class="theme-note-value">{{ addRows.length }}</div></div>
                <div class="theme-note"><div class="theme-note-label">观察</div><div class="theme-note-value">{{ watchRows.length }}</div></div>
                <div class="theme-note"><div class="theme-note-label">回避</div><div class="theme-note-value">{{ avoidRows.length }}</div></div>
                <div class="theme-note"><div class="theme-note-label">主线焦点</div><div class="theme-note-value">{{ topIndustry }}</div></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">决策指标</div>
            <h2 class="section-title">晨判与行业动作快照</h2>
          </div>
        </div>
        <div class="metrics-grid">
          <div class="metric-card"><div class="metric-label">晨判等级</div><div class="metric-value">{{ brief.regime || '-' }}</div><div class="metric-note">风险口径</div></div>
          <div class="metric-card"><div class="metric-label">风险分数</div><div class="metric-value">{{ fmt(brief.risk_score) }}</div><div class="metric-note">0-100</div></div>
          <div class="metric-card"><div class="metric-label">A50隔夜</div><div class="metric-value">{{ pct(brief.a50_change_pct) }}</div><div class="metric-note">代理</div></div>
          <div class="metric-card"><div class="metric-label">金龙指数</div><div class="metric-value">{{ pct(brief.golden_dragon_change_pct) }}</div><div class="metric-note">代理</div></div>
          <div class="metric-card"><div class="metric-label">离岸人民币</div><div class="metric-value">{{ pct(brief.cnh_change_pct) }}</div><div class="metric-note">外汇</div></div>
          <div class="metric-card"><div class="metric-label">主线行业</div><div class="metric-value">{{ topIndustry }}</div><div class="metric-note">市场热度第一</div></div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">错位与一致</div>
            <h2 class="section-title">市场 / 策略 / 个股关系</h2>
          </div>
        </div>
        <div class="summary-grid cols-3">
          <div class="summary-card blue"><div class="summary-title">市场优先抓什么</div><div class="summary-text">{{ topIndustry }}。若市场排名高但策略候选空，说明需要补抓代表股。</div></div>
          <div class="summary-card green"><div class="summary-title">策略覆盖到哪</div><div class="summary-text">{{ strategyCoverageSummary }}</div></div>
          <div class="summary-card purple"><div class="summary-title">执行层怎么看</div><div class="summary-text">先看增配行业，再下钻到候选执行页核对个股计划。</div></div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">动作编组</div>
            <h2 class="section-title">增配 / 观察 / 回避</h2>
          </div>
        </div>
        <div class="action-grid">
          <div class="action-card add">
            <div class="action-top"><div class="action-title">增配</div><span class="pill green">{{ addRows.length }} 个</span></div>
            <div class="list-stack">
              <div v-for="row in addRows.slice(0,5)" :key="row.industry" class="mini-card">
                <div class="mini-top"><div class="mini-title">{{ row.industry }}</div><span class="pill blue">市场 {{ fmt(row.market_rank) }}</span></div>
                <div class="mini-sub">{{ row.action_summary || row.reason }}</div>
                <div class="mini-sub">热门股：{{ hot(row.market_hot_stocks) }}</div>
                <div class="mini-sub">策略候选：{{ candidates(row.strategy_candidates) }}</div>
              </div>
            </div>
          </div>
          <div class="action-card watch">
            <div class="action-top"><div class="action-title">观察</div><span class="pill amber">{{ watchRows.length }} 个</span></div>
            <div class="list-stack">
              <div v-for="row in watchRows.slice(0,5)" :key="row.industry" class="mini-card">
                <div class="mini-top"><div class="mini-title">{{ row.industry }}</div><span class="pill blue">策 {{ fmt(row.strategy_rank) }}</span></div>
                <div class="mini-sub">{{ row.action_summary || row.reason }}</div>
                <div class="mini-sub">热门股：{{ hot(row.market_hot_stocks) }}</div>
                <div class="mini-sub">策略候选：{{ candidates(row.strategy_candidates) }}</div>
              </div>
            </div>
          </div>
          <div class="action-card avoid">
            <div class="action-top"><div class="action-title">回避</div><span class="pill red">{{ avoidRows.length }} 个</span></div>
            <div class="list-stack">
              <div v-for="row in avoidRows.slice(0,5)" :key="row.industry" class="mini-card">
                <div class="mini-top"><div class="mini-title">{{ row.industry }}</div><span class="pill blue">策 {{ fmt(row.strategy_rank) }}</span></div>
                <div class="mini-sub">{{ row.action_summary || row.reason }}</div>
                <div class="mini-sub">策略候选：{{ candidates(row.strategy_candidates) }}</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">晨判补充</div>
            <h2 class="section-title">关键驱动与开盘动作</h2>
          </div>
        </div>
        <div class="summary-grid cols-2">
          <div class="summary-card amber">
            <div class="summary-title">晨判关键驱动</div>
            <div class="summary-text">{{ (brief.key_drivers || []).length ? brief.key_drivers.join('；') : '暂无明确关键驱动。' }}</div>
          </div>
          <div class="summary-card green">
            <div class="summary-title">开盘应对建议</div>
            <div class="summary-text">{{ (brief.opening_playbook || []).length ? brief.opening_playbook.join('；') : '暂无明确开盘建议。' }}</div>
          </div>
        </div>
      </section>

      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">总表</div>
            <h2 class="section-title">行业动作总表</h2>
          </div>
        </div>
        <div class="table-shell">
          <table>
            <thead>
              <tr>
                <th>行业</th>
                <th>动作</th>
                <th>市场热度</th>
                <th>策略热度</th>
                <th>市场排名</th>
                <th>策略排名</th>
                <th>热门股</th>
                <th>策略候选</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="row in actions" :key="row.industry">
                <td style="font-weight:800;">{{ row.industry }}</td>
                <td><span class="pill" :class="row.action === '增配' ? 'green' : row.action === '观察' ? 'amber' : 'red'">{{ row.action }}</span></td>
                <td>{{ fmt(row.market_heat) }}</td>
                <td>{{ fmt(row.strategy_heat) }}</td>
                <td>{{ fmt(row.market_rank) }}</td>
                <td>{{ fmt(row.strategy_rank) }}</td>
                <td>{{ hot(row.market_hot_stocks) }}</td>
                <td>{{ candidates(row.strategy_candidates) }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </template>
  </main>

  <footer class="obs-footer">
    <div class="obs-footer-inner">
      <div>
        <div class="obs-footer-brand">A股观测台</div>
        <div class="obs-footer-copy">量化判断界面，不构成投资建议。</div>
      </div>
      <div>
        <div class="obs-footer-status">系统在线</div>
        <div class="obs-footer-note" style="margin-top:10px;">统一决策页：看市场与策略的错位和一致。</div>
      </div>
    </div>
  </footer>
</div>
<script>
Vue.createApp({
  data(){
    return { loading:true, error:'', payload:{ morning_brief:{}, industry_actions:[] } };
  },
  computed:{
    brief(){ return this.payload.morning_brief || {}; },
    actions(){ return this.payload.industry_actions || []; },
    addRows(){ return this.actions.filter(x => x.action === '增配'); },
    watchRows(){ return this.actions.filter(x => x.action === '观察'); },
    avoidRows(){ return this.actions.filter(x => x.action === '回避'); },
    topIndustry(){ return this.actions[0]?.industry || '暂无'; },
    strategyCoverageSummary(){
      const covered = this.actions.filter(x => (x.strategy_candidates || []).length > 0).length;
      return `${covered}/${this.actions.length} 个行业存在策略候选，说明剩余行业更多依赖市场主线而非策略覆盖。`;
    },
    compareConclusion(){
      if (!this.actions.length) return '暂无行业动作数据。';
      if (this.addRows.length && this.addRows.some(x => !(x.strategy_candidates || []).length)) return `当前市场主线在 ${this.topIndustry} 等行业更强，但策略侧仍有空白，需要优先补抓代表股。`;
      if (this.watchRows.length > this.addRows.length) return '当前更多行业处于观察态，说明市场和策略尚未形成强共振，执行层应偏谨慎。';
      return '市场主线与策略候选已有一定重叠，可优先跟踪增配行业并继续核对个股执行条件。';
    }
  },
  methods:{
    fmt(v){ if(v === null || v === undefined || v === '') return '-'; const n = Number(v); return Number.isNaN(n) ? '-' : n.toFixed(2); },
    pct(v){ if(v === null || v === undefined || v === '') return '-'; const n = Number(v); return Number.isNaN(n) ? '-' : `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`; },
    hot(items){ return (items || []).map(x => x.ts_code || x.stock_code).join('、') || '待补'; },
    candidates(items){ return (items || []).map(x => x.stock_name || x.stock_code || x.ts_code).join('、') || '待补'; }
  },
  async mounted(){
    try {
      const resp = await fetch('data/recommendation_analytics/unified_decision_payload.json?' + Date.now(), { cache:'no-store' });
      if(!resp.ok) throw new Error('unified_decision_payload.json not found');
      this.payload = await resp.json();
    } catch (err) {
      this.error = err?.message || 'unknown error';
      console.error(err);
    } finally {
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
