<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>启动前夕推荐复盘</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <link href="./assets/styles/observatory-governance.css" rel="stylesheet">
  <style>
    :root {
      --bg-1: #081425;
      --bg-2: #0f2742;
      --bg-3: #173c67;
      --card: rgba(255,255,255,0.92);
      --line: rgba(148,163,184,.22);
      --text-1: #0f172a;
      --text-2: #475569;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warn: #ca8a04;
      --warn-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --ai: #7c3aed;
      --ai-soft: #ede9fe;
      --shadow: 0 18px 48px rgba(15, 23, 42, .14);
      --shadow-soft: 0 10px 28px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text-1);
      background:
        radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(124,58,237,.14), transparent 24%),
        linear-gradient(180deg, #eff5fc 0%, #e9eef6 46%, #e5ebf4 100%);
      min-height: 100vh;
    }
    .shell-wrap { max-width: 1380px; margin: 0 auto; padding: 0 18px 32px; }
    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
      border-bottom: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,.05);
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: auto -80px -120px auto;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96,165,250,.22) 0%, transparent 72%);
      pointer-events: none;
    }
    .hero-inner { max-width: 1380px; margin: 0 auto; padding: 24px 18px 26px; }
    .brand-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: #dbeafe;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    }
    .status-inline { display: flex; flex-wrap: wrap; gap: 8px; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,.08); color: #eff6ff; border: 1px solid rgba(255,255,255,.14);
    }
    .hero-grid { display: grid; grid-template-columns: 1.35fr .85fr; gap: 16px; }
    .hero-main, .hero-side {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .hero-main { padding: 24px; }
    .hero-side { padding: 18px; }
    .hero-title { font-size: 34px; line-height: 1.15; font-weight: 900; margin: 0; }
    .hero-sub { margin: 10px 0 0; color: #dbeafe; font-size: 15px; line-height: 1.75; max-width: 760px; }
    .hero-answer {
      margin-top: 16px; padding: 14px 16px; border-radius: 18px;
      background: rgba(15,23,42,.22); border: 1px solid rgba(255,255,255,.10);
    }
    .hero-answer-label { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #bfdbfe; text-transform: uppercase; }
    .hero-answer-text { margin-top: 8px; font-size: 15px; line-height: 1.8; color: #f8fafc; }
    .flow-rail { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .flow-step {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 14px; border-radius: 14px; font-size: 13px; font-weight: 700;
      color: #dbeafe; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    }
    .flow-step.active { color:#fff; background: rgba(59,130,246,.24); border-color: rgba(147,197,253,.38); }
    .hero-side-title { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #bfdbfe; text-transform: uppercase; }
    .hero-side-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 12px; }
    .side-metric { padding: 12px; border-radius: 16px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
    .side-metric-label { color: #cbd5e1; font-size: 12px; }
    .side-metric-value { margin-top: 5px; font-size: 24px; font-weight: 900; color: #fff; }
    .sticky-nav {
      position: sticky; top: 0; z-index: 30; margin-top: -1px;
      backdrop-filter: blur(14px);
      background: rgba(248,250,252,.78);
      border-bottom: 1px solid rgba(148,163,184,.16);
    }
    .sticky-nav-inner { max-width: 1380px; margin: 0 auto; padding: 10px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 10px; }
    .nav-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 14px; text-decoration: none;
      color: #1e293b; font-size: 13px; font-weight: 700;
      border: 1px solid transparent; transition: all .18s ease;
    }
    .nav-link:hover { background: rgba(37,99,235,.08); color: var(--primary); border-color: rgba(37,99,235,.12); }
    .nav-link.active { background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%); color: #fff; box-shadow: 0 8px 20px rgba(37,99,235,.24); }
    .section-jump {
      display:flex; flex-wrap:wrap; gap:10px; align-items:center;
      max-width:1380px; margin:0 auto; padding:12px 18px 0;
    }
    .jump-link {
      display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px;
      background:rgba(255,255,255,.82); border:1px solid rgba(148,163,184,.16);
      color:#334155; text-decoration:none; font-size:12px; font-weight:800;
      box-shadow:0 6px 18px rgba(15,23,42,.05);
    }
    .jump-link:hover { color:var(--primary); border-color:rgba(37,99,235,.2); }
    .mobile-bottom-nav {
      display:none; position:fixed; left:12px; right:12px; bottom:12px; z-index:40;
      padding:8px; border-radius:20px; background:rgba(15,23,42,.88); backdrop-filter:blur(14px);
      box-shadow:0 18px 42px rgba(15,23,42,.26); border:1px solid rgba(255,255,255,.08);
    }
    .mobile-bottom-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .mobile-bottom-link {
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      min-height:54px; border-radius:14px; text-decoration:none; color:#cbd5e1; font-size:11px; font-weight:800;
    }
    .mobile-bottom-link.active { background:rgba(37,99,235,.24); color:#fff; }
    .mobile-bottom-icon { font-size:14px; line-height:1; }
    .section-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.56);
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .section-head {
      display: flex; flex-wrap: wrap; align-items: start; justify-content: space-between; gap: 12px;
      padding: 22px 22px 0;
    }
    .section-kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: #64748b; }
    .section-title { margin: 6px 0 0; font-size: 24px; font-weight: 900; }
    .section-sub { margin: 8px 0 0; color: var(--text-2); font-size: 14px; line-height: 1.75; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; padding: 18px 22px 22px; }
    .metric-card {
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.94));
      border: 1px solid var(--line);
      border-radius: 18px; padding: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.74);
    }
    .metric-label { color: var(--text-2); font-size: 12px; }
    .metric-value { margin-top: 8px; font-size: 28px; font-weight: 900; line-height: 1; }
    .metric-note { margin-top: 8px; font-size: 12px; color: #64748b; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; padding: 0 22px 22px; }
    .summary-card { border-radius: 20px; padding: 16px; border: 1px solid transparent; }
    .summary-card.blue { background: linear-gradient(180deg, #eef4ff, #f8fbff); border-color: #bfdbfe; }
    .summary-card.green { background: linear-gradient(180deg, #edfff3, #f7fffa); border-color: #bbf7d0; }
    .summary-card.purple { background: linear-gradient(180deg, #f5f1ff, #fbf9ff); border-color: #ddd6fe; }
    .summary-card.amber { background: linear-gradient(180deg, #fff8e9, #fffdf4); border-color: #fde68a; }
    .table-wrap { overflow: auto; max-height: 70vh; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; font-weight: 800; padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(148,163,184,.16); white-space: nowrap; background: #f8fafc; }
    td { padding: 12px 16px; border-bottom: 1px solid rgba(148,163,184,.10); font-size: 13px; color: #334155; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(37,99,235,.03); }
    .progress-stack { display:grid; gap:12px; margin-top:14px; }
    .progress-row { padding:12px 14px; border-radius:16px; background:#fff; border:1px solid rgba(148,163,184,.14); }
    .progress-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .progress-label { font-size:13px; font-weight:800; color:#0f172a; }
    .progress-value { font-size:12px; color:#475569; }
    .progress-bar { margin-top:10px; height:10px; border-radius:999px; background:#e2e8f0; overflow:hidden; }
    .progress-fill { height:100%; border-radius:999px; background: linear-gradient(90deg, #2563eb, #0ea5e9); }
    .route-list { display:grid; gap:10px; margin-top:14px; }
    .route-step { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:14px; background:#fff; border:1px solid rgba(148,163,184,.14); }
    .route-index { width: 26px; height:26px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; background:#dbeafe; color:#1d4ed8; flex: 0 0 auto; }
    .route-main { font-size:13px; font-weight:800; color:#0f172a; }
    .route-sub { margin-top:3px; font-size:12px; color:#64748b; line-height:1.6; }
    .kpi-badge { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; }
    .kpi-badge.green { background:#dcfce7; color:#16a34a; }
    .kpi-badge.blue { background:#dbeafe; color:#1d4ed8; }
    .kpi-badge.amber { background:#fef3c7; color:#ca8a04; }
    .kpi-badge.red { background:#fee2e2; color:#dc2626; }
    .pill { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; }
    .pill.green { background:#dcfce7; color:#16a34a; }
    .pill.blue { background:#dbeafe; color:#1d4ed8; }
    .pill.amber { background:#fef3c7; color:#ca8a04; }
    .pill.red { background:#fee2e2; color:#dc2626; }
    .pill.gray { background:#f1f5f9; color:#64748b; }
    .filter-row { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; padding: 18px 22px; }
    .filter-input { background: #fff; color: #0f172a; border: 1px solid rgba(148,163,184,.22); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; }
    .filter-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.10); }
    .filter-select { background: #fff; color: #0f172a; border: 1px solid rgba(148,163,184,.22); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; }
    .filter-select:focus { border-color: #2563eb; }
    .cta-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding: 0 22px 22px; }
    .primary-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:14px; background: linear-gradient(135deg, #1d4ed8, #2563eb); color:#fff; font-size:13px; font-weight:800; border:none; cursor:pointer; box-shadow: 0 8px 20px rgba(37,99,235,.24); text-decoration:none; }
    .ghost-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:14px; background:#fff; color:#334155; font-size:13px; font-weight:800; border:1px solid rgba(148,163,184,.22); cursor:pointer; text-decoration:none; }
    .loading-state { background:#fff; border:1px solid rgba(148,163,184,.16); border-radius:24px; padding:48px 32px; text-align:center; box-shadow:var(--shadow-soft); }
    .loading-icon { font-size:48px; line-height:1; }
    .loading-title { margin-top:16px; font-size:20px; font-weight:900; color:#0f172a; }
    .loading-sub { margin-top:8px; font-size:14px; color:#64748b; }
    .error-state { background:#fff; border:1px solid #fecaca; border-radius:24px; padding:48px 32px; text-align:center; box-shadow:var(--shadow-soft); }
    .error-icon { font-size:48px; line-height:1; }
    .error-title { margin-top:16px; font-size:20px; font-weight:900; color:#dc2626; }
    .error-sub { margin-top:8px; font-size:14px; color:#64748b; max-width:480px; margin-left:auto; margin-right:auto; word-break:break-all; }

    @media (max-width: 1200px) {
      .hero-grid, .summary-grid, .aside-grid, .cta-row { grid-template-columns: 1fr 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 860px) {
      .hero-grid, .summary-grid, .aside-grid, .cta-row { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .filter-row { grid-template-columns: 1fr 1fr; }
      .hero-title { font-size: 28px; }
      .mobile-bottom-nav { display: block; }
      .shell-wrap { padding-bottom: 96px; }
    }
    @media (max-width: 640px) {
      .hero-inner, .sticky-nav-inner { padding-left: 14px; padding-right: 14px; }
      .section-head, .metrics-grid, .filter-row { padding-left: 16px; padding-right: 16px; }
      .hero-sub { font-size: 14px; line-height: 1.65; }
      .flow-rail { flex-wrap: nowrap; overflow: auto; padding-bottom: 4px; }
      .section-jump { display: none; }
      .hero-title { font-size: 24px; }
      .metrics-grid { grid-template-columns: 1fr 1fr; }
      .filter-row { grid-template-columns: 1fr; }
    }

    /* VISUAL_GOVERNANCE_PHASE7 */
    body, input, button, select, textarea, option {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", Arial, sans-serif !important;
    }
    img, svg, canvas, video { max-width: 100%; height: auto; display: block; }
    .hero-title, .hero-sub, td, th { overflow-wrap: anywhere; word-break: break-word; }
    .section-card, .metric-card, .summary-card, .table-wrap { overflow: hidden; }
    @media (max-width: 860px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .hero-side { display: none; }
    }
    @media (max-width: 640px) {
      .hero-title { font-size: 24px !important; line-height: 1.2 !important; }
      .metrics-grid { grid-template-columns: 1fr 1fr !important; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Sticky Navigation -->
  <div class="sticky-nav">
    <div class="sticky-nav-inner">
      <nav class="nav-links">
        <a href="./index.html" class="nav-link">总控台</a>
        <a href="./market-overview.html" class="nav-link">市场驾驶舱</a>
        <a href="./strategy-vs-market.html" class="nav-link">策略中心</a>
        <a href="./decision-candidates.html" class="nav-link">候选执行</a>
        <a href="./research-lab.html" class="nav-link">复盘研究</a>
        <a href="./recommendation-review.html" class="nav-link active">复盘明细</a>
      </nav>
    </div>
  </div>

  <!-- Section Jump -->
  <div class="section-jump">
    <a href="./index.html" class="jump-link">&#8592; 总控台</a>
    <a href="./market-overview.html" class="jump-link">市场</a>
    <a href="./strategy-vs-market.html" class="jump-link">策略</a>
    <a href="./research-lab.html" class="jump-link">&#8592; 复盘研究</a>
  </div>

  <div class="shell-wrap">

    <!-- Loading State -->
    <div v-if="loading" class="loading-state" style="margin-top:28px;">
      <div class="loading-icon">&#8987;</div>
      <div class="loading-title">加载复盘数据中…</div>
      <div class="loading-sub">正在读取推荐复盘与明细</div>
    </div>

    <!-- Error State -->
    <div v-else-if="error" class="error-state" style="margin-top:28px;">
      <div class="error-icon">&#9888;</div>
      <div class="error-title">数据加载失败</div>
      <div class="error-sub">{{ error }}</div>
    </div>

    <!-- Main Content -->
    <template v-else>

      <!-- Hero -->
      <section class="hero" style="border-radius:24px 24px 0 0; margin-top:18px;">
        <div class="hero-inner">
          <div style="margin-bottom:16px;">
            <span class="brand-kicker">&#9670; 复盘明细库</span>
          </div>
          <div class="hero-grid">
            <div class="hero-main">
              <h1 class="hero-title">启动前夕推荐复盘</h1>
              <div class="hero-sub">成绩单 / 明细 — 次日涨幅、累计涨幅、推荐频次多维度复盘</div>
              <div class="status-inline" style="margin-top:16px;">
                <span class="status-chip">最新推荐日 {{ summary.latest_recommend_date || '—' }}</span>
                <span class="status-chip">最新价格日 {{ summary.latest_price_date || '—' }}</span>
                <span class="status-chip">样本 {{ summary.total_rows || 0 }}</span>
              </div>
              <div class="hero-answer" style="margin-top:14px;">
                <div class="hero-answer-label">复盘结论</div>
                <div class="hero-answer-text">{{ reviewConclusion }}</div>
              </div>
            </div>
            <div class="hero-side">
              <div class="hero-side-title">复盘快照</div>
              <div class="hero-side-grid">
                <div class="side-metric"><div class="side-metric-label">次日均值</div><div class="side-metric-value">{{ fmtPct(summary.performance?.avg_next_day_return_pct) }}</div></div>
                <div class="side-metric"><div class="side-metric-label">累计均值</div><div class="side-metric-value">{{ fmtPct(summary.performance?.avg_cumulative_return_pct) }}</div></div>
                <div class="side-metric"><div class="side-metric-label">命中率</div><div class="side-metric-value">{{ fmtPct(summary.performance?.next_day_hit_rate_pct) }}</div></div>
                <div class="side-metric"><div class="side-metric-label">高频推荐</div><div class="side-metric-value" style="font-size:16px;">{{ topRepeatTitle }}</div></div>
              </div>
              <div style="margin-top:14px;">
                <div class="route-list">
                  <div class="route-step">
                    <div class="route-index">1</div>
                    <div><div class="route-main">次日均值</div><div class="route-sub">{{ fmtPct(summary.performance?.avg_next_day_return_pct) }}，命中率 {{ fmtPct(summary.performance?.next_day_hit_rate_pct) }}</div></div>
                  </div>
                  <div class="route-step">
                    <div class="route-index">2</div>
                    <div><div class="route-main">累计均值</div><div class="route-sub">{{ fmtPct(summary.performance?.avg_cumulative_return_pct) }}，{{ summary.total_rows || 0 }} 条样本</div></div>
                  </div>
                  <div class="route-step">
                    <div class="route-index">3</div>
                    <div><div class="route-main">高频推荐</div><div class="route-sub">{{ topRepeatTitle }}</div></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- KPI Metrics -->
      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">复盘成绩单</div>
            <div class="section-title">复盘健康度</div>
            <div class="section-sub">次日涨幅、命中率、高频推荐对象多维评估</div>
          </div>
          <span class="kpi-badge blue">{{ filteredRows.length }} 条</span>
        </div>
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-label">最新日样本</div>
            <div class="metric-value">{{ summary.latest_date_row_count || 0 }}</div>
            <div class="metric-note">{{ summary.latest_recommend_date || '—' }}</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">唯一股票</div>
            <div class="metric-value">{{ summary.unique_stock_count || 0 }}</div>
            <div class="metric-note">覆盖数量</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">次日均值</div>
            <div class="metric-value" :style="nextDayColor(summary.performance?.avg_next_day_return_pct)">{{ fmtPct(summary.performance?.avg_next_day_return_pct) }}</div>
            <div class="metric-note">推荐次日</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">累计均值</div>
            <div class="metric-value" :style="nextDayColor(summary.performance?.avg_cumulative_return_pct)">{{ fmtPct(summary.performance?.avg_cumulative_return_pct) }}</div>
            <div class="metric-note">全周期</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">命中率</div>
            <div class="metric-value">{{ fmtPct(summary.performance?.next_day_hit_rate_pct) }}</div>
            <div class="metric-note">次日正向</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">最高频推荐</div>
            <div class="metric-value" style="font-size:16px;">{{ topRepeatTitle }}</div>
            <div class="metric-note">{{ (summary.top_repeat_recommendations || [])[0]?.recommend_count || 0 }} 次</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">最新推荐日</div>
            <div class="metric-value" style="font-size:18px;">{{ summary.latest_recommend_date || '—' }}</div>
            <div class="metric-note">数据新鲜度</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">最新价格日</div>
            <div class="metric-value" style="font-size:18px;">{{ summary.latest_price_date || '—' }}</div>
            <div class="metric-note">价格数据</div>
          </div>
        </div>
      </section>

      <!-- Filter Row -->
      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">筛选器</div>
            <div class="section-title">推荐明细筛选</div>
            <div class="section-sub">先筛选，再看明细 — 当前命中 {{ filteredRows.length }} 条</div>
          </div>
          <button @click="resetFilters" class="ghost-btn" style="padding:8px 14px; font-size:12px;">&#8635; 重置</button>
        </div>
        <div class="filter-row">
          <input v-model.trim="filters.code" class="filter-input" placeholder="股票代码 / 名称" />
          <select v-model="filters.date" class="filter-select">
            <option value="">全部日期</option>
            <option v-for="d in dateOptions" :key="d" :value="d">{{ d }}</option>
          </select>
          <select v-model="filters.sector" class="filter-select">
            <option value="">全部板块</option>
            <option v-for="s in sectorOptions" :key="s" :value="s">{{ s }}</option>
          </select>
          <select v-model="filters.aiView" class="filter-select">
            <option value="">全部 AI 观点</option>
            <option v-for="v in aiViewOptions" :key="v" :value="v">{{ v }}</option>
          </select>
          <select v-model="filters.sortBy" class="filter-select">
            <option value="recommend_date">按推荐日期</option>
            <option value="cumulative_return_pct">按累计涨幅</option>
            <option value="next_day_return_pct">按次日涨幅</option>
            <option value="ai_score">按 AI 评分</option>
            <option value="cumulative_recommend_count">按累计推荐次数</option>
          </select>
        </div>
      </section>

      <!-- Table -->
      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">推荐明细</div>
            <div class="section-title">复盘明细表</div>
            <div class="section-sub">当前 {{ filteredRows.length }} 条 / 共 {{ rows.length }} 条</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>推荐日期</th>
                <th>股票</th>
                <th>板块</th>
                <th>AI 观点</th>
                <th>AI 分</th>
                <th>次日涨幅</th>
                <th>累计涨幅</th>
                <th>推荐次数</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="row in filteredRows" :key="`${row.recommend_date}-${row.stock_code}`">
                <td style="white-space:nowrap;">{{ row.recommend_date }}</td>
                <td>
                  <div style="font-weight:900; color:#0f172a;">{{ row.stock_name }}</div>
                  <div style="font-size:11px; color:#94a3b8; margin-top:2px;">{{ row.stock_code }}</div>
                </td>
                <td>{{ row.sector_name || '未知' }}</td>
                <td>
                  <div style="font-weight:800; color:#334155;">{{ row.ai_view || '未标注' }}</div>
                  <div style="font-size:11px; color:#94a3b8; margin-top:2px;">{{ row.ai_decision || '—' }}</div>
                </td>
                <td>{{ fmtScore(row.ai_score) }}</td>
                <td><span :class="pillClass(row.next_day_return_pct)">{{ fmtPct(row.next_day_return_pct) }}</span></td>
                <td><span :class="pillClass(row.cumulative_return_pct)">{{ fmtPct(row.cumulative_return_pct) }}</span></td>
                <td>
                  <div style="font-weight:800; color:#0f172a;">{{ row.cumulative_recommend_count || 0 }}</div>
                  <div style="font-size:11px; color:#94a3b8; margin-top:2px;">次</div>
                </td>
              </tr>
              <tr v-if="!filteredRows.length">
                <td colspan="8" style="text-align:center; padding:40px; color:#94a3b8; font-size:14px;">
                  无符合筛选条件的数据
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Summary Row -->
      <div style="display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:14px; margin-top:18px;">
        <div class="summary-card blue">
          <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#64748b;">最高频推荐</div>
          <div style="margin-top:10px; font-size:16px; font-weight:900; color:#0f172a;">{{ topRepeatTitle }}</div>
          <div style="margin-top:8px; font-size:12px; color:#64748b;">{{ (summary.top_repeat_recommendations || [])[0]?.recommend_count || 0 }} 次推荐</div>
        </div>
        <div class="summary-card green">
          <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#64748b;">次日均值</div>
          <div style="margin-top:10px; font-size:20px; font-weight:900;" :style="nextDayColor(summary.performance?.avg_next_day_return_pct)">{{ fmtPct(summary.performance?.avg_next_day_return_pct) }}</div>
          <div style="margin-top:8px; font-size:12px; color:#64748b;">命中率 {{ fmtPct(summary.performance?.next_day_hit_rate_pct) }}</div>
        </div>
        <div class="summary-card purple">
          <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#64748b;">累计均值</div>
          <div style="margin-top:10px; font-size:20px; font-weight:900;" :style="nextDayColor(summary.performance?.avg_cumulative_return_pct)">{{ fmtPct(summary.performance?.avg_cumulative_return_pct) }}</div>
          <div style="margin-top:8px; font-size:12px; color:#64748b;">{{ summary.total_rows || 0 }} 条样本</div>
        </div>
      </div>

    </template>
  </div><!-- .shell-wrap -->

  <!-- Mobile Bottom Nav -->
  <div class="mobile-bottom-nav">
    <div class="mobile-bottom-grid">
      <a href="./index.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#9632;</span>总控</a>
      <a href="./market-overview.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#9673;</span>市场</a>
      <a href="./strategy-vs-market.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#9651;</span>策略</a>
      <a href="./decision-candidates.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#10003;</span>候选</a>
      <a href="./recommendation-review.html" class="mobile-bottom-link active"><span class="mobile-bottom-icon">&#9646;</span>复盘</a>
    </div>
  </div>

</div><!-- #app -->

<script>
Vue.createApp({
  data() {
    return {
      loading: true, error: '', summary: {}, rows: [],
      filters: { code: '', date: '', sector: '', aiView: '', sortBy: 'recommend_date' }
    };
  },
  computed: {
    dateOptions() { return [...new Set(this.rows.map(row => row.recommend_date).filter(Boolean))].sort().reverse(); },
    sectorOptions() { return [...new Set(this.rows.map(row => row.sector_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN')); },
    aiViewOptions() { return [...new Set(this.rows.map(row => row.ai_view).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN')); },
    topRepeatTitle() {
      const row = (this.summary.top_repeat_recommendations || [])[0];
      return row ? `${row.stock_name} ${row.stock_code}` : '暂无';
    },
    filteredRows() {
      const text = this.filters.code.toLowerCase();
      return this.rows.filter(row => {
        const codeOk = !text || String(row.stock_code || '').toLowerCase().includes(text) || String(row.stock_name || '').toLowerCase().includes(text);
        const dateOk = !this.filters.date || row.recommend_date === this.filters.date;
        const sectorOk = !this.filters.sector || row.sector_name === this.filters.sector;
        const aiViewOk = !this.filters.aiView || row.ai_view === this.filters.aiView;
        return codeOk && dateOk && sectorOk && aiViewOk;
      }).sort((a, b) => {
        if (this.filters.sortBy === 'recommend_date') {
          return String(b.recommend_date || '').localeCompare(String(a.recommend_date || '')) || String(a.stock_code || '').localeCompare(String(b.stock_code || ''));
        }
        const av = Number(a[this.filters.sortBy] ?? -999999);
        const bv = Number(b[this.filters.sortBy] ?? -999999);
        return bv - av;
      });
    },
    reviewConclusion(){
      if(this.error) return '数据加载异常，请检查网络或刷新页面。';
      const hit = this.fmtPct(this.summary.performance?.next_day_hit_rate_pct);
      const next = this.fmtPct(this.summary.performance?.avg_next_day_return_pct);
      const top = this.topRepeatTitle;
      return `共 ${this.summary.total_rows || 0} 条样本，命中率 ${hit}，次日均值 ${next}。最高频推荐 ${top}。`;
    }
  },
  methods: {
    resetFilters() { this.filters = { code: '', date: '', sector: '', aiView: '', sortBy: 'recommend_date' }; },
    fmtPct(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return '—';
      const n = Number(v);
      return `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
    },
    fmtScore(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return '—';
      return Number(v).toFixed(0);
    },
    pillClass(v) {
      const n = Number(v);
      if (Number.isNaN(n)) return 'pill gray';
      return n > 0 ? 'pill green' : n < 0 ? 'pill red' : 'pill gray';
    },
    nextDayColor(v) {
      const n = Number(v);
      if (Number.isNaN(n)) return 'color:#0f172a';
      return n > 0 ? 'color:#16a34a' : n < 0 ? 'color:#dc2626' : 'color:#0f172a';
    }
  },
  async mounted() {
    try {
      const [summaryResp, detailResp] = await Promise.all([
        fetch('data/recommendation_analytics/prebreakout_summary.json?' + Date.now(), { cache: 'no-store' }),
        fetch('data/recommendation_analytics/prebreakout_recommendations.json?' + Date.now(), { cache: 'no-store' })
      ]);
      if (!summaryResp.ok) throw new Error('prebreakout_summary.json 未找到（HTTP ' + summaryResp.status + '）');
      if (!detailResp.ok) throw new Error('prebreakout_recommendations.json 未找到（HTTP ' + detailResp.status + '）');
      this.summary = await summaryResp.json();
      const detail = await detailResp.json();
      this.rows = detail.rows || [];
      const params = new URLSearchParams(window.location.search);
      this.filters.code = params.get('code') || '';
      this.filters.sector = params.get('sector') || '';
      this.filters.aiView = params.get('aiView') || '';
      this.filters.date = params.get('date') || '';
    } catch (err) {
      this.error = (err?.message || String(err)) + ' — 请确认复盘流程已运行并发布数据。';
    } finally {
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
