<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      --primary-soft: #dbeafe;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warn: #ca8a04;

      height: 320px;

    .hero-inner { max-width: 1380px; margin: 0 auto; padding: 24px 18px 26px; }
    .brand-kicker {

      text-transform: uppercase; color: #dbeafe;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);

    .status-inline { display: flex; flex-wrap: wrap; gap: 8px; }
    .status-chip {

    .hero-main { padding: 24px; }
    .hero-side { padding: 18px; }
    .hero-title { font-size: 34px; line-height: 1.15; font-weight: 900; margin: 0; }
    .hero-sub { margin: 10px 0 0; color: #dbeafe; font-size: 15px; line-height: 1.75; max-width: 760px; }
    .hero-answer {
      margin-top: 16px; padding: 14px 16px; border-radius: 18px;
      background: rgba(15,23,42,.22); border: 1px solid rgba(255,255,255,.10);

    .hero-answer-label { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #bfdbfe; text-transform: uppercase; }
    .hero-answer-text { margin-top: 8px; font-size: 15px; line-height: 1.8; color: #f8fafc; }
    .flow-rail { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .flow-step {

    .flow-step.active { color:#fff; background: rgba(59,130,246,.24); border-color: rgba(147,197,253,.38); }
    .hero-side-title { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #bfdbfe; text-transform: uppercase; }

    .metric-card {

    .metric-label { color: var(--text-2); font-size: 12px; }

    .metric-note { margin-top: 8px; font-size: 12px; color: #64748b; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; padding: 0 22px 22px; }
    .summary-card { border-radius: 20px; padding: 16px; border: 1px solid transparent; }

    .summary-card.amber { background: linear-gradient(180deg, #fff8e9, #fffdf4); border-color: #fde68a; }
    .table-wrap { overflow: auto; max-height: 70vh; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; font-weight: 800; padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(148,163,184,.16); white-space: nowrap; background: #f8fafc; }
    td { padding: 12px 16px; border-bottom: 1px solid rgba(148,163,184,.10); font-size: 13px; color: #334155; vertical-align: top; }

    .progress-label { font-size:13px; font-weight:800; color:#0f172a; }

    .route-list { display:grid; gap:10px; margin-top:14px; }

    .route-index { width: 26px; height:26px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; background:#dbeafe; color:#1d4ed8; flex: 0 0 auto; }
    .route-main { font-size:13px; font-weight:800; color:#0f172a; }
    .route-sub { margin-top:3px; font-size:12px; color:#64748b; line-height:1.6; }
    .kpi-badge { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; }
    .kpi-badge.green { background:#dcfce7; color:#16a34a; }
    .kpi-badge.blue { background:#dbeafe; color:#1d4ed8; }
    .kpi-badge.amber { background:#fef3c7; color:#ca8a04; }
    .kpi-badge.red { background:#fee2e2; color:#dc2626; }
    .pill { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; }
    .pill.green { background:#dcfce7; color:#16a34a; }
    .pill.blue { background:#dbeafe; color:#1d4ed8; }
    .pill.amber { background:#fef3c7; color:#ca8a04; }
    .pill.red { background:#fee2e2; color:#dc2626; }
    .pill.gray { background:#f1f5f9; color:#64748b; }
    .filter-row { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; padding: 18px 22px; }
    .filter-input { background: #fff; color: #0f172a; border: 1px solid rgba(148,163,184,.22); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; }
    .filter-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.10); }
    .filter-select { background: #fff; color: #0f172a; border: 1px solid rgba(148,163,184,.22); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; }
    .filter-select:focus { border-color: #2563eb; }
    .cta-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding: 0 22px 22px; }
    .primary-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:14px; background: linear-gradient(135deg, #1d4ed8, #2563eb); color:#fff; font-size:13px; font-weight:800; border:none; cursor:pointer; box-shadow: 0 8px 20px rgba(37,99,235,.24); text-decoration:none; }
    .ghost-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:14px; background:#fff; color:#334155; font-size:13px; font-weight:800; border:1px solid rgba(148,163,184,.22); cursor:pointer; text-decoration:none; }
    .loading-state { background:#fff; border:1px solid rgba(148,163,184,.16); border-radius:24px; padding:48px 32px; text-align:center; box-shadow:var(--shadow-soft); }
    .loading-icon { font-size:48px; line-height:1; }
    .loading-title { margin-top:16px; font-size:20px; font-weight:900; color:#0f172a; }
    .loading-sub { margin-top:8px; font-size:14px; color:#64748b; }
    .error-state { background:#fff; border:1px solid #fecaca; border-radius:24px; padding:48px 32px; text-align:center; box-shadow:var(--shadow-soft); }
    .error-icon { font-size:48px; line-height:1; }
    .error-title { margin-top:16px; font-size:20px; font-weight:900; color:#dc2626; }
    .error-sub { margin-top:8px; font-size:14px; color:#64748b; max-width:480px; margin-left:auto; margin-right:auto; word-break:break-all; }

    @media (max-width: 1200px) {
      .hero-grid, .summary-grid, .aside-grid, .cta-row { grid-template-columns: 1fr 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    /* VISUAL_GOVERNANCE_PHASE7 */
    body, input, button, select, textarea, option {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", Arial, sans-serif !important;
    }
    img, svg, canvas, video { max-width: 100%; height: auto; display: block; }
    .hero-title, .hero-sub, td, th { overflow-wrap: anywhere; word-break: break-word; }
    .section-card, .metric-card, .summary-card, .table-wrap { overflow: hidden; }
    @media (max-width: 860px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .hero-side { display: none; }
    }
    @media (max-width: 640px) {
      .hero-title { font-size: 24px !important; line-height: 1.2 !important; }
      .metrics-grid { grid-template-columns: 1fr 1fr !important; }
    }

    .theme-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .theme-note { padding:12px 14px; border-radius:16px; background:rgba(15,23,42,.72); border:1px solid rgba(148,163,184,.14); }
    .theme-note-label { color:#8ea3bf; font-size:12px; }
    .theme-note-value { margin-top:6px; color:#f8fbff; font-size:15px; font-weight:800; line-height:1.5; }

<script>
Vue.createApp({
  data() {
    return {
      loading: true,
      error: '',
      summary: {},
      rows: [],
      filters: { code: '', date: '', sector: '', aiView: '', sortBy: 'recommend_date' },
      columnVisibility: { sector:true, aiDecision:true, aiScore:true, nextDay:true, cumulative:true, count:true },
      refreshAt: '',
      restoreTag: '',
      stateReady: false
    };
  },
  computed: {
    dateOptions() { return [...new Set(this.rows.map(row => row.recommend_date).filter(Boolean))].sort().reverse(); },
    sectorOptions() { return [...new Set(this.rows.map(row => row.sector_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN')); },
    aiViewOptions() { return [...new Set(this.rows.map(row => row.ai_view).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN')); },
    topRepeatTitle() {
      const row = (this.summary.top_repeat_recommendations || [])[0];
      return row ? `${row.stock_name} ${row.stock_code}` : '暂无';
    },
    stateBadge() {
      const refresh = this.refreshAt ? `刷新 ${this.refreshAt}` : '待刷新';
      return this.restoreTag ? `${this.restoreTag}｜${refresh}` : refresh;
    },
    visibleColumnCount(){
      return ['sector','aiDecision','aiScore','nextDay','cumulative','count'].filter(key => this.columnVisibility[key]).length;
    },
    activeFilterChips(){
      const chips = [];
      if (this.filters.code) chips.push(`关键词：${this.filters.code}`);
      if (this.filters.date) chips.push(`日期：${this.filters.date}`);
      if (this.filters.sector) chips.push(`板块：${this.filters.sector}`);
      if (this.filters.aiView) chips.push(`AI 观点：${this.filters.aiView}`);
      if (this.filters.sortBy && this.filters.sortBy !== 'recommend_date') chips.push(`排序：${this.filters.sortBy}`);
      return chips;
    },
    filteredRows() {
      const text = this.filters.code.toLowerCase();
      return this.rows.filter(row => {
        const codeOk = !text || String(row.stock_code || '').toLowerCase().includes(text) || String(row.stock_name || '').toLowerCase().includes(text);
        const dateOk = !this.filters.date || row.recommend_date === this.filters.date;
        const sectorOk = !this.filters.sector || row.sector_name === this.filters.sector;
        const aiViewOk = !this.filters.aiView || row.ai_view === this.filters.aiView;
        return codeOk && dateOk && sectorOk && aiViewOk;
      }).sort((a, b) => {
        if (this.filters.sortBy === 'recommend_date') {
          return String(b.recommend_date || '').localeCompare(String(a.recommend_date || '')) || String(a.stock_code || '').localeCompare(String(b.stock_code || ''));
        }
        const av = Number(a[this.filters.sortBy] ?? -999999);
        const bv = Number(b[this.filters.sortBy] ?? -999999);
        return bv - av;
      });
    },
    reviewConclusion(){
      if(this.error) return '数据加载异常，请检查网络或刷新页面。';
      const hit = this.fmtPct(this.summary.performance?.next_day_hit_rate_pct);
      const next = this.fmtPct(this.summary.performance?.avg_next_day_return_pct);
      const top = this.topRepeatTitle;
      return `共 ${this.summary.total_rows || 0} 条样本，命中率 ${hit}，次日均值 ${next}。最高频推荐 ${top}。`;
    },
    biasSummary(){
      const next = Number(this.summary.performance?.avg_next_day_return_pct ?? NaN);
      const cum = Number(this.summary.performance?.avg_cumulative_return_pct ?? NaN);
      if (Number.isNaN(next) || Number.isNaN(cum)) return '样本仍不足，先补齐完整价格链。';
      if (next < 0 && cum < 0) return '短期与累计表现都偏弱，优先回看筛选口径与 AI 标签。';
      if (next < 0 && cum >= 0) return '短线承接偏弱，但累计仍可，需拆解持有周期。';
      if (next >= 0 && cum < 0) return '首日反馈尚可，但后续回吐明显，需复核止盈止损。';
      return '短期与累计都未明显失真，可继续关注重复命中样本。';
    }
  },
  watch: {
    filters: {
      deep: true,
      handler() { this.persistState(); }
    },
    columnVisibility: {
      deep: true,
      handler() { this.persistState(); }
    }
  },
  methods: {
    storageKey() { return 'stock-report:recommendation-review:v1'; },
    serializeState() { return { ...this.filters, columnVisibility: this.columnVisibility }; },
    applyState(state) {
      this.filters.code = state.code || '';
      this.filters.date = state.date || '';
      this.filters.sector = state.sector || '';
      this.filters.aiView = state.aiView || '';
      this.filters.sortBy = state.sortBy || 'recommend_date';
      const cols = state.columnVisibility || {};
      this.columnVisibility = {
        sector: cols.sector !== false,
        aiDecision: cols.aiDecision !== false,
        aiScore: cols.aiScore !== false,
        nextDay: cols.nextDay !== false,
        cumulative: cols.cumulative !== false,
        count: cols.count !== false
      };
    },
    syncUrl() {
      const url = new URL(window.location.href);
      const state = this.serializeState();
      Object.entries(state).forEach(([key, value]) => {
        if (key === 'columnVisibility') return;
        if (value) url.searchParams.set(key, value);
        else url.searchParams.delete(key);
      });
      const visibleCols = ['sector','aiDecision','aiScore','nextDay','cumulative','count'].filter(key => state.columnVisibility?.[key]);
      if (visibleCols.length && visibleCols.length < 6) url.searchParams.set('cols', visibleCols.join(','));
      else url.searchParams.delete('cols');
      const query = url.searchParams.toString();
      history.replaceState({}, '', url.pathname + (query ? `?${query}` : ''));
    },
    persistState() {
      if (!this.stateReady) return;
      try { localStorage.setItem(this.storageKey(), JSON.stringify(this.serializeState())); } catch {}
      this.syncUrl();
    },
    restoreState() {
      let state = null;
      const params = new URLSearchParams(window.location.search);
      const fromQuery = ['code','date','sector','aiView','sortBy','cols'].some(key => params.get(key));
      if (fromQuery) {
        const cols = (params.get('cols') || '').split(',').filter(Boolean);
        state = {
          code: params.get('code') || '',
          date: params.get('date') || '',
          sector: params.get('sector') || '',
          aiView: params.get('aiView') || '',
          sortBy: params.get('sortBy') || 'recommend_date',
          columnVisibility: cols.length ? {
            sector: cols.includes('sector'),
            aiDecision: cols.includes('aiDecision'),
            aiScore: cols.includes('aiScore'),
            nextDay: cols.includes('nextDay'),
            cumulative: cols.includes('cumulative'),
            count: cols.includes('count')
          } : undefined
        };
        this.restoreTag = '已从链接恢复';
      } else {
        try {
          const raw = localStorage.getItem(this.storageKey());
          if (raw) {
            state = JSON.parse(raw);
            this.restoreTag = '已从本地恢复';
          }
        } catch {}
      }
      if (state) this.applyState(state);
    },
    markRefreshed() { this.refreshAt = new Date().toLocaleTimeString('zh-CN', { hour12:false }); },
    resetFilters() {
      this.filters = { code: '', date: '', sector: '', aiView: '', sortBy: 'recommend_date' };
      this.columnVisibility = { sector:true, aiDecision:true, aiScore:true, nextDay:true, cumulative:true, count:true };
      this.restoreTag = '已重置筛选';
      this.persistState();
    },
    toggleColumn(key) {
      this.columnVisibility[key] = !this.columnVisibility[key];
      if (!Object.values(this.columnVisibility).some(Boolean)) this.columnVisibility[key] = true;
      this.restoreTag = '已调整列视图';
      this.persistState();
    },
    fmtPct(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return '—';
      const n = Number(v);
      return `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
    },
    fmtScore(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return '—';
      return Number(v).toFixed(0);
    },
    pillClass(v) {
      const n = Number(v);
      if (Number.isNaN(n)) return 'pill gray';
      return n > 0 ? 'pill green' : n < 0 ? 'pill red' : 'pill gray';
    },
    nextDayColor(v) {
      const n = Number(v);
      if (Number.isNaN(n)) return 'color:#0f172a';
      return n > 0 ? 'color:#16a34a' : n < 0 ? 'color:#dc2626' : 'color:#0f172a';
    },
    async loadData(showLoading=false) {
      if (showLoading) {
        this.loading = true;
        this.error = '';
      }
      try {
        const [summaryResp, detailResp] = await Promise.all([
          fetch('data/recommendation_analytics/prebreakout_summary.json?' + Date.now(), { cache: 'no-store' }),
          fetch('data/recommendation_analytics/prebreakout_recommendations.json?' + Date.now(), { cache: 'no-store' })
        ]);
        if (!summaryResp.ok) throw new Error('prebreakout_summary.json 未找到（HTTP ' + summaryResp.status + '）');
        if (!detailResp.ok) throw new Error('prebreakout_recommendations.json 未找到（HTTP ' + detailResp.status + '）');
        this.summary = await summaryResp.json();
        const detail = await detailResp.json();
        this.rows = detail.rows || [];
        if (!this.stateReady) {
          this.restoreState();
          this.stateReady = true;
        }
        this.markRefreshed();
        this.persistState();
      } catch (err) {
        this.error = (err?.message || String(err)) + ' — 请确认复盘流程已运行并发布数据。';
      } finally {
        this.loading = false;
      }
    }
  },
  async mounted() {
    await this.loadData(false);
  }
}).mount('#app');
</script>
</body>
</html>
