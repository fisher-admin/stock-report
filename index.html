<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A股选股操作系统</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg, #eef4fb 0%, #e9eef6 100%); }
    .card { background: rgba(255,255,255,.94); backdrop-filter: blur(10px); }
    .metric { background:#f8fafc; border:1px solid #e5e7eb; border-radius:16px; padding:16px; }
    .nav-card { border:1px solid #e5e7eb; border-radius:18px; background:linear-gradient(180deg,#fff 0%,#f8fafc 100%); transition:all .18s ease; }
    .nav-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15,23,42,.08); }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .ok { background:#dcfce7; color:#166534; }
    .warn { background:#fef3c7; color:#92400e; }
    .bad { background:#fee2e2; color:#991b1b; }
    .neutral { background:#e0f2fe; color:#075985; }
  </style>
</head>
<body class="text-gray-800">
<div id="app">
  <header class="text-white px-6 py-8" style="background:linear-gradient(135deg,#10213b 0%,#1d4d7a 45%,#3182f6 100%);">
    <div class="max-w-7xl mx-auto flex flex-wrap items-start justify-between gap-4">
      <div>
        <div class="text-xs uppercase tracking-widest text-blue-100 mb-2">Fisher Stock OS</div>
        <h1 class="text-3xl font-bold">A股选股操作系统</h1>
        <p class="mt-2 text-sm text-blue-100">先看市场，再看策略，再落到候选股，最后回到复盘与研究。</p>
      </div>
      <div class="text-sm text-blue-100">
        <div>交易日：<b>{{ manifest.trade_date || '-' }}</b></div>
        <div class="mt-1">Run ID：<span class="font-mono">{{ manifest.run_id || '-' }}</span></div>
        <div class="mt-1">生成时间：{{ manifest.generated_at || '-' }}</div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div v-if="loading" class="card rounded-2xl shadow p-10 text-center text-gray-400">加载系统总控台中...</div>
    <div v-else-if="error" class="card rounded-2xl shadow p-10 text-center text-red-600">{{ error }}</div>
    <template v-else>
      <section class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
        <div class="metric"><div class="text-xs text-gray-500">发布状态</div><div class="text-xl font-bold mt-1">{{ manifest.published ? '已发布' : '未发布' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">Validation</div><div class="text-xl font-bold mt-1">{{ manifest.validation_ok ? '通过' : '异常' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">AI补齐</div><div class="text-xl font-bold mt-1">{{ manifest.ai_complete ? '完成' : '未满' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">市场状态</div><div class="text-xl font-bold mt-1">{{ manifest.market_regime || '-' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">策略数</div><div class="text-xl font-bold mt-1">{{ strategy.strategy_count || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">候选股</div><div class="text-xl font-bold mt-1">{{ totalCandidates }}</div></div>
      </section>

      <section class="card rounded-2xl shadow p-5 mb-6">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div>
            <h2 class="text-lg font-bold">系统可信度总览</h2>
            <p class="text-sm text-gray-500 mt-1">先判断今天这轮结果能不能看，再决定该进入哪一层。</p>
          </div>
          <div class="flex flex-wrap gap-2 text-xs">
            <span class="pill" :class="manifest.validation_ok ? 'ok' : 'bad'">Validation {{ manifest.validation_ok ? 'OK' : 'FAIL' }}</span>
            <span class="pill" :class="manifest.ai_complete ? 'ok' : 'warn'">AI {{ manifest.ai_complete ? '20/20' : '未补满' }}</span>
            <span class="pill" :class="manifest.published ? 'ok' : 'warn'">Publish {{ manifest.published ? '已推送' : '未推送' }}</span>
          </div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 mt-4">
          <div class="rounded-xl bg-blue-50 border border-blue-100 p-4">
            <div class="text-sm font-bold text-blue-700 mb-2">市场层判断</div>
            <div class="text-sm text-blue-800 leading-relaxed">{{ marketSummary }}</div>
          </div>
          <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-4">
            <div class="text-sm font-bold text-emerald-700 mb-2">策略层判断</div>
            <div class="text-sm text-emerald-800 leading-relaxed">{{ strategySummary }}</div>
          </div>
          <div class="rounded-xl bg-purple-50 border border-purple-100 p-4">
            <div class="text-sm font-bold text-purple-700 mb-2">个股层判断</div>
            <div class="text-sm text-purple-800 leading-relaxed">{{ candidateSummary }}</div>
          </div>
        </div>
      </section>

      <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 mb-6">
        <a href="./market-overview.html" class="nav-card p-5 block">
          <div class="text-xs uppercase tracking-wide text-gray-400">Layer 1</div>
          <div class="text-xl font-bold mt-1">市场驾驶舱</div>
          <div class="text-sm text-gray-500 mt-2">晨判 / 午盘 / 市场热力 / 风险状态 / 主线行业。</div>
          <div class="mt-4 flex flex-wrap gap-2 text-xs">
            <span class="pill neutral">{{ market.market_summary?.market_regime || '待判断' }}</span>
            <span class="pill neutral">主线 {{ (market.top_market_sectors || []).length }}</span>
          </div>
        </a>
        <a href="./strategy-vs-market.html" class="nav-card p-5 block">
          <div class="text-xs uppercase tracking-wide text-gray-400">Layer 2</div>
          <div class="text-xl font-bold mt-1">策略中心</div>
          <div class="text-sm text-gray-500 mt-2">看哪条策略激活、和市场是否对上、该不该上主线。</div>
          <div class="mt-4 flex flex-wrap gap-2 text-xs">
            <span class="pill ok">激活 {{ strategy.active_count || 0 }}</span>
            <span class="pill warn">观察 {{ strategy.watch_count || 0 }}</span>
          </div>
        </a>
        <a href="./decision-candidates.html" class="nav-card p-5 block">
          <div class="text-xs uppercase tracking-wide text-gray-400">Layer 3</div>
          <div class="text-xl font-bold mt-1">候选股决策中心</div>
          <div class="text-sm text-gray-500 mt-2">把候选股收成标准决策卡，看主攻 / 观察 / 回避。</div>
          <div class="mt-4 flex flex-wrap gap-2 text-xs">
            <span class="pill ok">主攻 {{ candidate.role_counts?.main || 0 }}</span>
            <span class="pill warn">观察 {{ candidate.role_counts?.watch || 0 }}</span>
            <span class="pill bad">回避 {{ candidate.role_counts?.avoid || 0 }}</span>
          </div>
        </a>
        <a href="./research-lab.html" class="nav-card p-5 block">
          <div class="text-xs uppercase tracking-wide text-gray-400">Layer 4</div>
          <div class="text-xl font-bold mt-1">复盘与研究</div>
          <div class="text-sm text-gray-500 mt-2">复盘库、研究线、验证结果和系统下一步改进入口。</div>
          <div class="mt-4 flex flex-wrap gap-2 text-xs">
            <span class="pill neutral">样本 {{ review.total_rows || 0 }}</span>
            <span class="pill neutral">研究 {{ research.generated_at ? '已接入' : '待补' }}</span>
          </div>
        </a>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">今日主线行业</h2>
          <div class="space-y-3">
            <div v-for="row in (market.top_market_sectors || []).slice(0,6)" :key="row.industry" class="rounded-xl bg-gray-50 border border-gray-100 p-3">
              <div class="flex items-center justify-between gap-3">
                <div class="font-semibold">{{ row.industry }}</div>
                <div class="text-xs text-gray-500">市场排名 {{ fmt(row.market_rank) }}</div>
              </div>
              <div class="text-xs text-gray-500 mt-1">趋势 {{ row.trend_signal || '-' }}｜均涨 {{ pct(row.avg_pct_chg) }}</div>
            </div>
          </div>
        </section>

        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">策略激活情况</h2>
          <div class="space-y-3">
            <div v-for="row in (strategy.strategies || [])" :key="row.strategy_id" class="rounded-xl bg-gray-50 border border-gray-100 p-3">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <div class="font-semibold">{{ row.strategy_name }}</div>
                  <div class="text-xs text-gray-400 mt-1">{{ row.strategy_id }}</div>
                </div>
                <span class="pill" :class="row.activation === 'active' ? 'ok' : row.activation === 'watch' ? 'warn' : 'bad'">{{ activationLabel(row.activation) }}</span>
              </div>
              <div class="text-xs text-gray-500 mt-2">市场命中 {{ row.market_overlap_count || 0 }} 个主线行业｜top20 {{ row.top20_count || 0 }}</div>
            </div>
          </div>
        </section>

        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">操作提醒</h2>
          <div class="space-y-3 text-sm text-gray-700">
            <div class="rounded-xl bg-gray-50 border border-gray-100 p-4">
              <div class="font-semibold mb-2">当前最重要的两条</div>
              <ul class="list-disc pl-5 space-y-1">
                <li>先从市场驾驶舱确认今天属于哪种风险环境。</li>
                <li>再从策略中心看激活策略，不要直接跳候选股做主观判断。</li>
              </ul>
            </div>
            <div class="rounded-xl bg-gray-50 border border-gray-100 p-4">
              <div class="font-semibold mb-2">公开页数据源</div>
              <div>当前页面已统一收口到 <span class="font-mono text-xs">data/latest/*.json</span>，不再让每个页面各自拼松散 JSON。</div>
            </div>
          </div>
        </section>
      </section>
    </template>
  </main>
</div>

<script>
Vue.createApp({
  data(){
    return { loading:true, error:'', manifest:{}, market:{}, strategy:{}, candidate:{}, review:{}, research:{} };
  },
  computed:{
    totalCandidates(){ return (this.candidate.candidates || []).length; },
    marketSummary(){
      const regime = this.manifest.market_regime || this.market.market_summary?.market_regime || '待判断';
      const risk = this.manifest.risk_score ?? this.market.market_summary?.risk_score;
      const top = (this.market.top_market_sectors || []).slice(0,3).map(r => r.industry).filter(Boolean).join('、') || '暂无主线';
      return `当前市场状态为 ${regime}，风险分数 ${risk ?? '-'}。优先围绕 ${top} 观察主线持续性。`;
    },
    strategySummary(){
      const active = this.strategy.active_count || 0;
      const watch = this.strategy.watch_count || 0;
      return `当前激活策略 ${active} 条，观察策略 ${watch} 条。先用“市场是否支持”来决定策略优先级。`;
    },
    candidateSummary(){
      const main = this.candidate.role_counts?.main || 0;
      const watch = this.candidate.role_counts?.watch || 0;
      const avoid = this.candidate.role_counts?.avoid || 0;
      return `当前主攻 ${main} 只、观察 ${watch} 只、回避 ${avoid} 只。候选股只做执行层，不单独定义市场方向。`;
    }
  },
  methods:{
    fmt(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?v:n.toFixed(0); },
    pct(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${n>=0?'+':''}${n.toFixed(2)}%`; },
    activationLabel(v){ return v === 'active' ? '激活' : v === 'watch' ? '观察' : '降级'; }
  },
  async mounted(){
    try{
      const files = [
        'data/latest/run_manifest.json',
        'data/latest/market_state.json',
        'data/latest/strategy_state.json',
        'data/latest/candidate_state.json',
        'data/latest/review_state.json',
        'data/latest/research_state.json',
      ];
      const [manifest, market, strategy, candidate, review, research] = await Promise.all(
        files.map(path => fetch(path + '?' + Date.now(), {cache:'no-store'}).then(r => {
          if(!r.ok) throw new Error(path + ' not found');
          return r.json();
        }))
      );
      this.manifest = manifest;
      this.market = market;
      this.strategy = strategy;
      this.candidate = candidate;
      this.review = review;
      this.research = research;
    }catch(err){
      this.error = err?.message || String(err);
    }finally{
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
