<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>策略中心</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg, #f4f7fb 0%, #edf2f7 100%); }
    .card { background: rgba(255,255,255,.94); backdrop-filter: blur(8px); }
    .metric { background:#f8fafc; border:1px solid #e5e7eb; border-radius:14px; padding:14px; }
    .row-card { border:1px solid #e5e7eb; border-radius:16px; padding:16px; background:linear-gradient(180deg,#fff 0%,#f8fafc 100%); }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .ok { background:#dcfce7; color:#166534; }
    .warn { background:#fef3c7; color:#92400e; }
    .bad { background:#fee2e2; color:#991b1b; }
    .neutral { background:#e0f2fe; color:#075985; }
  </style>
</head>
<body class="text-gray-800">
<div id="app">
  <header class="text-white px-6 py-8" style="background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 45%, #2563eb 100%);">
    <div class="max-w-7xl mx-auto flex flex-wrap items-start justify-between gap-4">
      <div>
        <div class="text-xs uppercase tracking-widest text-blue-100 mb-2">Strategy Layer</div>
        <h1 class="text-3xl font-bold">策略中心</h1>
        <p class="mt-2 text-sm text-blue-100">先看哪条策略被市场支持，再看策略里哪些行业和个股值得继续跟踪。</p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <a href="./index.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">返回总控台</a>
        <a href="./market-overview.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">市场驾驶舱</a>
        <a href="./decision-candidates.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">候选股中心</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div v-if="loading" class="card rounded-2xl shadow p-10 text-center text-gray-400">加载策略中心中...</div>
    <div v-else-if="error" class="card rounded-2xl shadow p-10 text-center text-red-600">{{ error }}</div>
    <template v-else>
      <section class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
        <div class="metric"><div class="text-xs text-gray-500">交易日</div><div class="text-xl font-bold mt-1">{{ strategy.latest_trade_date || '-' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">策略总数</div><div class="text-xl font-bold mt-1">{{ strategy.strategy_count || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">激活策略</div><div class="text-xl font-bold mt-1">{{ strategy.active_count || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">观察策略</div><div class="text-xl font-bold mt-1">{{ strategy.watch_count || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">降级策略</div><div class="text-xl font-bold mt-1">{{ strategy.deprioritized_count || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">市场主线</div><div class="text-xl font-bold mt-1">{{ (market.top_market_sectors || []).length }}</div></div>
      </section>

      <section class="card rounded-2xl shadow p-5 mb-6">
        <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
          <div>
            <h2 class="text-lg font-bold">系统级判断</h2>
            <p class="text-sm text-gray-500 mt-1">策略不是平行存在，而是要服从市场层和行业主线。</p>
          </div>
          <div class="text-xs text-gray-500">当前市场状态：{{ market.market_summary?.market_regime || '-' }}</div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
          <div class="rounded-xl bg-blue-50 border border-blue-100 p-4">
            <div class="text-sm font-bold text-blue-700 mb-2">市场 → 策略</div>
            <div class="text-sm text-blue-800 leading-relaxed">{{ marketToStrategySummary }}</div>
          </div>
          <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-4">
            <div class="text-sm font-bold text-emerald-700 mb-2">策略 → 个股</div>
            <div class="text-sm text-emerald-800 leading-relaxed">{{ strategyToCandidateSummary }}</div>
          </div>
        </div>
      </section>

      <section class="mb-6">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h2 class="text-xl font-bold">策略卡</h2>
          <div class="text-xs text-gray-500">按“市场是否支持”排序</div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
          <div v-for="row in sortedStrategies" :key="row.strategy_id" class="row-card">
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="text-lg font-bold text-gray-900">{{ row.strategy_name }}</div>
                <div class="text-xs text-gray-400 mt-1">{{ row.strategy_id }}｜{{ row.tier || '未分层' }}</div>
              </div>
              <span class="pill" :class="row.activation === 'active' ? 'ok' : row.activation === 'watch' ? 'warn' : 'bad'">{{ activationLabel(row.activation) }}</span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-4 text-sm">
              <div class="metric"><div class="text-xs text-gray-500">top20</div><div class="font-bold mt-1">{{ row.top20_count || 0 }}</div></div>
              <div class="metric"><div class="text-xs text-gray-500">命中主线</div><div class="font-bold mt-1">{{ row.market_overlap_count || 0 }}</div></div>
              <div class="metric"><div class="text-xs text-gray-500">平均AI分</div><div class="font-bold mt-1">{{ num(row.avg_ai_score) }}</div></div>
              <div class="metric"><div class="text-xs text-gray-500">累计收益</div><div class="font-bold mt-1">{{ pct(row.summary?.total_return) }}</div></div>
              <div class="metric"><div class="text-xs text-gray-500">夏普</div><div class="font-bold mt-1">{{ num(row.summary?.sharpe) }}</div></div>
            </div>
            <div class="mt-4">
              <div class="text-xs font-semibold text-gray-500 mb-2">策略主行业</div>
              <div class="flex flex-wrap gap-2">
                <span v-for="name in row.top_industries" :key="name" class="pill neutral">{{ name }}</span>
              </div>
            </div>
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
              <div class="rounded-xl bg-gray-50 border border-gray-100 p-3">
                <div class="text-xs font-semibold text-gray-500 mb-2">样本候选</div>
                <div class="space-y-2 text-sm">
                  <div v-for="stk in row.sample_candidates" :key="stk.code" class="flex items-center justify-between gap-3">
                    <span>{{ stk.name }}</span>
                    <span class="text-xs text-gray-500">{{ stk.ai_advice || '-' }} {{ stk.ai_score ? '· ' + stk.ai_score : '' }}</span>
                  </div>
                </div>
              </div>
              <div class="rounded-xl bg-gray-50 border border-gray-100 p-3">
                <div class="text-xs font-semibold text-gray-500 mb-2">操作建议</div>
                <div class="text-sm text-gray-700 leading-relaxed">{{ activationAdvice(row) }}</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="card rounded-2xl shadow p-5">
        <div class="flex items-center justify-between gap-3 mb-4">
          <div>
            <h2 class="text-lg font-bold">行业动作总表</h2>
            <p class="text-sm text-gray-500 mt-1">这里是市场和策略的最终交集判定。</p>
          </div>
          <a href="./decision-candidates.html" class="text-sm px-3 py-2 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100">去候选股中心</a>
        </div>
        <div class="overflow-auto rounded-xl border border-gray-200 max-h-[620px]">
          <table class="min-w-full text-sm">
            <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide">
              <tr>
                <th class="px-3 py-3 text-left">行业</th>
                <th class="px-3 py-3 text-left">动作</th>
                <th class="px-3 py-3 text-right">市场排名</th>
                <th class="px-3 py-3 text-right">策略排名</th>
                <th class="px-3 py-3 text-left">动作摘要</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="row in (market.industry_actions || [])" :key="row.industry" class="border-t border-gray-100">
                <td class="px-3 py-2 font-semibold">{{ row.industry }}</td>
                <td class="px-3 py-2"><span class="pill" :class="row.action === '增配' ? 'ok' : row.action === '观察' ? 'warn' : 'bad'">{{ row.action }}</span></td>
                <td class="px-3 py-2 text-right">{{ num(row.market_rank) }}</td>
                <td class="px-3 py-2 text-right">{{ num(row.strategy_rank) }}</td>
                <td class="px-3 py-2 text-xs text-gray-600">{{ row.action_summary || row.reason }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </template>
  </main>
</div>

<script>
Vue.createApp({
  data(){ return { loading:true, error:'', strategy:{}, market:{} }; },
  computed:{
    sortedStrategies(){
      const rank = { active: 0, watch: 1, deprioritized: 2 };
      return [...(this.strategy.strategies || [])].sort((a,b) => {
        const ar = rank[a.activation] ?? 9;
        const br = rank[b.activation] ?? 9;
        if (ar !== br) return ar - br;
        return (b.market_overlap_count || 0) - (a.market_overlap_count || 0);
      });
    },
    marketToStrategySummary(){
      const top = (this.market.top_market_sectors || []).slice(0,3).map(r => r.industry).filter(Boolean).join('、') || '暂无';
      return `当前市场更偏向 ${top}。策略侧应先看哪些策略真正命中了这些主线，而不是平均用力。`;
    },
    strategyToCandidateSummary(){
      return `当前候选股应优先来自激活策略，观察策略只做跟踪，降级策略不作为主攻来源。`;
    }
  },
  methods:{
    num(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':n.toFixed(0); },
    pct(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${n>=0?'+':''}${n.toFixed(2)}%`; },
    activationLabel(v){ return v === 'active' ? '激活' : v === 'watch' ? '观察' : '降级'; },
    activationAdvice(row){
      if (row.activation === 'active') return '市场支持这条策略，可以继续从它的 top20 里找执行对象。';
      if (row.activation === 'watch') return '先保留跟踪，不要把它当今天的主力策略。';
      return '当前不建议作为主攻策略，除非市场结构明显切换。';
    }
  },
  async mounted(){
    try{
      const [strategyResp, marketResp] = await Promise.all([
        fetch('data/latest/strategy_state.json?' + Date.now(), {cache:'no-store'}),
        fetch('data/latest/market_state.json?' + Date.now(), {cache:'no-store'}),
      ]);
      if(!strategyResp.ok) throw new Error('data/latest/strategy_state.json not found');
      if(!marketResp.ok) throw new Error('data/latest/market_state.json not found');
      this.strategy = await strategyResp.json();
      this.market = await marketResp.json();
    }catch(err){
      this.error = err?.message || String(err);
    }finally{
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
