<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FisherQuant">
  <defs>
    <!-- 深邃冷黑多重渐变底座 -->
    <linearGradient id="fqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    
    <!-- 奢华香槟金与高能量化 Alpha 轨迹渐变 -->
    <linearGradient id="fqGold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>

    <!-- 顶尖对冲基金激光蓝向导渐变 -->
    <linearGradient id="fqBlue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="fqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 外轮廓底盾：超椭圆导角 -->
  <rect width="64" height="64" rx="16" fill="url(#fqBg)" stroke="#1F293D" stroke-width="1.5"/>

  <!-- 背景精密量化坐标微线 -->
  <line x1="14" y1="48" x2="50" y2="48" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="14" y1="36" x2="50" y2="36" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="14" y1="24" x2="50" y2="24" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- FQ 黄金分割双翼与 Alpha 几何跃升轨迹 -->
  <!-- 左侧量化支撑翼柱 (Blue Quant Pillar) -->
  <path d="M14 48 L14 26 L23 18 L23 48 Z" fill="url(#fqBlue)" opacity="0.95"/>
  <path d="M23 18 L32 26 L23 34 Z" fill="#60A5FA" opacity="0.6"/>

  <!-- 右侧主攻金色飞翼与 Alpha 突破棱镜 (Gold Alpha Prism) -->
  <g filter="url(#fqGlow)">
    <path d="M23 48 L23 32 L40 16 L48 16 L31 48 Z" fill="url(#fqGold)"/>
    <polygon points="40,16 50,16 43,26 33,26" fill="#FFFBEB"/>
    <circle cx="48" cy="16" r="3.2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  </g>
</svg>
