<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>候选股决策中心</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg, #f4f7fb 0%, #edf2f7 100%); }
    .card { background: rgba(255,255,255,.94); backdrop-filter: blur(8px); }
    .stock-card { border:1px solid #e5e7eb; border-radius:18px; padding:18px; background:linear-gradient(180deg,#fff 0%,#f8fafc 100%); }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .main { background:#dcfce7; color:#166534; }
    .watch { background:#fef3c7; color:#92400e; }
    .avoid { background:#fee2e2; color:#991b1b; }
    .neutral { background:#e0f2fe; color:#075985; }
    .metric { background:#f8fafc; border:1px solid #e5e7eb; border-radius:14px; padding:14px; }
    .field { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; }
  </style>
</head>
<body class="text-gray-800">
<div id="app">
  <header class="text-white px-6 py-8" style="background: linear-gradient(135deg, #10213b 0%, #1d4d7a 50%, #2d7ff9 100%);">
    <div class="max-w-7xl mx-auto flex flex-wrap items-start justify-between gap-4">
      <div>
        <div class="text-xs uppercase tracking-widest text-blue-100 mb-2">Candidate Layer</div>
        <h1 class="text-3xl font-bold">候选股决策中心</h1>
        <p class="mt-2 text-sm text-blue-100">每只票都要有来源策略、市场关系、交易条件和失效条件。</p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <a href="./index.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">返回总控台</a>
        <a href="./strategy-vs-market.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">策略中心</a>
        <a href="./recommendation-review.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">复盘中心</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div v-if="loading" class="card rounded-2xl shadow p-10 text-center text-gray-400">加载候选股中心中...</div>
    <div v-else-if="error" class="card rounded-2xl shadow p-10 text-center text-red-600">{{ error }}</div>
    <template v-else>
      <section class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
        <div class="metric"><div class="text-xs text-gray-500">交易日</div><div class="text-xl font-bold mt-1">{{ data.latest_trade_date || '-' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">候选总数</div><div class="text-xl font-bold mt-1">{{ candidates.length }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">主攻</div><div class="text-xl font-bold mt-1 text-green-700">{{ mainAttack.length }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">观察</div><div class="text-xl font-bold mt-1 text-yellow-700">{{ watchList.length }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">回避</div><div class="text-xl font-bold mt-1 text-red-700">{{ avoidList.length }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">筛选结果</div><div class="text-xl font-bold mt-1">{{ filtered.length }}</div></div>
      </section>

      <section class="card rounded-2xl shadow p-5 mb-6">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div>
            <h2 class="text-lg font-bold">筛选器</h2>
            <p class="text-sm text-gray-500 mt-1">先按角色，再按策略 / 行业 / 股票搜索。</p>
          </div>
          <button @click="resetFilters" class="text-sm px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">重置筛选</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <select v-model="filters.role" class="rounded-xl border border-gray-200 px-3 py-2 text-sm">
            <option value="">全部角色</option>
            <option value="main">主攻</option>
            <option value="watch">观察</option>
            <option value="avoid">回避</option>
          </select>
          <select v-model="filters.strategy" class="rounded-xl border border-gray-200 px-3 py-2 text-sm">
            <option value="">全部策略</option>
            <option v-for="s in strategyOptions" :key="s" :value="s">{{ s }}</option>
          </select>
          <select v-model="filters.industry" class="rounded-xl border border-gray-200 px-3 py-2 text-sm">
            <option value="">全部行业</option>
            <option v-for="s in industryOptions" :key="s" :value="s">{{ s }}</option>
          </select>
          <input v-model.trim="filters.q" class="rounded-xl border border-gray-200 px-3 py-2 text-sm" placeholder="股票代码 / 名称">
        </div>
      </section>

      <section class="space-y-4">
        <div v-for="row in filtered" :key="row.strategy_id + '-' + row.normalized_code" class="stock-card">
          <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
            <div>
              <div class="text-lg font-bold text-gray-900">{{ row.name }}</div>
              <div class="text-xs text-gray-400 mt-1">{{ row.code }}｜{{ row.industry_name || '未标注行业' }}</div>
            </div>
            <div class="flex flex-wrap gap-2 text-xs">
              <span class="pill" :class="row.role_type === 'main' ? 'main' : row.role_type === 'watch' ? 'watch' : 'avoid'">{{ roleLabel(row.role_type) }}</span>
              <span class="pill neutral">{{ row.strategy_name }}</span>
              <span v-if="row.market_action" class="pill" :class="row.market_action === '增配' ? 'main' : row.market_action === '观察' ? 'watch' : 'avoid'">市场{{ row.market_action }}</span>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-6 gap-2 mb-4 text-sm">
            <div class="field"><div class="text-xs text-gray-500">量化分</div><div class="font-bold mt-1">{{ num(row.score) }}</div></div>
            <div class="field"><div class="text-xs text-gray-500">AI分</div><div class="font-bold mt-1">{{ num(row.ai_score) }}</div></div>
            <div class="field"><div class="text-xs text-gray-500">涨跌幅</div><div class="font-bold mt-1">{{ pct(row.change) }}</div></div>
            <div class="field"><div class="text-xs text-gray-500">量比</div><div class="font-bold mt-1">{{ num(row.volume_ratio) }}</div></div>
            <div class="field"><div class="text-xs text-gray-500">筹码集中</div><div class="font-bold mt-1">{{ chipPct(row.chip_conc) }}</div></div>
            <div class="field"><div class="text-xs text-gray-500">胜率</div><div class="font-bold mt-1">{{ pctPlain(row.winner_rate) }}</div></div>
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-3 gap-3">
            <div class="field xl:col-span-2">
              <div class="text-xs font-semibold text-gray-500 mb-2">一句话结论</div>
              <div class="text-sm text-gray-800 leading-relaxed">{{ row.ai_conclusion || row.ai_summary || '暂无' }}</div>
            </div>
            <div class="field">
              <div class="text-xs font-semibold text-gray-500 mb-2">交易归因</div>
              <div class="text-sm text-gray-700 leading-relaxed">{{ row.market_action_summary || '暂无市场动作说明' }}</div>
            </div>
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-2 gap-3 mt-3">
            <div class="field">
              <div class="text-xs font-semibold text-gray-500 mb-2">交易计划</div>
              <div class="text-sm text-gray-700 leading-relaxed">
                <div><b>触发条件：</b>{{ extractLine(row.ai_points, '触发条件：') || '待补' }}</div>
                <div class="mt-1"><b>失效条件：</b>{{ extractLine(row.ai_points, '失效条件：') || '待补' }}</div>
                <div class="mt-1"><b>板块定位：</b>{{ extractLine(row.ai_points, '板块定位：') || '待补' }}</div>
                <div class="mt-1"><b>筹码判断：</b>{{ extractLine(row.ai_points, '筹码判断：') || '待补' }}</div>
              </div>
            </div>
            <div class="field">
              <div class="text-xs font-semibold text-gray-500 mb-2">趋势 / 风控</div>
              <div class="text-sm text-gray-700 leading-relaxed"><b>趋势：</b>{{ row.ai_trend || '待补' }}</div>
              <div class="text-sm text-gray-700 leading-relaxed mt-1"><b>均线：</b>{{ row.ai_ma || '待补' }}</div>
              <div class="text-sm text-gray-700 leading-relaxed mt-1"><b>量能：</b>{{ row.ai_volume || '待补' }}</div>
              <div class="text-sm text-orange-700 leading-relaxed mt-2"><b>风险提示：</b>{{ row.ai_risk_warning || '待补' }}</div>
            </div>
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-3 gap-3 mt-3">
            <div class="field">
              <div class="text-xs font-semibold text-gray-500 mb-2">基本面</div>
              <div class="text-sm text-gray-700 leading-relaxed">{{ row.ai_fundamental || '待补' }}</div>
            </div>
            <div class="field">
              <div class="text-xs font-semibold text-gray-500 mb-2">催化点</div>
              <ul class="text-sm text-gray-700 list-disc pl-5 space-y-1">
                <li v-for="item in asList(row.ai_catalysts).slice(0,3)" :key="item">{{ item }}</li>
              </ul>
            </div>
            <div class="field">
              <div class="text-xs font-semibold text-gray-500 mb-2">复盘线索</div>
              <div class="text-sm text-gray-700 leading-relaxed">推荐日期 {{ row.review_recommend_date || '-' }}｜次日 {{ pct(row.review_next_day_return_pct) }}｜累计 {{ pct(row.review_cumulative_return_pct) }}</div>
              <a :href="reviewLink(row)" class="inline-block mt-3 text-xs px-3 py-1.5 rounded-lg bg-blue-100 text-blue-700 hover:bg-blue-200">去复盘中心看同股历史</a>
            </div>
          </div>
        </div>
      </section>
    </template>
  </main>
</div>

<script>
Vue.createApp({
  data(){
    return { loading:true, error:'', data:{}, filters:{ role:'', strategy:'', industry:'', q:'' } };
  },
  computed:{
    candidates(){ return this.data.candidates || []; },
    mainAttack(){ return this.candidates.filter(x => x.role_type === 'main'); },
    watchList(){ return this.candidates.filter(x => x.role_type === 'watch'); },
    avoidList(){ return this.candidates.filter(x => x.role_type === 'avoid'); },
    strategyOptions(){ return [...new Set(this.candidates.map(x => x.strategy_name).filter(Boolean))]; },
    industryOptions(){ return [...new Set(this.candidates.map(x => x.industry_name).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'zh-CN')); },
    filtered(){
      return this.candidates.filter(row => {
        const roleOk = !this.filters.role || row.role_type === this.filters.role;
        const strategyOk = !this.filters.strategy || row.strategy_name === this.filters.strategy;
        const industryOk = !this.filters.industry || row.industry_name === this.filters.industry;
        const q = (this.filters.q || '').toLowerCase();
        const qOk = !q || String(row.name || '').toLowerCase().includes(q) || String(row.code || '').toLowerCase().includes(q);
        return roleOk && strategyOk && industryOk && qOk;
      }).sort((a,b) => {
        const rank = { main:0, watch:1, avoid:2 };
        const ar = rank[a.role_type] ?? 9;
        const br = rank[b.role_type] ?? 9;
        if (ar !== br) return ar - br;
        return (Number(b.ai_score || -999) - Number(a.ai_score || -999)) || (Number(a.rank || 999) - Number(b.rank || 999));
      });
    }
  },
  methods:{
    num(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':n.toFixed(1); },
    pct(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${n>=0?'+':''}${n.toFixed(2)}%`; },
    pctPlain(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${n.toFixed(1)}%`; },
    chipPct(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v) * 100; return Number.isNaN(n)?'-':`${n.toFixed(1)}%`; },
    roleLabel(v){ return v === 'main' ? '主攻' : v === 'watch' ? '观察' : '回避'; },
    extractLine(text, label){
      if(!text) return '';
      const hit = String(text).replace(/\r/g,'').split('\n').find(line => line.includes(label));
      return hit ? hit.replace(label, '').trim() : '';
    },
    asList(v){
      if(!v) return [];
      if(Array.isArray(v)) return v.filter(Boolean);
      return String(v).replace(/\r/g,'').split(/[\n；;。]/).map(x => x.replace(/^[\s•\-]+/, '').trim()).filter(Boolean);
    },
    reviewLink(row){ return `./recommendation-review.html?code=${encodeURIComponent((row.normalized_code || row.code || '').replace(/\.(SH|SZ)$/i,''))}`; },
    resetFilters(){ this.filters = { role:'', strategy:'', industry:'', q:'' }; }
  },
  async mounted(){
    try{
      const resp = await fetch('data/latest/candidate_state.json?' + Date.now(), {cache:'no-store'});
      if(!resp.ok) throw new Error('data/latest/candidate_state.json not found');
      this.data = await resp.json();
    }catch(err){
      this.error = err?.message || String(err);
    }finally{
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
