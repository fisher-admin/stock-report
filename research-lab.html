<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复盘与研究中心</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg, #f4f7fb 0%, #edf2f7 100%); }
    .card { background: rgba(255,255,255,.94); backdrop-filter: blur(8px); }
    .metric { background:#f8fafc; border:1px solid #e5e7eb; border-radius:14px; padding:14px; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .ok { background:#dcfce7; color:#166534; }
    .warn { background:#fef3c7; color:#92400e; }
    .bad { background:#fee2e2; color:#991b1b; }
    .neutral { background:#e0f2fe; color:#075985; }
  </style>
</head>
<body class="text-gray-800">
<div id="app">
  <header class="text-white px-6 py-8" style="background: linear-gradient(135deg, #111827 0%, #1f2937 45%, #2563eb 100%);">
    <div class="max-w-7xl mx-auto flex flex-wrap items-start justify-between gap-4">
      <div>
        <div class="text-xs uppercase tracking-widest text-blue-100 mb-2">Review & Research</div>
        <h1 class="text-3xl font-bold">复盘与研究中心</h1>
        <p class="mt-2 text-sm text-blue-100">这里不做当天决策，只做后验验证、样本复盘和研究推进。</p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <a href="./index.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">返回总控台</a>
        <a href="./recommendation-review.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">打开复盘明细库</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div v-if="loading" class="card rounded-2xl shadow p-10 text-center text-gray-400">加载复盘与研究中心中...</div>
    <div v-else-if="error" class="card rounded-2xl shadow p-10 text-center text-red-600">{{ error }}</div>
    <template v-else>
      <section class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
        <div class="metric"><div class="text-xs text-gray-500">Validation</div><div class="text-xl font-bold mt-1">{{ validation.ok ? '通过' : '异常' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">研究生成时间</div><div class="text-xl font-bold mt-1">{{ research.generated_at || '-' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">复盘样本</div><div class="text-xl font-bold mt-1">{{ review.total_rows || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">最新推荐日</div><div class="text-xl font-bold mt-1">{{ review.latest_recommend_date || '-' }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">唯一股票</div><div class="text-xl font-bold mt-1">{{ review.unique_stock_count || 0 }}</div></div>
        <div class="metric"><div class="text-xs text-gray-500">AI补齐</div><div class="text-xl font-bold mt-1">{{ aiReadyText }}</div></div>
      </section>
      <section v-if="(research.warnings || []).length" class="card rounded-2xl shadow p-4 mb-6">
        <div class="flex flex-wrap gap-2 text-xs">
          <span v-for="item in research.warnings" :key="item" class="pill warn">{{ item }}</span>
        </div>
      </section>

      <section class="card rounded-2xl shadow p-5 mb-6">
        <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
          <div>
            <h2 class="text-lg font-bold">系统后验判断</h2>
            <p class="text-sm text-gray-500 mt-1">先看主流程有没有真正跑通，再看研究线该往哪里推进。</p>
          </div>
          <span class="pill" :class="validation.ok ? 'ok' : 'bad'">{{ validation.ok ? '主流程通过' : '主流程异常' }}</span>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
          <div class="rounded-xl bg-blue-50 border border-blue-100 p-4">
            <div class="text-sm font-bold text-blue-700 mb-2">运行口径</div>
            <div class="text-sm text-blue-800 leading-relaxed">交易日 {{ validation.run?.trade_date || '-' }}，Run ID {{ validation.run?.run_id || '-' }}。当前最重要的是看这轮输出是否可信，而不是单看是否生成了某个文件。</div>
          </div>
          <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-4">
            <div class="text-sm font-bold text-emerald-700 mb-2">复盘口径</div>
            <div class="text-sm text-emerald-800 leading-relaxed">复盘库当前覆盖 {{ review.total_rows || 0 }} 条推荐、{{ review.unique_stock_count || 0 }} 只股票，已足够支撑“AI观点和收益表现”的后验判断。</div>
          </div>
          <div class="rounded-xl bg-purple-50 border border-purple-100 p-4">
            <div class="text-sm font-bold text-purple-700 mb-2">研究口径</div>
            <div class="text-sm text-purple-800 leading-relaxed">研究中心要回答的不是“今天买什么”，而是“哪些方法以后该保留、扩展或下线”。</div>
          </div>
        </div>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
        <section class="card rounded-2xl shadow p-5">
          <div class="flex items-center justify-between gap-3 mb-4">
            <div>
              <h2 class="text-lg font-bold">验证与发布</h2>
              <p class="text-sm text-gray-500 mt-1">从 Validation 看整条链路是否闭环。</p>
            </div>
            <span class="pill" :class="publishReady ? 'ok' : 'warn'">{{ publishReady ? '可发布' : '待收口' }}</span>
          </div>
          <div class="space-y-3 text-sm text-gray-700">
            <div><b>最新公共交易日：</b>{{ validation.checks?.latest_common_trade_date || '-' }}</div>
            <div><b>策略交易日：</b>{{ validation.checks?.strategy_latest_trade_date || '-' }}</div>
            <div><b>策略数量：</b>{{ validation.checks?.strategy_count || 0 }}</div>
            <div><b>推荐库最新日期：</b>{{ validation.checks?.recommendation_db?.latest_recommend_date || '-' }}</div>
            <div><b>Publish 模式：</b>{{ validation.checks?.ai_publish?.publish_mode || '-' }}</div>
          </div>
        </section>

        <section class="card rounded-2xl shadow p-5">
          <div class="flex items-center justify-between gap-3 mb-4">
            <div>
              <h2 class="text-lg font-bold">复盘摘要</h2>
              <p class="text-sm text-gray-500 mt-1">直接看结果，不绕弯。</p>
            </div>
            <a href="./recommendation-review.html" class="text-sm px-3 py-2 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100">看复盘明细</a>
          </div>
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="metric"><div class="text-xs text-gray-500">次日平均收益</div><div class="text-xl font-bold mt-1">{{ pct(review.performance?.avg_next_day_return_pct) }}</div></div>
            <div class="metric"><div class="text-xs text-gray-500">累计平均收益</div><div class="text-xl font-bold mt-1">{{ pct(review.performance?.avg_cumulative_return_pct) }}</div></div>
            <div class="metric"><div class="text-xs text-gray-500">次日命中率</div><div class="text-xl font-bold mt-1">{{ pct(review.performance?.next_day_hit_rate_pct) }}</div></div>
            <div class="metric"><div class="text-xs text-gray-500">最新日条数</div><div class="text-xl font-bold mt-1">{{ review.latest_date_row_count || 0 }}</div></div>
          </div>
          <div class="rounded-xl bg-gray-50 border border-gray-100 p-4">
            <div class="text-xs font-semibold text-gray-500 mb-2">高频推荐股票</div>
            <ul class="text-sm text-gray-700 list-disc pl-5 space-y-1">
              <li v-for="row in (review.top_repeat_recommendations || []).slice(0,5)" :key="row.stock_code">{{ row.stock_name }} {{ row.stock_code }}｜{{ row.recommend_count }} 次｜累计 {{ pct(row.avg_cumulative_return_pct) }}</li>
            </ul>
          </div>
        </section>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
        <section class="card rounded-2xl shadow p-5">
          <div class="flex items-center justify-between gap-3 mb-4">
            <div>
              <h2 class="text-lg font-bold">短线研究</h2>
              <p class="text-sm text-gray-500 mt-1">看哪个因子最接近生产门槛。</p>
            </div>
            <div class="flex gap-2 flex-wrap">
              <span class="pill neutral">{{ shortNearCount }} 个临界因子</span>
              <span class="pill" :class="research.freshness?.short_term_stale ? 'warn' : 'ok'">{{ research.freshness?.short_term_stale ? '非当日' : '当日/近期' }}</span>
            </div>
          </div>
          <div class="text-sm text-gray-700 leading-relaxed">{{ shortSummary }}</div>
          <div class="mt-4 rounded-xl bg-gray-50 border border-gray-100 p-4">
            <div class="text-xs font-semibold text-gray-500 mb-2">候选因子</div>
            <ul class="text-sm text-gray-700 list-disc pl-5 space-y-1">
              <li v-for="row in shortFactors" :key="row.factor">{{ row.factor }}｜primary_score {{ num(row.primary_score) }}｜{{ row.readiness }}</li>
            </ul>
          </div>
        </section>

        <section class="card rounded-2xl shadow p-5">
          <div class="flex items-center justify-between gap-3 mb-4">
            <div>
              <h2 class="text-lg font-bold">长线研究</h2>
              <p class="text-sm text-gray-500 mt-1">先看数据就绪，再看 proxy 候选。</p>
            </div>
            <div class="flex gap-2 flex-wrap">
              <span class="pill" :class="longReady ? 'ok' : 'warn'">{{ longReady ? '基础就绪' : '待补PIT' }}</span>
              <span class="pill" :class="research.freshness?.long_term_stale ? 'warn' : 'ok'">{{ research.freshness?.long_term_stale ? '非当日' : '当日/近期' }}</span>
            </div>
          </div>
          <div class="text-sm text-gray-700 leading-relaxed">{{ longSummary }}</div>
          <div class="mt-4 rounded-xl bg-gray-50 border border-gray-100 p-4">
            <div class="text-xs font-semibold text-gray-500 mb-2">Top proxy 候选</div>
            <ul class="text-sm text-gray-700 list-disc pl-5 space-y-1">
              <li v-for="row in (research.long_term?.top_proxy_candidates || []).slice(0,5)" :key="row.ts_code">{{ row.name }}｜{{ row.industry_name }}｜balanced {{ num(row.balanced_multi_factor_score) }}</li>
            </ul>
          </div>
        </section>
      </section>

      <section class="card rounded-2xl shadow p-5">
        <h2 class="text-lg font-bold mb-3">下一步建议</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-700">
          <div class="rounded-xl bg-green-50 border border-green-100 p-4">
            <div class="font-semibold text-green-700 mb-2">复盘线</div>
            <div>继续提升“AI观点 → 收益表现”映射，让复盘不只是看涨跌，而是看结论质量。</div>
          </div>
          <div class="rounded-xl bg-yellow-50 border border-yellow-100 p-4">
            <div class="font-semibold text-yellow-700 mb-2">短线线</div>
            <div>优先围绕最接近门槛的候选因子继续积累样本，不再平均铺开研究面。</div>
          </div>
          <div class="rounded-xl bg-blue-50 border border-blue-100 p-4">
            <div class="font-semibold text-blue-700 mb-2">长线线</div>
            <div>继续补 PIT 财务与 forward return，避免长线研究一直停在 proxy skeleton。</div>
          </div>
        </div>
      </section>
    </template>
  </main>
</div>

<script>
Vue.createApp({
  data(){ return { loading:true, error:'', research:{}, review:{} }; },
  computed:{
    validation(){ return this.research.validation || { checks:{}, run:{} }; },
    publishReady(){ return !!(this.validation.publish_ready || this.validation.ok); },
    aiReadyText(){
      const counts = this.validation.checks?.ai_publish?.ai_status_counts || {};
      return `${counts.ready || 0}/${counts.total || 0}`;
    },
    shortFactors(){
      const near = this.research.short_term?.near_threshold_factors || [];
      const strongest = this.research.short_term?.strongest_factors_by_primary_score || [];
      return (near.length ? near : strongest).slice(0,5);
    },
    shortNearCount(){ return (this.research.short_term?.near_threshold_factors || []).length; },
    shortSummary(){
      const first = this.shortFactors[0];
      if(!first) return '当前暂无可继续推进的短线因子结果。';
      return `当前最值得继续看的短线因子是 ${first.factor}，重点是判断它能否跨过生产门槛，而不是继续堆更多未验证因子。`;
    },
    longReady(){ return !!this.research.long_term?.data_readiness?.financial_ready; },
    longSummary(){
      const status = this.research.long_term?.status || '暂无';
      const next = (this.research.long_term?.next_steps || []).slice(0,2).join('；') || '暂无';
      return `当前长线状态：${status}。下一步重点：${next}`;
    }
  },
  methods:{
    num(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':n.toFixed(3); },
    pct(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${n>=0?'+':''}${n.toFixed(2)}%`; }
  },
  async mounted(){
    try{
      const [researchResp, reviewResp] = await Promise.all([
        fetch('data/latest/research_state.json?' + Date.now(), {cache:'no-store'}),
        fetch('data/latest/review_state.json?' + Date.now(), {cache:'no-store'}),
      ]);
      if(!researchResp.ok) throw new Error('data/latest/research_state.json not found');
      if(!reviewResp.ok) throw new Error('data/latest/review_state.json not found');
      this.research = await researchResp.json();
      this.review = await reviewResp.json();
    }catch(err){
      this.error = err?.message || String(err);
    }finally{
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
