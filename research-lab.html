<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复盘与研究中心</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1,wght@100..700,GRAD@-50..200,opsz@20..48" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1326;
      --bg-soft: #131b2e;
      --panel: #171f33;
      --panel-hi: #222a3d;
      --line: rgba(141,144,160,.22);
      --text: #dae2fd;
      --muted: #8d90a0;
      --primary: #b4c5ff;
      --primary-strong: #2563eb;
      --secondary: #89ceff;
      --secondary-strong: #00a2e6;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #f87171;
      --shadow: 0 24px 50px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 24%),
        radial-gradient(circle at top right, rgba(0,162,230,.10), transparent 18%),
        linear-gradient(180deg, #060e20 0%, #0b1326 26%, #10182b 100%);
      color: var(--text);
    }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: blur(16px);
      background: rgba(2,6,23,.78);
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .topbar-inner {
      max-width: 1680px; margin: 0 auto; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { font-size: 22px; font-weight: 900; letter-spacing: -.03em; color: #f8fbff; }
    .top-links { display: none; align-items: center; gap: 22px; }
    .top-link { color: #7f8ba3; text-decoration: none; font-size: 13px; font-weight: 700; }
    .top-link.active, .top-link:hover { color: #dbe7ff; }
    .top-tools { display: flex; align-items: center; gap: 12px; }
    .searchbox { display: none; position: relative; width: 240px; }
    .searchbox input { width: 100%; background: rgba(19,27,46,.9); color: var(--text); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px 10px 38px; outline: none; font-size: 12px; }
    .searchbox .material-symbols-outlined { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(255,255,255,.06); background: rgba(19,27,46,.9); display: inline-flex; align-items: center; justify-content: center; color: #b7c5df; }
    .avatar { width: 38px; height: 38px; border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); background: linear-gradient(135deg, #2563eb, #00a2e6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; }
    .side-rail {
      position: fixed; left: 0; top: 0; bottom: 0; width: 252px; z-index: 35;
      background: rgba(2,6,23,.96); border-right: 1px solid rgba(255,255,255,.05);
      padding: 88px 18px 22px; box-shadow: 0 30px 60px rgba(0,0,0,.26); display: none;
    }
    .side-brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 16px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .side-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--secondary); box-shadow: 0 0 14px rgba(137,206,255,.55); }
    .side-title { font-size: 15px; font-weight: 900; color: #f8fbff; }
    .side-sub { font-size: 11px; color: #71809a; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
    .side-nav { display: grid; gap: 8px; margin-top: 18px; }
    .side-link { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; text-decoration: none; color: #8ea3bf; font-size: 13px; font-weight: 800; border: 1px solid transparent; transition: all .18s ease; }
    .side-link:hover { color: #fff; background: rgba(37,99,235,.10); border-color: rgba(96,165,250,.16); transform: translateX(2px); }
    .side-link.active { color: #fff; background: linear-gradient(135deg, rgba(37,99,235,.22), rgba(14,165,233,.10)); border-color: rgba(96,165,250,.22); }
    .side-foot { position: absolute; left: 18px; right: 18px; bottom: 22px; }
    .side-status { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(34,197,94,.10); color: #86efac; font-size: 11px; font-weight: 800; }
    .main { max-width: 1680px; margin: 0 auto; padding: 28px 24px 120px; }
    .hero { display: grid; grid-template-columns: 1.3fr .7fr; gap: 20px; margin-bottom: 22px; }
    .hero-card, .panel, .bento-card, .table-card, .note-card {
      background: linear-gradient(180deg, rgba(19,27,46,.98), rgba(23,31,51,.92));
      border: 1px solid rgba(255,255,255,.06); border-radius: 24px; box-shadow: var(--shadow);
    }
    .hero-card { padding: 26px; position: relative; overflow: hidden; }
    .hero-card::after {
      content: ''; position: absolute; right: -80px; top: -80px; width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, rgba(180,197,255,.15), transparent 70%);
    }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: #7dd3fc; font-weight: 800; }
    .hero-title { font-size: 42px; line-height: 1.05; letter-spacing: -.04em; font-weight: 900; margin: 12px 0 10px; color: #fff; }
    .hero-sub { color: #b8c6de; font-size: 14px; line-height: 1.8; max-width: 720px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .chip, .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .chip { background: rgba(255,255,255,.06); color: #d9e7ff; border: 1px solid rgba(255,255,255,.08); }
    .status-pill.good { background: rgba(34,197,94,.12); color: #86efac; }
    .status-pill.mid { background: rgba(59,130,246,.14); color: #bfdbfe; }
    .status-pill.bad { background: rgba(248,113,113,.14); color: #fecaca; }
    .hero-side { padding: 24px; display: grid; gap: 12px; }
    .score-box { background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.07); border-radius: 20px; padding: 18px; }
    .score-label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #7f93af; font-weight: 800; }
    .score-value { margin-top: 8px; font-size: 34px; font-weight: 900; color: #fff; }
    .bento { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 24px; }
    .bento-card { padding: 20px; }
    .card-head { display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px; }
    .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: #8ea3bf; font-weight: 800; }
    .big-number { font-size: 36px; font-weight: 900; color: #fff; line-height: 1; }
    .muted { color: #8ea3bf; font-size: 12px; }
    .progress { height: 10px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.08); margin-top: 12px; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, #89ceff, #00a2e6); }
    .kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 14px; }
    .kpi { padding: 12px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.05); }
    .kpi-name { color: #8ea3bf; font-size: 11px; }
    .kpi-value { margin-top: 6px; font-size: 18px; font-weight: 900; color: #fff; }
    .section-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; }
    .table-card, .note-card { overflow: hidden; }
    .table-head { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,.05); }
    .table-head h3 { margin: 0; font-size: 22px; font-weight: 900; color: #fff; }
    .table-head p { margin: 6px 0 0; color: #94a3b8; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.05); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #8ea3bf; }
    td { color: #dbe5f4; font-size: 13px; vertical-align: top; }
    .note-card { padding: 20px; }
    .note-list { display: grid; gap: 16px; }
    .note-item { padding-left: 18px; border-left: 3px solid rgba(67,70,85,.55); }
    .note-time { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: #8ea3bf; font-weight: 900; }
    .note-copy { margin-top: 6px; color: #dbe5f4; font-size: 13px; line-height: 1.8; }
    .cta-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 18px; }
    .primary-btn, .ghost-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 14px; text-decoration: none; font-size: 13px; font-weight: 900;
    }
    .primary-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
    .ghost-btn { background: rgba(255,255,255,.06); color: #e2ebff; border: 1px solid rgba(255,255,255,.08); }
    .footer { margin-top: 36px; padding: 26px 0 12px; border-top: 1px solid rgba(255,255,255,.05); color: #7f93af; font-size: 12px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .mobile-dock { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50; border-radius: 18px; background: rgba(2,6,23,.92); padding: 8px; border: 1px solid rgba(255,255,255,.06); display: none; }
    .mobile-dock-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
    .mobile-dock a { text-decoration: none; color: #a6bad3; min-height: 52px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 800; }
    .mobile-dock a.active { background: rgba(37,99,235,.20); color: #fff; }
    @media (min-width: 1280px) {
      .topbar-inner, .main, .footer { padding-left: 288px; padding-right: 28px; max-width: none; }
      .top-links { display: flex; }
      .searchbox { display: block; }
      .side-rail { display: block; }
    }
    @media (max-width: 1180px) {
      .hero, .bento, .section-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 860px) {
      .main { padding-left: 16px; padding-right: 16px; padding-bottom: 110px; }
      .topbar-inner { padding-left: 16px; padding-right: 16px; }
      .mobile-dock { display: block; }
      .hero-title { font-size: 34px; }
      .bento { grid-template-columns: 1fr; }
      .section-grid { grid-template-columns: 1fr; }
    }

    /* REDESIGN_EXECUTION_PHASE2 */
    body { padding-top: 82px !important; }
    .topbar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 60 !important;
      background: rgba(2,6,23,.92) !important;
      border-bottom: 1px solid rgba(148,163,184,.12) !important;
      box-shadow: 0 14px 36px rgba(2,6,23,.26) !important;
    }
    .topbar-inner { min-height: 82px; max-width: none !important; }
    .searchbox input {
      padding: 10px 14px !important;
      background: rgba(15,23,42,.78) !important;
      border-color: rgba(148,163,184,.14) !important;
      color: #dbe5f4 !important;
    }
    .icon-btn {
      width: auto !important;
      min-width: 0 !important;
      padding: 0 14px !important;
      font-size: 12px;
      font-weight: 800;
      color: #dbe5f4 !important;
      background: rgba(15,23,42,.78) !important;
      border-color: rgba(148,163,184,.14) !important;
    }
    .side-sub { color: #7f93af !important; }
    .side-link .material-symbols-outlined,
    .side-status .material-symbols-outlined,
    .searchbox .material-symbols-outlined,
    .mobile-dock .material-symbols-outlined { display: none !important; }
    .mobile-dock { display: none !important; }
    .hero-visual-card {
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(148,163,184,.14);
      background: rgba(15,23,42,.72);
      box-shadow: 0 18px 40px rgba(2,6,23,.22);
    }
    .hero-visual-card img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .hero-focus-title { margin-top: 12px; font-size: 12px; color: #8ea3bf; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .hero-focus-copy { margin-top: 8px; font-size: 14px; line-height: 1.8; color: #dbe5f4; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .theme-note { padding: 12px 14px; border-radius: 16px; background: rgba(15,23,42,.72); border: 1px solid rgba(148,163,184,.14); }
    .theme-note-label { color: #8ea3bf; font-size: 12px; }
    .theme-note-value { margin-top: 6px; color: #f8fbff; font-size: 15px; font-weight: 800; line-height: 1.5; }
    @media (min-width: 1280px) {
      .topbar-inner, .main, .footer { padding-left: 288px !important; padding-right: 28px !important; max-width: none !important; }
    }
    @media (max-width: 860px) {
      body { padding-top: 76px !important; }
      .topbar-inner { min-height: auto; align-items: flex-start !important; }
      .top-tools { width: 100%; justify-content: space-between; }
      .searchbox { flex: 1; }
      .searchbox input { width: 100% !important; }
    }

  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div style="display:flex; align-items:center; gap:28px;">
        <div class="brand">A股观测台</div>
        <nav class="top-links">
          <a href="./market-overview.html" class="top-link">市场</a>
          <a href="./decision-candidates.html" class="top-link">候选</a>
          <a href="./strategy-vs-market.html" class="top-link">策略</a>
          <a href="./research-lab.html" class="top-link active">研究</a>
          <a href="./recommendation-review.html" class="top-link">复盘</a>
        </nav>
      </div>
      <div class="top-tools">
        <div class="searchbox"><input placeholder="搜索页面、股票或指标" /></div>
        <button class="icon-btn">刷新数据</button>
        <button class="icon-btn">筛选视图</button>
        <div class="avatar">鱼</div>
      </div>
    </div>
  </header>

  <aside class="side-rail">
    <div class="side-brand">
      <div class="side-dot"></div>
      <div>
        <div class="side-title">A股观测台</div>
        <div class="side-sub">量化决策工作台</div>
      </div>
    </div>
    <nav class="side-nav">
      <a class="side-link" href="./index.html"><span class="material-symbols-outlined">dashboard</span><span>总控台</span></a>
      <a class="side-link" href="./market-overview.html"><span class="material-symbols-outlined">language</span><span>市场驾驶舱</span></a>
      <a class="side-link" href="./strategy-vs-market.html"><span class="material-symbols-outlined">query_stats</span><span>策略中心</span></a>
      <a class="side-link" href="./decision-candidates.html"><span class="material-symbols-outlined">playlist_add_check</span><span>候选执行</span></a>
      <a class="side-link active" href="./research-lab.html"><span class="material-symbols-outlined">analytics</span><span>复盘研究</span></a>
      <a class="side-link" href="./recommendation-review.html"><span class="material-symbols-outlined">inventory_2</span><span>复盘明细</span></a>
    </nav>
    <div class="side-foot">
      <div class="side-status"><span>系统在线</span></div>
    </div>
  </aside>

  <main class="main">
    <div v-if="loading" class="panel" style="padding:32px; text-align:center;">加载研究中心中...</div>
    <div v-else-if="error" class="panel" style="padding:32px; text-align:center; color:#fecaca;">{{ error }}</div>
    <template v-else>
      <section class="hero">
        <div class="hero-card">
          <div class="eyebrow">复盘研究中心</div>
          <h1 class="hero-title">研究总览</h1>
          <div class="hero-sub">链路 / 新鲜度 / 复用性</div>
          <div class="chip-row">
            <span class="chip">交易日 {{ validation.run?.trade_date || '-' }}</span>
            <span class="chip">运行 {{ validation.run?.run_id || '-' }}</span>
            <span class="chip">校验 {{ validation.ok ? '通过' : '异常' }}</span>
          </div>
        </div>
        <div class="hero-side">
          <div class="hero-visual-card"><img src="./assets/visuals/research-hero.svg" alt="复盘研究主题图" /></div>
          <div class="hero-focus-title">页面主题</div>
          <div class="hero-focus-copy">链路 / 新鲜度</div>
          <div class="theme-grid">
            <div class="theme-note"><div class="theme-note-label">复盘样本</div><div class="theme-note-value">{{ review.total_rows || 0 }}</div></div>
            <div class="theme-note"><div class="theme-note-label">唯一股票</div><div class="theme-note-value">{{ review.unique_stock_count || 0 }}</div></div>
            <div class="theme-note"><div class="theme-note-label">系统可信度</div><div class="theme-note-value">{{ validation.ok ? '已通过' : '待确认' }}</div></div>
            <div class="theme-note"><div class="theme-note-label">研究新鲜度</div><div class="theme-note-value">{{ research.freshness?.short_term_stale ? '需复核' : '可继续读' }}</div></div>
          </div>
        </div>
      </section>

      <section class="bento">
        <div class="bento-card">
          <div class="card-head">
            <div class="card-title">系统可信度</div>
            <span class="status-pill mid">已校验</span>
          </div>
          <div class="big-number">{{ validation.ok ? 'OK' : 'FAIL' }}</div>
          <div class="muted">主流程 {{ validation.ok ? '通过' : '异常' }}</div>
          <div class="progress"><span :style="{ width: validation.ok ? '100%' : '42%' }"></span></div>
          <div class="kpi-grid">
            <div class="kpi"><div class="kpi-name">AI 补齐</div><div class="kpi-value">{{ aiReadyText }}</div></div>
            <div class="kpi"><div class="kpi-name">发布</div><div class="kpi-value">{{ publishReady ? '已收口' : '待收口' }}</div></div>
          </div>
        </div>

        <div class="bento-card">
          <div class="card-head">
            <div>
              <div class="card-title">研究快照</div>
              <div class="muted">当前可复用项</div>
            </div>
          </div>
          <div class="ticker-list">
            <div class="ticker-row"><div><div class="ticker-name">短线研究</div><div class="ticker-sub">临界因子</div></div><div style="text-align:right;"><div class="ticker-val">{{ shortNearCount }}</div><div class="muted">{{ research.freshness?.short_term_stale ? '非当日' : '当日/近期' }}</div></div></div>
            <div class="ticker-row"><div><div class="ticker-name">长线研究</div><div class="ticker-sub">数据状态</div></div><div style="text-align:right;"><div class="ticker-val">{{ longReady ? '基础就绪' : '待补PIT' }}</div><div class="muted">{{ research.freshness?.long_term_stale ? '非当日' : '当日/近期' }}</div></div></div>
            <div class="ticker-row"><div><div class="ticker-name">复盘命中率</div><div class="ticker-sub">次日</div></div><div class="ticker-val">{{ pct(review.performance?.next_day_hit_rate_pct) }}</div></div>
          </div>
        </div>

        <div class="bento-card">
          <div class="card-head">
            <div class="card-title">风险提醒</div>
            <span class="status-pill bad" v-if="(research.warnings || []).length">{{ (research.warnings || []).length }} 条</span>
            <span class="status-pill mid" v-else>无警告</span>
          </div>
          <div class="note-list">
            <div class="note-item" v-for="item in (research.warnings || []).slice(0,3)" :key="item">
              <div class="note-time">提示</div>
              <div class="note-copy">{{ item }}</div>
            </div>
            <div class="note-item" v-if="!(research.warnings || []).length">
              <div class="note-time">状态</div>
              <div class="note-copy">当前无新警告。</div>
            </div>
          </div>
        </div>
      </section>

      <section class="section-grid">
        <section class="table-card">
          <div class="table-head">
            <h3>研究主面板</h3>
            <p>看验证、复盘与研究三条线的当前状态</p>
          </div>
          <div style="padding:18px 20px 22px; display:grid; gap:18px;">
            <div class="panel" style="padding:18px; border-radius:18px; border:1px solid rgba(255,255,255,.05); background:rgba(255,255,255,.03);">
              <div class="card-title">验证与发布</div>
              <div class="kpi-grid">
                <div class="kpi"><div class="kpi-name">最新公共交易日</div><div class="kpi-value">{{ validation.checks?.latest_common_trade_date || '-' }}</div></div>
                <div class="kpi"><div class="kpi-name">发布模式</div><div class="kpi-value">{{ validation.checks?.ai_publish?.publish_mode || '-' }}</div></div>
                <div class="kpi"><div class="kpi-name">AI 就绪</div><div class="kpi-value">{{ validation.checks?.ai_publish?.ai_status_counts?.ready || 0 }}/{{ validation.checks?.ai_publish?.ai_status_counts?.total || 0 }}</div></div>
                <div class="kpi"><div class="kpi-name">最新推荐日</div><div class="kpi-value">{{ validation.checks?.recommendation_db?.latest_recommend_date || '-' }}</div></div>
              </div>
            </div>
            <div class="panel" style="padding:18px; border-radius:18px; border:1px solid rgba(255,255,255,.05); background:rgba(255,255,255,.03);">
              <div class="card-title">短线研究</div>
              <div class="ticker-list">
                <div class="ticker-row" v-for="row in shortFactors" :key="row.factor">
                  <div>
                    <div class="ticker-name">{{ row.factor }}</div>
                    <div class="ticker-sub">{{ row.readiness || '待评估' }}</div>
                  </div>
                  <div class="ticker-val">{{ num(row.primary_score) }}</div>
                </div>
              </div>
            </div>
            <div class="panel" style="padding:18px; border-radius:18px; border:1px solid rgba(255,255,255,.05); background:rgba(255,255,255,.03);">
              <div class="card-title">长线研究</div>
              <div class="ticker-list">
                <div class="ticker-row" v-for="row in (research.long_term?.top_proxy_candidates || []).slice(0,5)" :key="row.ts_code">
                  <div>
                    <div class="ticker-name">{{ row.name }}</div>
                    <div class="ticker-sub">{{ row.industry_name || '未标行业' }}</div>
                  </div>
                  <div class="ticker-val">{{ num(row.balanced_multi_factor_score) }}</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside class="note-card">
          <div class="card-head">
            <div>
              <div class="card-title">后续动作</div>
              <div class="muted">当前结论</div>
            </div>
          </div>
          <div class="note-list">
            <div class="note-item">
              <div class="note-time">短线</div>
              <div class="note-copy">{{ shortSummary }}</div>
            </div>
            <div class="note-item">
              <div class="note-time">长线</div>
              <div class="note-copy">{{ longSummary }}</div>
            </div>
            <div class="note-item">
              <div class="note-time">复盘</div>
              <div class="note-copy">样本 {{ review.total_rows || 0 }} 条，最高频推荐 {{ (review.top_repeat_recommendations || [])[0]?.stock_name || '暂无' }}。</div>
            </div>
          </div>
          <div class="theme-grid">
            <div class="theme-note"><div class="theme-note-label">这页职责</div><div class="theme-note-value">先看链路与新鲜度。</div></div>
            <div class="theme-note"><div class="theme-note-label">当前焦点</div><div class="theme-note-value">短线 / 长线 / 复盘验证</div></div>
          </div>
        </aside>
      </section>

      <div class="footer">
        <div>A股观测台 · 复盘研究中心</div>
        <div>研究页：链路与新鲜度。</div>
      </div>
    </template>
  </main>

  <nav class="mobile-dock">
    <div class="mobile-dock-grid">
      <a href="./index.html"><span class="material-symbols-outlined">dashboard</span><span>总控台</span></a>
      <a href="./market-overview.html"><span class="material-symbols-outlined">language</span><span>市场</span></a>
      <a href="./strategy-vs-market.html"><span class="material-symbols-outlined">query_stats</span><span>策略</span></a>
      <a href="./decision-candidates.html"><span class="material-symbols-outlined">playlist_add_check</span><span>个股</span></a>
      <a href="./recommendation-review.html" class="active"><span class="material-symbols-outlined">analytics</span><span>复盘</span></a>
    </div>
  </nav>
</div>

<script>
Vue.createApp({
  data(){ return { loading:true, error:'', research:{}, review:{} }; },
  computed:{
    validation(){ return this.research.validation || { checks:{}, run:{} }; },
    publishReady(){ return !!(this.validation.publish_ready || this.validation.ok); },
    aiReadyText(){ const counts = this.validation.checks?.ai_publish?.ai_status_counts || {}; return `${counts.ready || 0}/${counts.total || 0}`; },
    shortFactors(){ const near = this.research.short_term?.near_threshold_factors || []; const strongest = this.research.short_term?.strongest_factors_by_primary_score || []; return (near.length ? near : strongest).slice(0,5); },
    shortNearCount(){ return (this.research.short_term?.near_threshold_factors || []).length; },
    shortSummary(){ const first = this.shortFactors[0]; if(!first) return '当前暂无可继续推进的短线因子结果。'; return `当前最值得继续看的短线因子是 ${first.factor}。`; },
    longReady(){ return !!this.research.long_term?.data_readiness?.financial_ready; },
    longSummary(){ const status = this.research.long_term?.status || '暂无'; const next = (this.research.long_term?.next_steps || []).slice(0,2).join('；') || '暂无'; return `当前长线状态：${status}。下一步：${next}`; }
  },
  methods:{
    num(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':n.toFixed(3); },
    pct(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${n>=0?'+':''}${n.toFixed(2)}%`; }
  },
  async mounted(){
    try{
      const [researchResp, reviewResp] = await Promise.all([
        fetch('data/latest/research_state.json?' + Date.now(), {cache:'no-store'}),
        fetch('data/latest/review_state.json?' + Date.now(), {cache:'no-store'}),
      ]);
      if(!researchResp.ok) throw new Error('data/latest/research_state.json not found');
      if(!reviewResp.ok) throw new Error('data/latest/review_state.json not found');
      this.research = await researchResp.json();
      this.review = await reviewResp.json();
    }catch(err){
      this.error = err?.message || String(err);
    }finally{
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
