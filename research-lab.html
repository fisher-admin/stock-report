<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复盘研究中心</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <link href="./assets/styles/observatory-governance.css" rel="stylesheet">
  <style>
    :root {
      --bg-1: #081425;
      --bg-2: #0f2742;
      --bg-3: #173c67;
      --card: rgba(255,255,255,0.92);
      --line: rgba(148,163,184,.22);
      --text-1: #0f172a;
      --text-2: #475569;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warn: #ca8a04;
      --warn-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --ai: #7c3aed;
      --ai-soft: #ede9fe;
      --shadow: 0 18px 48px rgba(15, 23, 42, .14);
      --shadow-soft: 0 10px 28px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text-1);
      background:
        radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(124,58,237,.14), transparent 24%),
        linear-gradient(180deg, #eff5fc 0%, #e9eef6 46%, #e5ebf4 100%);
      min-height: 100vh;
    }
    .shell-wrap { max-width: 1380px; margin: 0 auto; padding: 0 18px 32px; }
    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
      border-bottom: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,.05);
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: auto -80px -120px auto;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96,165,250,.22) 0%, transparent 72%);
      pointer-events: none;
    }
    .hero-inner { max-width: 1380px; margin: 0 auto; padding: 24px 18px 26px; }
    .brand-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: #dbeafe;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    }
    .status-inline { display: flex; flex-wrap: wrap; gap: 8px; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,.08); color: #eff6ff; border: 1px solid rgba(255,255,255,.14);
    }
    .hero-grid { display: grid; grid-template-columns: 1.35fr .85fr; gap: 16px; }
    .hero-main, .hero-side {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .hero-main { padding: 24px; }
    .hero-side { padding: 18px; }
    .hero-title { font-size: 34px; line-height: 1.15; font-weight: 900; margin: 0; }
    .hero-sub { margin: 10px 0 0; color: #dbeafe; font-size: 15px; line-height: 1.75; max-width: 760px; }
    .hero-answer {
      margin-top: 16px; padding: 14px 16px; border-radius: 18px;
      background: rgba(15,23,42,.22); border: 1px solid rgba(255,255,255,.10);
    }
    .hero-answer-label { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #bfdbfe; text-transform: uppercase; }
    .hero-answer-text { margin-top: 8px; font-size: 15px; line-height: 1.8; color: #f8fafc; }
    .flow-rail { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .flow-step {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 14px; border-radius: 14px; font-size: 13px; font-weight: 700;
      color: #dbeafe; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    }
    .flow-step.active { color:#fff; background: rgba(59,130,246,.24); border-color: rgba(147,197,253,.38); }
    .hero-side-title { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #bfdbfe; text-transform: uppercase; }
    .hero-side-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 12px; }
    .side-metric { padding: 12px; border-radius: 16px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
    .side-metric-label { color: #cbd5e1; font-size: 12px; }
    .side-metric-value { margin-top: 5px; font-size: 24px; font-weight: 900; color: #fff; }
    .sticky-nav {
      position: sticky; top: 0; z-index: 30; margin-top: -1px;
      backdrop-filter: blur(14px);
      background: rgba(248,250,252,.78);
      border-bottom: 1px solid rgba(148,163,184,.16);
    }
    .sticky-nav-inner { max-width: 1380px; margin: 0 auto; padding: 10px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 10px; }
    .nav-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 14px; text-decoration: none;
      color: #1e293b; font-size: 13px; font-weight: 700;
      border: 1px solid transparent; transition: all .18s ease;
    }
    .nav-link:hover { background: rgba(37,99,235,.08); color: var(--primary); border-color: rgba(37,99,235,.12); }
    .nav-link.active { background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%); color: #fff; box-shadow: 0 8px 20px rgba(37,99,235,.24); }
    .section-jump {
      display:flex; flex-wrap:wrap; gap:10px; align-items:center;
      max-width:1380px; margin:0 auto; padding:12px 18px 0;
    }
    .jump-link {
      display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px;
      background:rgba(255,255,255,.82); border:1px solid rgba(148,163,184,.16);
      color:#334155; text-decoration:none; font-size:12px; font-weight:800;
      box-shadow:0 6px 18px rgba(15,23,42,.05);
    }
    .jump-link:hover { color:var(--primary); border-color:rgba(37,99,235,.2); }
    .mobile-bottom-nav {
      display:none; position:fixed; left:12px; right:12px; bottom:12px; z-index:40;
      padding:8px; border-radius:20px; background:rgba(15,23,42,.88); backdrop-filter:blur(14px);
      box-shadow:0 18px 42px rgba(15,23,42,.26); border:1px solid rgba(255,255,255,.08);
    }
    .mobile-bottom-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .mobile-bottom-link {
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      min-height:54px; border-radius:14px; text-decoration:none; color:#cbd5e1; font-size:11px; font-weight:800;
    }
    .mobile-bottom-link.active { background:rgba(37,99,235,.24); color:#fff; }
    .mobile-bottom-icon { font-size:14px; line-height:1; }
    .section-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.56);
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .section-head {
      display: flex; flex-wrap: wrap; align-items: start; justify-content: space-between; gap: 12px;
      padding: 22px 22px 0;
    }
    .section-kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: #64748b; }
    .section-title { margin: 6px 0 0; font-size: 24px; font-weight: 900; }
    .section-sub { margin: 8px 0 0; color: var(--text-2); font-size: 14px; line-height: 1.75; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; padding: 18px 22px 22px; }
    .metric-card {
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.94));
      border: 1px solid var(--line);
      border-radius: 18px; padding: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.74);
    }
    .metric-label { color: var(--text-2); font-size: 12px; }
    .metric-value { margin-top: 8px; font-size: 28px; font-weight: 900; line-height: 1; }
    .metric-note { margin-top: 8px; font-size: 12px; color: #64748b; }
    .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; padding: 0 22px 22px; }
    .summary-card { border-radius: 20px; padding: 16px; border: 1px solid transparent; }
    .summary-card.blue { background: linear-gradient(180deg, #eef4ff, #f8fbff); border-color: #bfdbfe; }
    .summary-card.green { background: linear-gradient(180deg, #edfff3, #f7fffa); border-color: #bbf7d0; }
    .summary-card.purple { background: linear-gradient(180deg, #f5f1ff, #fbf9ff); border-color: #ddd6fe; }
    .summary-card.amber { background: linear-gradient(180deg, #fff8e9, #fffdf4); border-color: #fde68a; }
    .summary-card.dark { background: linear-gradient(135deg, #0f172a, #1e3a8a); color:#fff; border-color: rgba(191,219,254,.18); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; font-weight: 800; padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(148,163,184,.16); white-space: nowrap; }
    td { padding: 12px 16px; border-bottom: 1px solid rgba(148,163,184,.10); font-size: 13px; color: #334155; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .progress-stack { display:grid; gap:12px; margin-top:14px; }
    .progress-row { padding:12px 14px; border-radius:16px; background:#fff; border:1px solid rgba(148,163,184,.14); }
    .progress-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .progress-label { font-size:13px; font-weight:800; color:#0f172a; }
    .progress-value { font-size:12px; color:#475569; }
    .progress-bar { margin-top:10px; height:10px; border-radius:999px; background:#e2e8f0; overflow:hidden; }
    .progress-fill { height:100%; border-radius:999px; background: linear-gradient(90deg, #2563eb, #0ea5e9); }
    .route-list { display:grid; gap:10px; margin-top:14px; }
    .route-step { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:14px; background:#fff; border:1px solid rgba(148,163,184,.14); }
    .route-index { width: 26px; height:26px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; background:#dbeafe; color:#1d4ed8; flex: 0 0 auto; }
    .route-main { font-size:13px; font-weight:800; color:#0f172a; }
    .route-sub { margin-top:3px; font-size:12px; color:#64748b; line-height:1.6; }
    .kpi-badge { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; }
    .kpi-badge.green { background:#dcfce7; color:#16a34a; }
    .kpi-badge.blue { background:#dbeafe; color:#1d4ed8; }
    .kpi-badge.amber { background:#fef3c7; color:#ca8a04; }
    .kpi-badge.red { background:#fee2e2; color:#dc2626; }
    .mini-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:6px; background:rgba(255,255,255,.7); border:1px solid rgba(148,163,184,.14); font-size:11px; font-weight:700; color:#475569; white-space:nowrap; }
    .aside-panel { border-radius: 20px; padding: 18px; border: 1px solid rgba(148,163,184,.16); background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.94)); box-shadow: var(--shadow-soft); }
    .aside-title { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #64748b; }
    .aside-value { margin-top: 10px; font-size: 32px; font-weight: 900; color: #0f172a; line-height: 1; }
    .aside-sub { margin-top: 8px; font-size: 12px; color: #64748b; }
    .filter-row { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; padding: 18px 22px; }
    .filter-input { background: #fff; color: #0f172a; border: 1px solid rgba(148,163,184,.22); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; }
    .filter-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.10); }
    .filter-select { background: #fff; color: #0f172a; border: 1px solid rgba(148,163,184,.22); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; }
    .filter-select:focus { border-color: #2563eb; }
    .pill { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; }
    .pill.green { background:#dcfce7; color:#16a34a; }
    .pill.blue { background:#dbeafe; color:#1d4ed8; }
    .pill.amber { background:#fef3c7; color:#ca8a04; }
    .pill.red { background:#fee2e2; color:#dc2626; }
    .pill.gray { background:#f1f5f9; color:#64748b; }
    .cta-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding: 0 22px 22px; }
    .primary-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:14px; background: linear-gradient(135deg, #1d4ed8, #2563eb); color:#fff; font-size:13px; font-weight:800; border:none; cursor:pointer; box-shadow: 0 8px 20px rgba(37,99,235,.24); text-decoration:none; }
    .ghost-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:14px; background:#fff; color:#334155; font-size:13px; font-weight:800; border:1px solid rgba(148,163,184,.22); cursor:pointer; text-decoration:none; }
    .loading-state { background:#fff; border:1px solid rgba(148,163,184,.16); border-radius:24px; padding:48px 32px; text-align:center; box-shadow:var(--shadow-soft); }
    .loading-icon { font-size:48px; line-height:1; }
    .loading-title { margin-top:16px; font-size:20px; font-weight:900; color:#0f172a; }
    .loading-sub { margin-top:8px; font-size:14px; color:#64748b; }
    .error-state { background:#fff; border:1px solid #fecaca; border-radius:24px; padding:48px 32px; text-align:center; box-shadow:var(--shadow-soft); }
    .error-icon { font-size:48px; line-height:1; }
    .error-title { margin-top:16px; font-size:20px; font-weight:900; color:#dc2626; }
    .error-sub { margin-top:8px; font-size:14px; color:#64748b; max-width:480px; margin-left:auto; margin-right:auto; word-break:break-all; }

    @media (max-width: 1200px) {
      .hero-grid, .summary-grid, .aside-grid, .cta-row { grid-template-columns: 1fr 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 860px) {
      .hero-grid, .summary-grid, .aside-grid, .cta-row { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .filter-row { grid-template-columns: 1fr 1fr; }
      .hero-title { font-size: 28px; }
      .mobile-bottom-nav { display: block; }
      .shell-wrap { padding-bottom: 96px; }
    }
    @media (max-width: 640px) {
      .hero-inner, .sticky-nav-inner { padding-left: 14px; padding-right: 14px; }
      .section-head, .metrics-grid, .filter-row { padding-left: 16px; padding-right: 16px; }
      .hero-sub { font-size: 14px; line-height: 1.65; }
      .flow-rail { flex-wrap: nowrap; overflow: auto; padding-bottom: 4px; }
      .section-jump { display: none; }
      .hero-title { font-size: 24px; }
      .metrics-grid { grid-template-columns: 1fr 1fr; }
      .filter-row { grid-template-columns: 1fr; }
    }

    /* VISUAL_GOVERNANCE_PHASE7 */
    body, input, button, select, textarea, option {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", Arial, sans-serif !important;
    }
    img, svg, canvas, video { max-width: 100%; height: auto; display: block; }
    .hero-title, .hero-sub, .summary-text, .mini-sub, .detail-text, .route-main, .route-sub, td, th { overflow-wrap: anywhere; word-break: break-word; }
    .section-card, .metric-card, .summary-card, .aside-panel, .table-wrap { overflow: hidden; }
    @media (max-width: 860px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .hero-side { display: none; }
    }
    @media (max-width: 640px) {
      .hero-title { font-size: 24px !important; line-height: 1.2 !important; }
      .metrics-grid { grid-template-columns: 1fr 1fr !important; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Sticky Navigation -->
  <div class="sticky-nav">
    <div class="sticky-nav-inner">
      <nav class="nav-links">
        <a href="./index.html" class="nav-link">总控台</a>
        <a href="./market-overview.html" class="nav-link">市场驾驶舱</a>
        <a href="./strategy-vs-market.html" class="nav-link">策略中心</a>
        <a href="./decision-candidates.html" class="nav-link">候选执行</a>
        <a href="./research-lab.html" class="nav-link active">复盘研究</a>
        <a href="./recommendation-review.html" class="nav-link">复盘明细</a>
      </nav>
    </div>
  </div>

  <!-- Section Jump -->
  <div class="section-jump">
    <a href="./index.html" class="jump-link">&#8592; 总控台</a>
    <a href="./market-overview.html" class="jump-link">市场</a>
    <a href="./strategy-vs-market.html" class="jump-link">策略</a>
    <a href="./decision-candidates.html" class="jump-link">候选</a>
    <a href="./recommendation-review.html" class="jump-link">复盘明细 &#8594;</a>
  </div>

  <div class="shell-wrap">

    <!-- Loading State -->
    <div v-if="loading" class="loading-state" style="margin-top:28px;">
      <div class="loading-icon">&#8987;</div>
      <div class="loading-title">加载研究中心中…</div>
      <div class="loading-sub">正在读取研究状态与复盘数据</div>
    </div>

    <!-- Error State -->
    <div v-else-if="error" class="error-state" style="margin-top:28px;">
      <div class="error-icon">&#9888;</div>
      <div class="error-title">数据加载失败</div>
      <div class="error-sub">{{ error }}</div>
    </div>

    <!-- Main Content -->
    <template v-else>

      <!-- Hero -->
      <section class="hero" style="border-radius:24px 24px 0 0; margin-top:18px;">
        <div class="hero-inner">
          <div style="margin-bottom:16px;">
            <span class="brand-kicker">&#9670; 复盘研究中心</span>
          </div>
          <div class="hero-grid">
            <div class="hero-main">
              <h1 class="hero-title">研究总览</h1>
              <div class="status-inline" style="margin-top:12px;">
                <span class="status-chip">交易日 {{ validation.run?.trade_date || '—' }}</span>
                <span class="status-chip">校验 {{ validation.ok ? '通过' : '异常' }}</span>
              </div>
              <div class="hero-answer" style="margin-top:12px;">
                <div class="hero-answer-label">研究结论</div>
                <div class="hero-answer-text">{{ researchConclusion }}</div>
              </div>
            </div>
            <div class="hero-side">
              <div class="hero-side-title">研究快照</div>
              <div class="theme-grid">
                <div class="theme-note"><div class="theme-note-label">复盘样本</div><div class="theme-note-value">{{ review.total_rows || 0 }}</div></div>
                <div class="theme-note"><div class="theme-note-label">唯一股票</div><div class="theme-note-value">{{ review.unique_stock_count || 0 }}</div></div>
                <div class="theme-note"><div class="theme-note-label">系统可信度</div><div class="theme-note-value">{{ validation.ok ? 'OK' : 'FAIL' }}</div></div>
                <div class="theme-note"><div class="theme-note-label">研究新鲜度</div><div class="theme-note-value">{{ research.freshness?.short_term_stale ? '需复核' : '可继续' }}</div></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- KPI Metrics -->
      <section class="section-card" style="margin-top:18px;">
        <div class="section-head">
          <div>
            <div class="section-kicker">研究指标</div>
            <div class="section-title">可信度与快照</div>
          </div>
        </div>
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-label">系统可信度</div>
            <div class="metric-value" :style="validation.ok ? 'color:#16a34a' : 'color:#dc2626'">{{ validation.ok ? 'OK' : 'FAIL' }}</div>
            <div class="metric-note">主流程 {{ validation.ok ? '通过' : '异常' }}</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">AI 就绪</div>
            <div class="metric-value">{{ aiReadyText }}</div>
            <div class="metric-note">发布 AI 补齐</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">短线研究</div>
            <div class="metric-value">{{ shortNearCount }}</div>
            <div class="metric-note">{{ research.freshness?.short_term_stale ? '非当日' : '当日/近期' }}</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">长线研究</div>
            <div class="metric-value" :style="longReady ? 'color:#16a34a' : 'color:#ca8a04'">{{ longReady ? '基础就绪' : '待补PIT' }}</div>
            <div class="metric-note">{{ research.freshness?.long_term_stale ? '非当日' : '当日/近期' }}</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">复盘命中率</div>
            <div class="metric-value">{{ pct(review.performance?.next_day_hit_rate_pct) }}</div>
            <div class="metric-note">次日</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">最新公共交易日</div>
            <div class="metric-value" style="font-size:20px;">{{ validation.checks?.latest_common_trade_date || '—' }}</div>
            <div class="metric-note">数据链路</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">最新推荐日</div>
            <div class="metric-value" style="font-size:20px;">{{ validation.checks?.recommendation_db?.latest_recommend_date || '—' }}</div>
            <div class="metric-note">推荐数据库</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">发布模式</div>
            <div class="metric-value" style="font-size:18px;">{{ validation.checks?.ai_publish?.publish_mode || '—' }}</div>
            <div class="metric-note">AI 发布</div>
          </div>
        </div>
      </section>

      <!-- Three Column: Validation / Short-term / Long-term -->
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px; margin-top:18px;">
        <section class="section-card">
          <div class="section-head">
            <div>
              <div class="section-kicker">验证与发布</div>
              <div class="section-title">发布链路</div>
            </div>
            <span class="kpi-badge" :class="publishReady ? 'green' : 'amber'">{{ publishReady ? '已收口' : '待收口' }}</span>
          </div>
          <div class="progress-stack" style="padding:0 22px 22px;">
            <div class="progress-row">
              <div class="progress-top"><span class="progress-label">AI 就绪</span><span class="progress-value">{{ aiReadyText }}</span></div>
              <div class="progress-bar"><div class="progress-fill" :style="{ width: aiReadyPct + '%' }"></div></div>
            </div>
            <div class="progress-row">
              <div class="progress-top"><span class="progress-label">推荐数据库</span><span class="progress-value">{{ validation.checks?.recommendation_db?.latest_recommend_date || '—' }}</span></div>
              <div class="progress-bar"><div class="progress-fill" :style="{ width: validation.ok ? '100%' : '40%' }"></div></div>
            </div>
            <div class="progress-row">
              <div class="progress-top"><span class="progress-label">公共交易日</span><span class="progress-value">{{ validation.checks?.latest_common_trade_date || '—' }}</span></div>
              <div class="progress-bar"><div class="progress-fill" :style="{ width: validation.ok ? '100%' : '30%' }"></div></div>
            </div>
          </div>
        </section>

        <section class="section-card">
          <div class="section-head">
            <div>
              <div class="section-kicker">短线研究</div>
              <div class="section-title">临界因子</div>
            </div>
            <span class="kpi-badge blue">{{ shortNearCount }} 项</span>
          </div>
          <div style="padding:0 22px 22px;">
            <div v-for="row in shortFactors" :key="row.factor" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(148,163,184,.10);">
              <div>
                <div style="font-size:13px; font-weight:800; color:#0f172a;">{{ row.factor }}</div>
                <div style="font-size:11px; color:#64748b; margin-top:2px;">{{ row.readiness || '待评估' }}</div>
              </div>
              <div style="font-size:15px; font-weight:900; color:#0f172a;">{{ num(row.primary_score) }}</div>
            </div>
            <div v-if="!shortFactors.length" style="padding:24px 0; text-align:center; color:#94a3b8; font-size:13px;">暂无短线因子数据</div>
          </div>
        </section>

        <section class="section-card">
          <div class="section-head">
            <div>
              <div class="section-kicker">长线研究</div>
              <div class="section-title">Proxy 候选</div>
            </div>
            <span class="kpi-badge" :class="longReady ? 'green' : 'amber'">{{ longReady ? '数据就绪' : '待补PIT' }}</span>
          </div>
          <div style="padding:0 22px 22px;">
            <div v-for="row in (research.long_term?.top_proxy_candidates || []).slice(0,5)" :key="row.ts_code" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(148,163,184,.10);">
              <div>
                <div style="font-size:13px; font-weight:800; color:#0f172a;">{{ row.name }}</div>
                <div style="font-size:11px; color:#64748b; margin-top:2px;">{{ row.industry_name || '未标行业' }}</div>
              </div>
              <div style="font-size:15px; font-weight:900; color:#0f172a;">{{ num(row.balanced_multi_factor_score) }}</div>
            </div>
            <div v-if="!(research.long_term?.top_proxy_candidates || []).length" style="padding:24px 0; text-align:center; color:#94a3b8; font-size:13px;">暂无长线候选</div>
          </div>
        </section>
      </div>

      <!-- Summary Row + Warnings -->
      <div style="display:grid; grid-template-columns: 2fr 1fr; gap:14px; margin-top:18px;">
        <section class="section-card">
          <div class="section-head">
            <div>
              <div class="section-kicker">后续动作</div>
              <div class="section-title">当前结论</div>
            </div>
          </div>
          <div class="summary-grid" style="padding-bottom:22px;">
            <div class="summary-card blue">
              <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#64748b;">短线</div>
              <div style="margin-top:10px; font-size:15px; font-weight:800; color:#0f172a;">{{ shortSummary }}</div>
              <div style="margin-top:8px; font-size:12px; color:#64748b;">{{ research.freshness?.short_term_stale ? '需复核' : '当日/近期，可继续' }}</div>
            </div>
            <div class="summary-card purple">
              <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#64748b;">长线</div>
              <div style="margin-top:10px; font-size:15px; font-weight:800; color:#0f172a;">{{ longSummary }}</div>
              <div style="margin-top:8px; font-size:12px; color:#64748b;">{{ longReady ? '数据基础就绪' : '待补 PIT 数据' }}</div>
            </div>
            <div class="summary-card green">
              <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#64748b;">复盘</div>
              <div style="margin-top:10px; font-size:15px; font-weight:800; color:#0f172a;">样本 {{ review.total_rows || 0 }} 条</div>
              <div style="margin-top:8px; font-size:12px; color:#64748b;">最高频 {{ (review.top_repeat_recommendations || [])[0]?.stock_name || '暂无' }}</div>
            </div>
            <div class="summary-card" style="background:linear-gradient(180deg,#f1f5f9,#f8fafc); border-color:rgba(148,163,184,.18);">
              <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#64748b;">研究新鲜度</div>
              <div style="margin-top:10px; font-size:15px; font-weight:800; color:#0f172a;">{{ research.freshness?.short_term_stale ? '需复核' : '可继续读' }}</div>
              <div style="margin-top:8px; font-size:12px; color:#64748b;">{{ research.freshness?.long_term_stale ? '长线非当日' : '长线当日/近期' }}</div>
            </div>
          </div>
        </section>

        <section class="section-card">
          <div class="section-head">
            <div>
              <div class="section-kicker">风险与警告</div>
              <div class="section-title">提醒事项</div>
            </div>
            <span class="kpi-badge" :class="(research.warnings || []).length ? 'red' : 'green'">
              {{ (research.warnings || []).length ? (research.warnings || []).length + ' 条' : '无' }}
            </span>
          </div>
          <div style="padding:0 22px 22px;">
            <div v-for="(item, i) in (research.warnings || []).slice(0,4)" :key="i" style="padding:10px 12px; border-radius:12px; background:#fff; border:1px solid rgba(248,113,113,.22); margin-bottom:8px;">
              <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#dc2626; margin-bottom:4px;">&#9888; 警告</div>
              <div style="font-size:13px; color:#334155; line-height:1.6;">{{ item }}</div>
            </div>
            <div v-if="!(research.warnings || []).length" style="padding:24px 0; text-align:center;">
              <div style="font-size:32px;">&#10004;</div>
              <div style="margin-top:8px; font-size:13px; color:#64748b;">当前无新警告</div>
            </div>
          </div>
        </section>
      </div>

    </template>
  </div><!-- .shell-wrap -->

  <!-- Mobile Bottom Nav -->
  <div class="mobile-bottom-nav">
    <div class="mobile-bottom-grid">
      <a href="./index.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#9632;</span>总控</a>
      <a href="./market-overview.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#9673;</span>市场</a>
      <a href="./strategy-vs-market.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#9651;</span>策略</a>
      <a href="./decision-candidates.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#10003;</span>候选</a>
      <a href="./recommendation-review.html" class="mobile-bottom-link"><span class="mobile-bottom-icon">&#9646;</span>复盘</a>
    </div>
  </div>

</div><!-- #app -->

<script>
Vue.createApp({
  data(){ return { loading:true, error:'', research:{}, review:{} }; },
  computed:{
    validation(){ return this.research.validation || { checks:{}, run:{} }; },
    publishReady(){ return !!(this.validation.publish_ready || this.validation.ok); },
    aiReadyText(){ const counts = this.validation.checks?.ai_publish?.ai_status_counts || {}; return `${counts.ready || 0}/${counts.total || 0}`; },
    aiReadyPct(){ const counts = this.validation.checks?.ai_publish?.ai_status_counts || {}; const t = counts.total || 0; return t ? Math.round((counts.ready || 0) / t * 100) : 0; },
    shortFactors(){ const near = this.research.short_term?.near_threshold_factors || []; const strongest = this.research.short_term?.strongest_factors_by_primary_score || []; return (near.length ? near : strongest).slice(0,5); },
    shortNearCount(){ return (this.research.short_term?.near_threshold_factors || []).length; },
    shortSummary(){ const first = this.shortFactors[0]; if(!first) return '暂无短线结果'; return `${first.factor}（${first.readiness || '待评估'}）`; },
    longReady(){ return !!this.research.long_term?.data_readiness?.financial_ready; },
    longSummary(){ const status = this.research.long_term?.status || '暂无'; const next = (this.research.long_term?.next_steps || [])[0] || '暂无'; return `${status} › ${next}`; },
    researchConclusion(){
      if(this.error) return '数据加载异常，请检查网络或刷新页面。';
      if(this.validation.ok) return `系统可信度 OK。短线${this.shortNearCount}项临界，长线${this.longReady ? '数据基础就绪' : '待补PIT'}，复盘命中率 ${this.pct(this.review.performance?.next_day_hit_rate_pct)}。`;
      return `系统可信度异常。当前：${this.validation.run?.trade_date || '—'}，请检查数据链路。`;
    },
    researchSteps(){
      return [
        { title: '验证链路', sub: this.validation.ok ? '已通过' : '异常' },
        { title: '短线研究', sub: this.shortNearCount + ' 项临界因子' },
        { title: '长线研究', sub: this.longReady ? '数据基础就绪' : '待补 PIT' },
        { title: '复盘验证', sub: '命中率 ' + this.pct(this.review.performance?.next_day_hit_rate_pct) }
      ];
    }
  },
  methods:{
    num(v){ if(v===null||v===undefined||v==='') return '—'; const n=Number(v); return Number.isNaN(n)?'—':n.toFixed(3); },
    pct(v){ if(v===null||v===undefined||v==='') return '—'; const n=Number(v); return Number.isNaN(n)?'—':`${n>=0?'+':''}${n.toFixed(2)}%`; }
  },
  async mounted(){
    try{
      const [researchResp, reviewResp] = await Promise.all([
        fetch('data/latest/research_state.json?' + Date.now(), {cache:'no-store'}),
        fetch('data/latest/review_state.json?' + Date.now(), {cache:'no-store'}),
      ]);
      if(!researchResp.ok) throw new Error('data/latest/research_state.json 未找到（HTTP ' + researchResp.status + '）');
      if(!reviewResp.ok) throw new Error('data/latest/review_state.json 未找到（HTTP ' + reviewResp.status + '）');
      this.research = await researchResp.json();
      this.review = await reviewResp.json();
    }catch(err){
      this.error = (err?.message || String(err)) + ' — 请确认研究流程已运行并发布数据。';
    }finally{
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
