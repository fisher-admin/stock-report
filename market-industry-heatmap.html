<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全市场行业热力曲线</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg, #f4f7fb 0%, #edf2f7 100%); }
    .card { background: rgba(255,255,255,0.94); backdrop-filter: blur(8px); }
    .heat-cell { min-width:72px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700; }
    .grid-wrap { overflow:auto; }
    .sticky-col { position: sticky; left: 0; background:#fff; z-index:2; }
    .legend-line { height:3px; border-radius:999px; }
  </style>
</head>
<body class="text-gray-800">
<div id="app">
  <header class="text-white px-6 py-8" style="background: linear-gradient(135deg, #182848 0%, #274060 48%, #3b82f6 100%);">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <div class="text-xs uppercase tracking-widest text-blue-100 mb-2">Market Industry Heatmap</div>
          <h1 class="text-3xl font-bold">全市场行业热力曲线</h1>
          <p class="mt-2 text-sm text-blue-100">基于全市场股票日线、行业映射、涨跌扩散与成交占比聚合得到的市场级行业热度。</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <a href="./index.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">返回首页</a>
          <a href="./industry-heatmap.html" class="px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-sm">策略行业热力</a>
          <a href="./data/recommendation_analytics/market_industry_heatmap.json" class="px-4 py-2 rounded-lg bg-yellow-400 text-gray-900 text-sm font-semibold">下载 JSON</a>
        </div>
      </div>
      <div class="mt-4 flex gap-2 flex-wrap text-xs">
        <span class="bg-white/15 px-3 py-1 rounded">最新交易日 {{ data.latest_trade_date || '-' }}</span>
        <span class="bg-white/15 px-3 py-1 rounded">日期覆盖 {{ data.date_range?.date_count || 0 }} 个交易日</span>
        <span class="bg-white/15 px-3 py-1 rounded">行业数 {{ sectorOptions.length }}</span>
        <span v-if="selectedSector" class="bg-yellow-300 text-gray-900 px-3 py-1 rounded">当前选中：{{ selectedSector }}</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div v-if="loading" class="card rounded-2xl shadow p-10 text-center text-gray-400">加载全市场行业数据中...</div>
    <div v-else-if="error" class="card rounded-2xl shadow p-10 text-center text-red-600">{{ error }}</div>
    <template v-else>
      <section class="card rounded-2xl shadow p-5 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <select v-model="metric" class="rounded-xl border border-gray-200 px-3 py-2 text-sm">
            <option value="market_heat_ema_5">市场热度EMA(5)</option>
            <option value="market_heat_base">市场基础热度</option>
            <option value="avg_pct_chg">行业平均涨跌幅</option>
            <option value="amount_share">成交额占比</option>
          </select>
          <select v-model="trendMetric" class="rounded-xl border border-gray-200 px-3 py-2 text-sm">
            <option value="market_heat_ema_5">趋势图：市场热度EMA(5)</option>
            <option value="market_heat_base">趋势图：市场基础热度</option>
            <option value="avg_pct_chg">趋势图：行业平均涨跌幅</option>
            <option value="amount_share">趋势图：成交额占比</option>
          </select>
          <select v-model.number="topN" class="rounded-xl border border-gray-200 px-3 py-2 text-sm">
            <option :value="10">Top 10 行业</option>
            <option :value="15">Top 15 行业</option>
            <option :value="20">Top 20 行业</option>
            <option :value="30">Top 30 行业</option>
          </select>
          <select v-model="sortBy" class="rounded-xl border border-gray-200 px-3 py-2 text-sm">
            <option value="market_heat_ema_5">行业排序：最新热度</option>
            <option value="market_heat_slope_3d">行业排序：3日斜率</option>
            <option value="avg_pct_chg">行业排序：平均涨跌幅</option>
            <option value="amount_share">行业排序：成交额占比</option>
          </select>
        </div>
      </section>

      <section class="card rounded-2xl shadow p-5 mb-6">
        <div class="flex items-center justify-between gap-3 mb-3">
          <div>
            <h2 class="text-lg font-bold">全市场行业趋势折线图</h2>
            <p class="text-sm text-gray-500">一眼看市场主线行业的升温、降温和拐点。</p>
          </div>
          <div class="text-xs text-gray-500">指标：{{ trendMetricLabel }}</div>
        </div>
        <div class="relative overflow-x-auto overflow-y-visible rounded-xl border border-gray-200 p-3">
          <svg :width="chartWidth" :height="chartHeight" class="block">
            <g>
              <line v-for="y in [20,90,160,230,300]" :key="'gy-'+y" :x1="50" :x2="chartWidth-20" :y1="y" :y2="y" stroke="#e5e7eb" stroke-width="1" />
              <line x1="50" :x2="50" y1="20" :y2="chartHeight-30" stroke="#94a3b8" stroke-width="1.5" />
              <line x1="50" :x2="chartWidth-20" :y1="chartHeight-30" :y2="chartHeight-30" stroke="#94a3b8" stroke-width="1.5" />
              <text v-for="tick in chartTicks" :key="'tick-'+tick.value" x="44" :y="tick.y+4" text-anchor="end" font-size="11" fill="#64748b">{{ tick.label }}</text>
              <g v-for="(d, idx) in visibleDates" :key="'x-'+d"><text :x="xForIndex(idx)" :y="chartHeight-10" text-anchor="middle" font-size="11" fill="#64748b">{{ d.slice(4) }}</text></g>
              <g v-for="series in trendSeries" :key="series.sector">
                <polyline :points="series.points" fill="none" :stroke="series.color" :stroke-width="hoveredSector === series.sector ? 5 : 3" :opacity="hoveredSector && hoveredSector !== series.sector ? 0.18 : 1" stroke-linejoin="round" stroke-linecap="round">
                  <title>{{ series.sector }}</title>
                </polyline>
                <polyline :points="series.points" fill="none" stroke="transparent" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" @mousemove="showLineTooltip(series, $event)" @mouseleave="hideLineTooltip()">
                  <title>{{ series.sector }}</title>
                </polyline>
              </g>
            </g>
          </svg>
          <div v-if="lineTooltip.visible" class="pointer-events-none fixed z-[9999] bg-indigo-900 text-white text-xs rounded-lg px-3 py-2 shadow-lg max-w-xs" :style="lineTooltip.style">
            <div class="font-semibold">{{ lineTooltip.sector }}</div>
            <div>当前指标：{{ trendMetricLabel }}</div>
            <div>最新值：{{ fmtValue(lineTooltip.latestValue) }}</div>
            <div v-if="lineTooltip.latestRow">3日斜率：{{ fmtValue(lineTooltip.latestRow.market_heat_slope_3d) }}</div>
            <div v-if="lineTooltip.latestRow">趋势信号：{{ lineTooltip.latestRow.trend_signal }}</div>
            <div v-if="lineTooltip.latestRow">最新热度排名：{{ fmtValue(lineTooltip.latestRow.market_heat_rank) }}</div>
          </div>
        </div>
        <div class="mt-4 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
          <div v-for="row in latestSignalRows" :key="'signal-'+row.industry_name" class="rounded-xl border border-gray-100 bg-gray-50 p-3 cursor-pointer" @click="selectedSector = row.industry_name">
            <div class="flex items-center justify-between gap-2">
              <div class="font-semibold">{{ row.industry_name }}</div>
              <span class="text-xs px-2 py-1 rounded-full" :class="signalClass(row.trend_signal)">{{ row.trend_signal }}</span>
            </div>
            <div class="mt-2 text-xs text-gray-500">3日斜率 {{ fmtValue(row.market_heat_slope_3d) }} ｜ 热度排名 {{ fmtValue(row.market_heat_rank) }}</div>
            <div class="mt-1 text-xs text-gray-500">均涨 {{ fmtPct(row.avg_pct_chg) }} ｜ 成交占比 {{ fmtPct(row.amount_share * 100) }}</div>
          </div>
        </div>
        <div class="mt-4 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2 text-xs">
          <div v-for="series in trendSeries" :key="'legend-'+series.sector" class="flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer transition-all" :class="hoveredSector === series.sector ? 'bg-indigo-50 border-indigo-200 shadow' : hoveredSector && hoveredSector !== series.sector ? 'bg-gray-50 border-gray-100 opacity-40' : 'bg-gray-50 border-gray-100'" @click="selectedSector = series.sector" @mouseenter="hoveredSector = series.sector" @mouseleave="hoveredSector = ''">
            <span class="legend-line w-8" :style="{ background: series.color }"></span>
            <span class="font-semibold">{{ series.sector }}</span>
            <span class="text-gray-500 ml-auto">最新 {{ fmtValue(series.latestValue) }}</span>
          </div>
        </div>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">最新交易日全市场行业 Top {{ topN }}</h2>
          <div class="space-y-3">
            <div v-for="row in latestRows" :key="row.industry_name" class="border border-gray-100 rounded-xl p-3 cursor-pointer" @click="selectedSector = row.industry_name">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <div class="font-semibold">{{ row.industry_name }}</div>
                  <div class="text-xs text-gray-500">热度排名 {{ fmtValue(row.market_heat_rank) }} ｜ 趋势 {{ row.trend_signal }}</div>
                </div>
                <div class="text-right">
                  <div class="font-bold text-indigo-600">{{ fmtValue(row[metric]) }}</div>
                  <div class="text-xs text-gray-500">均涨 {{ fmtPct(row.avg_pct_chg) }}</div>
                </div>
              </div>
              <div class="mt-2 text-xs text-gray-500">上涨占比 {{ fmtPct(row.up_ratio * 100) }} ｜ 强势占比 {{ fmtPct(row.strong_ratio * 100) }} ｜ 成交占比 {{ fmtPct(row.amount_share * 100) }}</div>
              <div class="mt-2 flex flex-wrap gap-2 text-xs">
                <span v-for="s in (row.hot_stocks || [])" class="px-2 py-1 rounded bg-gray-100 text-gray-700">{{ s.ts_code }} {{ fmtPct(s.pct_chg) }}</span>
              </div>
            </div>
          </div>
        </section>

        <section class="card rounded-2xl shadow p-5">
          <h2 class="text-lg font-bold mb-3">全市场行业热力矩阵</h2>
          <div class="grid-wrap rounded-xl border border-gray-200">
            <table class="min-w-full text-sm">
              <thead><tr class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide"><th class="sticky-col px-3 py-3 text-left">行业</th><th v-for="d in visibleDates" :key="d" class="px-2 py-3 text-center">{{ d }}</th></tr></thead>
              <tbody>
                <tr v-for="sector in visibleSectors" :key="sector" class="border-t border-gray-100">
                  <td class="sticky-col px-3 py-3 font-semibold text-gray-800">{{ sector }}</td>
                  <td v-for="d in visibleDates" :key="sector + '-' + d" class="px-2 py-2 text-center"><div class="heat-cell" :style="heatStyle(cellValue(sector, d))">{{ fmtValue(cellValue(sector, d)) }}</div></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>

      <section class="card rounded-2xl shadow p-5">
        <div class="flex items-center justify-between gap-3 mb-3">
          <div>
            <h2 class="text-lg font-bold">行业热门股票</h2>
            <p class="text-sm text-gray-500">默认展示当前选中行业；未选中时展示热度第一行业。</p>
          </div>
          <div class="text-xs text-gray-500">当前行业：{{ focusSector || '-' }}</div>
        </div>
        <div v-if="focusRow" class="space-y-3">
          <div class="text-sm text-gray-600">趋势信号：{{ focusRow.trend_signal }} ｜ 热度排名：{{ fmtValue(focusRow.market_heat_rank) }} ｜ 行业均涨：{{ fmtPct(focusRow.avg_pct_chg) }}</div>
          <div class="flex flex-wrap gap-2">
            <div v-for="s in (focusRow.hot_stocks || [])" class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-100 text-sm">
              <div class="font-semibold">{{ s.ts_code }}</div>
              <div class="text-xs text-gray-500">涨跌 {{ fmtPct(s.pct_chg) }}</div>
            </div>
          </div>
        </div>
        <div v-else class="text-sm text-gray-400">暂无热门股票数据。</div>
      </section>
    </template>
  </main>
</div>
<script>
Vue.createApp({
  data() {
    return { loading:true, error:'', data:{}, rows:[], metric:'market_heat_ema_5', trendMetric:'market_heat_ema_5', topN:15, sortBy:'market_heat_ema_5', selectedSector:'', lineTooltip:{visible:false, sector:'', latestValue:null, latestRow:null, style:{}}, hoveredSector:'', linePalette:['#2563eb','#dc2626','#059669','#7c3aed','#ea580c','#0f766e','#be123c','#4338ca','#16a34a','#ca8a04'] };
  },
  computed: {
    dateOptions() { return [...new Set(this.rows.map(x => x.trade_date))].sort(); },
    visibleDates() { return this.dateOptions; },
    sectorOptions() {
      const latest = this.data.latest_trade_date;
      const latestRows = this.rows.filter(r => r.trade_date === latest);
      const sorted = [...latestRows].sort((a,b)=>Number(b[this.sortBy]||-999)-Number(a[this.sortBy]||-999));
      return sorted.map(r => r.industry_name);
    },
    visibleSectors() { return this.sectorOptions.slice(0, this.topN); },
    latestRows() { return this.rows.filter(r => r.trade_date === this.data.latest_trade_date && this.visibleSectors.includes(r.industry_name)).sort((a,b)=>Number(b[this.sortBy]||-999)-Number(a[this.sortBy]||-999)); },
    latestSignalRows() { return this.rows.filter(r => r.trade_date === this.data.latest_trade_date && this.visibleSectors.includes(r.industry_name)).sort((a,b)=>Number(b.market_heat_slope_3d||-999)-Number(a.market_heat_slope_3d||-999)); },
    trendMetricLabel() { const map={market_heat_ema_5:'市场热度EMA(5)',market_heat_base:'市场基础热度',avg_pct_chg:'行业平均涨跌幅',amount_share:'成交额占比'}; return map[this.trendMetric]||this.trendMetric; },
    chartWidth() { return Math.max(820, this.visibleDates.length * 70 + 80); },
    chartHeight() { return 340; },
    trendValues() {
      const vals=[]; for (const sector of this.visibleSectors) for (const d of this.visibleDates) { const row=this.rows.find(r=>r.industry_name===sector && r.trade_date===d); const val=row?Number(row[this.trendMetric]):NaN; if(!Number.isNaN(val)) vals.push(val);} return vals;
    },
    chartRange() { const vals=this.trendValues; const min=vals.length?Math.min(...vals):0; const max=vals.length?Math.max(...vals):1; const pad=(max-min||1)*0.12; return {min:min-pad,max:max+pad}; },
    chartTicks() { const {min,max}=this.chartRange; const ticks=[]; for(let i=0;i<5;i++){ const value=max-((max-min)*i/4); ticks.push({value,y:this.yForValue(value),label:this.fmtValue(value)});} return ticks; },
    trendSeries() {
      return this.visibleSectors.map((sector,idx)=>{ const color=this.linePalette[idx % this.linePalette.length]; const pts=[]; let latestValue=null; let latestRow=null; this.visibleDates.forEach((d,i)=>{ const row=this.rows.find(r=>r.industry_name===sector && r.trade_date===d); const val=row?Number(row[this.trendMetric]):NaN; if(!Number.isNaN(val)){ pts.push(`${this.xForIndex(i)},${this.yForValue(val)}`); latestValue=val; latestRow=row; }}); return {sector,color,points:pts.join(' '),latestValue,latestRow}; }).filter(s=>s.points);
    },
    focusSector() { return this.selectedSector || (this.latestRows[0] && this.latestRows[0].industry_name) || ''; },
    focusRow() { return this.rows.find(r => r.trade_date === this.data.latest_trade_date && r.industry_name === this.focusSector) || null; },
  },
  methods: {
    xForIndex(idx){ if(this.visibleDates.length<=1) return 50; const usable=this.chartWidth-70; return 50 + usable*idx/(this.visibleDates.length-1); },
    yForValue(value){ const {min,max}=this.chartRange; const usable=this.chartHeight-50; const ratio=(value-min)/((max-min)||1); return 20 + usable - ratio*usable; },
    cellValue(sector,date){ const row=this.rows.find(r=>r.industry_name===sector && r.trade_date===date); return row?row[this.metric]:null; },
    fmtValue(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':n.toFixed(2); },
    fmtPct(v){ if(v===null||v===undefined||v==='') return '-'; const n=Number(v); return Number.isNaN(n)?'-':`${n>=0?'+':''}${n.toFixed(2)}%`; },
    heatStyle(value){ if(value===null||value===undefined||value==='') return {background:'rgba(148,163,184,0.12)',color:'#64748b'}; const n=Number(value); if(Number.isNaN(n)) return {background:'rgba(148,163,184,0.12)',color:'#64748b'}; const intensity=Math.max(0.12, Math.min(Math.abs(this.metric.includes('pct')?n/8:n),1)); return n>=0?{background:`rgba(220,38,38,${0.12+intensity*0.35})`,color:intensity>0.45?'#fff':'#991b1b'}:{background:`rgba(5,150,105,${0.12+intensity*0.35})`,color:intensity>0.45?'#fff':'#065f46'}; },
    signalClass(signal){ if(signal==='升温') return 'bg-red-100 text-red-700'; if(signal==='降温') return 'bg-green-100 text-green-700'; if(signal==='拐点') return 'bg-yellow-100 text-yellow-700'; return 'bg-gray-100 text-gray-700'; },
    showLineTooltip(series,event){ this.hoveredSector=series.sector; this.lineTooltip={ visible:true, sector:series.sector, latestValue:series.latestValue, latestRow:series.latestRow, style:{left:`${event.clientX+12}px`, top:`${event.clientY+12}px`} }; },
    hideLineTooltip(){ this.lineTooltip.visible=false; this.hoveredSector=''; },
  },
  async mounted(){ try{ const resp=await fetch('data/recommendation_analytics/market_industry_heatmap.json?'+Date.now()); if(!resp.ok) throw new Error('market_industry_heatmap.json not found'); this.data=await resp.json(); this.rows=this.data.rows||[]; }catch(err){ this.error=err?.message||'unknown error'; console.error(err);} finally{ this.loading=false; } }
}).mount('#app');
</script>
</body>
</html>
